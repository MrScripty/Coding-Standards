[project]
name = "standards-engine"
version = "0.1.0"
description = "Typed standards navigation and analysis facade"
requires-python = ">=3.11,<3.13"
dependencies = [
    "repository-graph-engine",
    "repository-git",
    "standards-analysis",
    "standards-applicability",
    "standards-contracts",
    "standards-graph",
    "standards-identity",
    "standards-metadata",
    "standards-policy-impact",
    "standards-snapshots",
]

[tool.standards-package]
schema-version = 2
public-import-root = "tools.standards_engine.standards_engine"
repository-entrypoints = [
]

[tool.unittest]
start-directory = "tests"
