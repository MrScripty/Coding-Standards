[project]
name = "standards-metadata"
version = "0.1.0"
description = "Neutral canonical standards metadata loader"
requires-python = ">=3.11,<3.13"
dependencies = [
    "standards-authority",
    "standards-identity",
]

[tool.standards-package]
schema-version = 2
public-import-root = "tools.standards_metadata.standards_metadata"
repository-entrypoints = []

[tool.unittest]
start-directory = "tests"
