[project]
name = "standards-verifier"
version = "0.1.0"
description = "Repository-local declarative verification engine"
requires-python = ">=3.11,<3.13"
dependencies = [
    "repository-graph-engine",
    "repository-git",
    "standards-identity",
    "standards-analysis",
    "standards-applicability",
    "standards-contracts",
    "standards-graph",
    "standards-metadata",
    "standards-policy-impact",
]

[tool.standards-package]
schema-version = 2
public-import-root = "tools.standards_verifier.standards_verifier"
repository-entrypoints = [
    { path = "tools/query_edges.py", arguments = ["--repo-root", "{repository}", "--list-groups"], fixture = "reviewed-repository", remove = [] },
    { path = "tools/verify_git_reachability.py", arguments = ["--repository", "{fixture}", "--manifest", "{manifest}"], fixture = "isolated-git-repository", remove = [] },
    { path = "tools/standards_verifier/verify.py", arguments = ["--repo-root", "{repository}", "--list"], fixture = "reviewed-repository", remove = [] },
    { path = "tools/standards_verifier/generate_inventory.py", arguments = ["--repo-root", "{repository}", "--check"], fixture = "reviewed-repository", remove = [] },
    { path = "tools/standards_verifier/generate_numeric_audit.py", arguments = ["--repo-root", "{fixture}", "--write"], fixture = "isolated-indexed-copy", remove = ["evaluation/standards-effectiveness/generated/numeric-comparison-candidates.tsv"] },
    { path = "tools/standards_verifier/generate_numeric_retirements.py", arguments = ["--repo-root", "{repository}", "--check"], fixture = "reviewed-repository", remove = [] },
]

[tool.unittest]
start-directory = "tests"
