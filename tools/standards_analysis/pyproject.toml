[project]
name = "standards-analysis"
version = "0.1.0"
description = "Read-only standards navigation and impact analysis"
requires-python = ">=3.11,<3.13"
dependencies = [
    "repository-graph-engine",
    "standards-applicability",
    "standards-identity",
    "standards-metadata",
    "standards-policy-impact",
    "standards-snapshots",
]

[tool.standards-package]
schema-version = 2
public-import-root = "tools.standards_analysis.standards_analysis"
repository-entrypoints = []

[tool.unittest]
start-directory = "tests"
