schema_version = 2
provider_contract_version = 2
catalog_contract_version = 2
declaration_schema_version = 2
relationship_kind_contract_version = 2
evidence_owner_rule = "registered-suite-or-consumer-review"

artifact_kinds = [
  "documentation",
  "enforcement-suite",
  "fixture",
  "implementation-artifact",
  "prompt",
  "routing-projection",
  "template",
]

[[groups]]
id = "policy-impact"
purpose = "Reviewed policy owners and the semantic consumers requiring impact review."
directions = ["incoming", "outgoing"]
transitive = false
validator = "standards-verifier:policy-impact"

[[groups]]
id = "semantic"
purpose = "Explicit reviewed semantic relationships between repository artifacts."
directions = ["incoming", "outgoing"]
transitive = false

[[relationship_kinds]]
id = "normative-consumer"
target_class = "canonical-non-reference-module"
groups = ["policy-impact", "semantic"]
propagation = "source-to-consumer"
traversable = true

[[relationship_kinds]]
id = "router-projection"
target_class = "router"
groups = ["policy-impact", "semantic"]
propagation = "source-to-consumer"
traversable = true

[[relationship_kinds]]
id = "prompt-projection"
target_class = "prompt"
groups = ["policy-impact", "semantic"]
propagation = "source-to-consumer"
traversable = true

[[relationship_kinds]]
id = "template-projection"
target_class = "template"
groups = ["policy-impact", "semantic"]
propagation = "source-to-consumer"
traversable = true

[[relationship_kinds]]
id = "reference-projection"
target_class = "canonical-reference-module"
groups = ["policy-impact", "semantic"]
propagation = "source-to-consumer"
traversable = true

[[relationship_kinds]]
id = "documentation-projection"
target_class = "documentation"
groups = ["policy-impact", "semantic"]
propagation = "source-to-consumer"
traversable = true

[[relationship_kinds]]
id = "fixture-projection"
target_class = "fixture"
groups = ["policy-impact", "semantic"]
propagation = "source-to-consumer"
traversable = true

[[relationship_kinds]]
id = "enforcement-suite-projection"
target_class = "enforcement-suite"
groups = ["policy-impact", "semantic"]
propagation = "source-to-consumer"
traversable = true

[[relationship_kinds]]
id = "implementation-projection"
target_class = "implementation-artifact"
groups = ["policy-impact", "semantic"]
propagation = "source-to-consumer"
traversable = true
