schema_version = 2
id = "router.executable-projection"
owner = "router"
source = "STANDARDS-ROUTER.md"
base_modules = ["router"]

[[facts]]
id = "routing.activities"
semantic_revision = 2
type = "enum-set"
nullable = false
values = ["implementation", "verification", "uncertainty-reduction", "planning", "commit", "documentation", "build", "tooling", "release"]
aliases = []
meaning = "The development activities performed by the requested work."
context_kind = "task-route"
answer_contract = "fact-value.v1"
evidence_contract = "evidence-reference.v1"
authorization_capability = "standards.analyze"
prompt = "Which development activities are part of the requested work?"

[[facts]]
id = "routing.workflow-profiles"
semantic_revision = 1
type = "enum-set"
nullable = false
values = ["concurrent-plan-integration"]
aliases = []
meaning = "Workflow profiles selected by observable coordination conditions."
context_kind = "task-route"
answer_contract = "fact-value.v1"
evidence_contract = "evidence-reference.v1"
authorization_capability = "standards.analyze"
prompt = "Can multiple outstanding proposals become stale before serial integration?"

[[facts]]
id = "routing.applications"
semantic_revision = 1
type = "enum-set"
nullable = false
values = ["library", "frontend", "launcher"]
aliases = []
meaning = "Application forms affected by the requested work."
context_kind = "task-route"
answer_contract = "fact-value.v1"
evidence_contract = "evidence-reference.v1"
authorization_capability = "standards.analyze"
prompt = "Which application forms are affected?"

[[facts]]
id = "routing.boundaries"
semantic_revision = 2
type = "enum-set"
nullable = false
values = ["interop", "language-bindings", "generated-contract", "ipc", "persistence"]
aliases = []
meaning = "Authority or representation boundaries crossed by the requested work."
context_kind = "task-route"
answer_contract = "fact-value.v1"
evidence_contract = "evidence-reference.v1"
authorization_capability = "standards.analyze"
prompt = "Which authority or representation boundaries are crossed?"

[[facts]]
id = "routing.languages"
semantic_revision = 1
type = "enum-set"
nullable = false
values = ["csharp-async", "rust", "rust-api", "rust-dependencies", "rust-release", "rust-tooling", "rust-async", "rust-cross-platform", "typescript", "typescript-async"]
aliases = []
meaning = "Language-specific mechanisms affected by the requested work."
context_kind = "task-route"
answer_contract = "fact-value.v1"
evidence_contract = "evidence-reference.v1"
authorization_capability = "standards.analyze"
prompt = "Which language-specific mechanisms are affected?"

[[facts]]
id = "routing.frameworks"
semantic_revision = 1
type = "enum-set"
nullable = false
values = ["godot"]
aliases = []
meaning = "Framework-specific mechanisms affected by the requested work."
context_kind = "task-route"
answer_contract = "fact-value.v1"
evidence_contract = "evidence-reference.v1"
authorization_capability = "standards.analyze"
prompt = "Which framework-specific mechanisms are affected?"

[[facts]]
id = "routing.topics"
semantic_revision = 1
type = "enum-set"
nullable = false
values = ["accessibility", "diagnostics", "contracts", "concurrency", "resilience", "cross-platform", "dependencies", "licensing", "performance", "architecture", "security"]
aliases = []
meaning = "Cross-cutting concerns affected by the requested work."
context_kind = "task-route"
answer_contract = "fact-value.v1"
evidence_contract = "evidence-reference.v1"
authorization_capability = "standards.analyze"
prompt = "Which cross-cutting concerns are affected?"

