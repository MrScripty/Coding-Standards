schema_version = 2
id = "router.executable-projection"
owner = "router"
source = "STANDARDS-ROUTER.md"
base_modules = ["router"]

[[facts]]
id = "routing.activities"
semantic_revision = 2
type = "enum-set"
nullable = false
values = ["implementation", "verification", "uncertainty-reduction", "planning", "commit", "documentation", "build", "tooling", "release"]
aliases = []
meaning = "The development activities performed by the requested work."
context_kind = "task-route"
answer_contract = "fact-value.v1"
evidence_contract = "evidence-reference.v1"
authorization_capability = "standards.analyze"
prompt = "Which development activities are part of the requested work?"

[[facts]]
id = "routing.applications"
semantic_revision = 1
type = "enum-set"
nullable = false
values = ["library", "frontend", "launcher"]
aliases = []
meaning = "Application forms affected by the requested work."
context_kind = "task-route"
answer_contract = "fact-value.v1"
evidence_contract = "evidence-reference.v1"
authorization_capability = "standards.analyze"
prompt = "Which application forms are affected?"

[[facts]]
id = "routing.boundaries"
semantic_revision = 2
type = "enum-set"
nullable = false
values = ["interop", "language-bindings", "generated-contract", "ipc", "persistence"]
aliases = []
meaning = "Authority or representation boundaries crossed by the requested work."
context_kind = "task-route"
answer_contract = "fact-value.v1"
evidence_contract = "evidence-reference.v1"
authorization_capability = "standards.analyze"
prompt = "Which authority or representation boundaries are crossed?"

[[facts]]
aliases = []
id = "routing.details"
meaning = "Specialized decisions affected by the task; choose from the conditional detail table after the broad concerns."
nullable = false
prompt = "Does the task involve schemas, protocol adapters, compatibility, replay, advanced test oracles, GUI smoke, target evidence, binding lifecycle, or release operations? Does the task maintain this standards library through its authoring interface?"
semantic_revision = 2
type = "enum-set"
values = ["profile.language.rust.binding-lifecycle", "topic.architecture.replay", "topic.code-design", "topic.contracts.evolution", "topic.contracts.protocols", "topic.contracts.schemas", "workflow.release.operations", "workflow.standards-authoring", "workflow.verification.gui", "workflow.verification.oracles", "workflow.verification.platforms"]
