schema_version = 1

[[cases]]
id = "exported-root-name"
consumer_dependencies = ["b-package"]
consumer_source = '''
from tools.b.b import value
run = value
__all__ = ("run",)
'''
expected_codes = []

[[cases]]
id = "below-root-private-child"
consumer_dependencies = ["b-package"]
consumer_source = '''
from tools.b.b.private import value
__all__ = ("value",)
'''
expected_codes = ["PYTHON_PACKAGE.PRIVATE_IMPORT"]

[[cases]]
id = "root-form-private-child"
consumer_dependencies = ["b-package"]
consumer_source = '''
from tools.b.b import private
__all__ = ("private",)
'''
expected_codes = ["PYTHON_PACKAGE.UNEXPORTED_IMPORT"]

[[cases]]
id = "cross-module-star"
consumer_dependencies = ["b-package"]
consumer_source = '''
from tools.b.b import *
__all__ = ("value",)
'''
expected_codes = ["PYTHON_PACKAGE.STAR_IMPORT"]

[[cases]]
id = "dynamic-import"
consumer_dependencies = []
consumer_source = '''
loaded = __import__("tools.b.b")
__all__ = ("loaded",)
'''
expected_codes = ["PYTHON_PACKAGE.DYNAMIC_IMPORT"]

[[cases]]
id = "assignment-rhs-before-binding"
consumer_dependencies = []
consumer_source = '''
eval = eval("40 + 2")
__all__ = ("eval",)
'''
expected_codes = ["PYTHON_PACKAGE.DYNAMIC_IMPORT"]

[[cases]]
id = "deleted-binding"
consumer_dependencies = []
consumer_source = '''
eval = lambda value: value
del eval
run = eval("40 + 2")
__all__ = ("run",)
'''
expected_codes = ["PYTHON_PACKAGE.DYNAMIC_IMPORT"]

[[cases]]
id = "exception-alias"
consumer_dependencies = []
consumer_source = '''
try:
    raise ValueError("fixture")
except ValueError as eval:
    run = str(eval)
__all__ = ("run",)
'''
expected_codes = []

[[cases]]
id = "conditional-binding"
consumer_dependencies = []
consumer_source = '''
if False:
    eval = lambda value: value
run = eval("40 + 2")
__all__ = ("run",)
'''
expected_codes = ["PYTHON_PACKAGE.DYNAMIC_IMPORT"]

[[cases]]
id = "complete-conditional-benign-binding"
consumer_dependencies = []
consumer_source = '''
condition = True
if condition:
    eval = lambda value: value
else:
    eval = lambda value: value + 1
run = eval(1)
__all__ = ("run",)
'''
expected_codes = []

[[cases]]
id = "conditional-deletion"
consumer_dependencies = []
consumer_source = '''
eval = lambda value: value
if condition:
    del eval
run = eval("40 + 2")
__all__ = ("run",)
'''
expected_codes = ["PYTHON_PACKAGE.DYNAMIC_IMPORT"]

[[cases]]
id = "simple-sys-alias"
consumer_dependencies = []
consumer_source = '''
import sys
registry = sys
run = registry.modules["builtins"].__import__
__all__ = ("run",)
'''
expected_codes = ["PYTHON_PACKAGE.DYNAMIC_IMPORT"]

[[cases]]
id = "conditional-sys-alias"
consumer_dependencies = []
consumer_source = '''
import sys
condition = True
if condition:
    registry = sys
else:
    registry = object()
run = registry.modules["builtins"].__import__
__all__ = ("run",)
'''
expected_codes = ["PYTHON_PACKAGE.DYNAMIC_IMPORT"]

[[cases]]
id = "nested-conditional-sys-alias"
consumer_dependencies = []
consumer_source = '''
import sys
if condition:
    registry = sys
def load():
    return registry.modules["builtins"].__import__
__all__ = ("load",)
'''
expected_codes = ["PYTHON_PACKAGE.DYNAMIC_IMPORT"]

[[cases]]
id = "left-to-right-assignment-targets"
consumer_dependencies = []
consumer_source = '''
values = {}
eval = values[eval] = lambda value: value
run = eval(1)
__all__ = ("run",)
'''
expected_codes = []

[[cases]]
id = "augmented-assignment-bound-target"
consumer_dependencies = []
consumer_source = '''
class Value:
    def __add__(self, other):
        return other
eval = Value()
eval += eval
__all__ = ("eval",)
'''
expected_codes = []

[[cases]]
id = "frozen-dynamic-import-alias"
consumer_dependencies = []
consumer_source = '''
from _frozen_importlib import __import__ as load
loaded = load("tools.b.b")
__all__ = ("loaded",)
'''
expected_codes = ["PYTHON_PACKAGE.DYNAMIC_IMPORT"]
