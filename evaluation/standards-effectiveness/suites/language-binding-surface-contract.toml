schema_version = 1
id = "language-binding-surface-contract"
owner = "profile.boundary.language-bindings"
description = "Selected language-binding exports and evidence with typed outcomes and no implicit surface defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/language-bindings/surface-contract-decisions.tsv"
expected_column = "expected"
default = "expose"
[checks.domains]
case = ["*"]
consumer = ["declared", "missing"]
selection = ["selected", "not-selected", "missing"]
semantics = ["core", "adapter", "unknown"]
support = ["declared", "not-public", "missing"]
host_subset = ["declared", "missing"]
documentation = ["complete", "missing"]
compatibility = ["declared", "missing"]
evidence = ["complete", "missing"]
fallback = ["none", "export-all", "fixed-tiers", "force-parity", "wrapper-semantics", "native-only", "default-success"]
expected = ["expose", "omit", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { all = [
    { field = "semantics", op = "eq", value = "unknown" },
    { field = "selection", op = "eq", value = "selected" },
  ] },
]
[[checks.rules]]
outcome = "omit"
[checks.rules.when]
all = [{ field = "selection", op = "eq", value = "not-selected" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "consumer", op = "eq", value = "missing" },
  { field = "selection", op = "eq", value = "missing" },
  { field = "support", op = "eq", value = "missing" },
  { field = "host_subset", op = "eq", value = "missing" },
  { field = "documentation", op = "eq", value = "missing" },
  { field = "compatibility", op = "eq", value = "missing" },
  { field = "evidence", op = "eq", value = "missing" },
]

[[checks]]
id = "section-inventory"
type = "table"
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
unique = [["id"]]
[[checks.projections]]
columns = ["id"]
order = "source"
expected = [["STD-0768"], ["STD-0769"], ["STD-0770"], ["STD-0771"]]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0768", "STD-0769", "STD-0770", "STD-0771"]

[[checks]]
id = "dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [
  ["STD-0768", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "profiles/boundaries/language-bindings.md", "refine", "select exported operations and representations from declared consumer and product contracts"],
  ["STD-0769", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "profiles/boundaries/language-bindings.md", "refine", "keep domain semantics in canonical owners and expose only explicitly selected binding surfaces"],
  ["STD-0770", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "profiles/boundaries/language-bindings.md", "refine", "derive support publication host subsets and evidence from project facts without fixed tiers or parity"],
  ["STD-0771", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "profiles/boundaries/language-bindings.md", "refine", "require complete lifecycle diagnostic compatibility documentation and evidence facts with typed outcomes"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0768", "STD-0769", "STD-0770", "STD-0771"]
