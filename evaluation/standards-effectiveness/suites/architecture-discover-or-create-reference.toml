schema_version = 1
id = "architecture-discover-or-create-reference"
owner = "reference.patterns.architecture"
description = "Conditional Architecture discover-or-create reference closure without unbounded retry, default success, guaranteed-benefit, carried-input, or legacy-example fallback."

[[checks]]
id = "reference-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/architecture/discover-or-create-reference-decisions.tsv"
expected_column = "expected"
default = "retain"
[checks.domains]
case = ["*"]
contracts = ["complete", "contradictory", "missing"]
discovery = ["missing", "selected"]
creation = ["authorized", "external", "missing", "unsupported"]
coordination = ["missing", "not-needed", "selected"]
readiness = ["missing", "selected"]
retry = ["bounded", "not-needed"]
lifecycle = ["missing", "owned"]
evidence = ["missing", "selected"]
fallback = ["carry-prior-input", "default-success", "guaranteed-benefit", "none", "unbounded-retry"]
expected = ["retain", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "contracts", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "contracts", op = "eq", value = "missing" },
  { field = "discovery", op = "eq", value = "missing" },
  { field = "creation", op = "eq", value = "missing" },
  { field = "coordination", op = "eq", value = "missing" },
  { field = "readiness", op = "eq", value = "missing" },
  { field = "lifecycle", op = "eq", value = "missing" },
  { field = "evidence", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
field = "creation"
op = "eq"
value = "unsupported"

[[checks]]
id = "conditional-reference"
type = "text"
path = "reference/patterns/architecture.md"
required = [
  "### Conditional Pseudocode",
  "resolve_selected_service(contracts)",
  "creation.authorizes(observed)",
  "readiness.observe_within_selected_budget",
  "Every named operation above is a selected contract",
  "does not carry prior invocation state",
  "### Conditional Consequences",
  "remain separate claims",
]
prohibited = [
  "function get_or_create_service(address)",
  "retry connect(address) until ready or timeout",
  "No duplicate services consuming resources",
  "Automatic recovery from crashed instances",
  "Race-condition-safe startup sequence",
]

[[checks]]
id = "legacy-default-removal"
type = "text"
path = "ARCHITECTURE-PATTERNS.md"
required = []
prohibited = [
  "function get_or_create_service(address)",
  "retry connect(address) until ready or timeout",
  "No duplicate services consuming resources",
  "Automatic recovery from crashed instances",
  "Race-condition-safe startup sequence",
]

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [
  ["STD-0104", "ARCHITECTURE-PATTERNS.md", "reference/patterns/architecture.md", "move", "pseudocode remains qualified by selected contracts and cannot authorize unbounded retry or default locking"],
  ["STD-0105", "ARCHITECTURE-PATTERNS.md", "reference/patterns/architecture.md", "move", "consequences remain observable claims requiring affected evidence rather than guaranteed benefits"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0104", "STD-0105"]
