schema_version = 1
id = "rust-release-toolchain"
owner = "profile.language.rust.release"
description = "Supported Rust toolchain declarations with lockfile policy routed to Rust Dependencies."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/release-toolchain-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
contract = ["accepted", "contradictory", "missing"]
release_claim = ["known", "missing"]
dependency_contract = ["known", "missing"]
mechanism = ["lockfile", "toolchain"]
capability = ["supported", "unsupported"]
evidence = ["complete", "incomplete"]
fallback = ["application-lockfile", "existing-lockfile", "fixed-components", "fixed-version", "library-omission", "none", "pinning-default", "resolved-graph-success"]
expected = ["allow", "route-rust-dependency", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "contract", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "contract", op = "eq", value = "missing" }, { field = "release_claim", op = "eq", value = "missing" }, { field = "evidence", op = "eq", value = "incomplete" }, { all = [{ field = "mechanism", op = "eq", value = "lockfile" }, { field = "dependency_contract", op = "eq", value = "missing" }] }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "route-rust-dependency"
[checks.rules.when]
all = [{ field = "mechanism", op = "eq", value = "lockfile" }]


[[checks]]
id = "disposition-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0811", "languages/rust/RUST-RELEASE-STANDARDS.md", "profiles/languages/rust/release.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0811"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0812", "languages/rust/RUST-RELEASE-STANDARDS.md", "reference/recipes/rust-release.md", "move"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0812"}]}}]
