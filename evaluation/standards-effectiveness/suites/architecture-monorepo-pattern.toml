schema_version = 1
id = "architecture-monorepo-pattern"
owner = "reference.patterns.architecture"
description = "Contract-selected monorepo-role illustration with typed no-fixed-catalog outcomes and exact legacy lineage."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/architecture/monorepo-role-decisions.tsv"
expected_column = "expected"
default = "illustrate"
[checks.domains]
case = ["*"]
responsibilities = ["multiple", "one"]
owners = ["complete", "contradictory", "missing"]
contracts = ["complete", "missing"]
change_axes = ["coherent", "independent", "layout-only"]
fallback = ["fixed-role-catalog", "none", "shared-package"]
expected = ["illustrate", "keep-together", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "owners", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "owners", op = "eq", value = "missing" },
  { field = "contracts", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "keep-together"
[checks.rules.when]
any = [
  { field = "responsibilities", op = "eq", value = "one" },
  { field = "change_axes", op = "eq", value = "layout-only" },
]

[[checks]]
id = "reference-projection"
type = "text"
path = "reference/patterns/architecture.md"
required = [
  "## Conditional Monorepo Role Catalog",
  "These are descriptive labels, not required package kinds",
  "The arrows follow selected stable contracts",
  "### Conditional Schema-Sharing Example",
]
prohibited = []

[[checks]]
id = "legacy-routes"
type = "text"
path = "ARCHITECTURE-PATTERNS.md"
required = [
  "[Architecture](topics/architecture.md)",
  "[Contracts](topics/contracts.md)",
  "[Architecture Pattern Reference](reference/patterns/architecture.md#conditional-monorepo-role-catalog)",
]
prohibited = []

[[checks]]
id = "legacy-fixed-defaults"
type = "text"
path = "ARCHITECTURE-PATTERNS.md"
required = []
prohibited = [
  "assign each package a stable architectural role",
  "App packages may compose other roles",
  "Tooling/config packages should support development workflows",
  "place it in a contracts package",
  "shared utilities ─",
]
match_case = "insensitive"

[[checks]]
id = "reference-fixed-defaults"
type = "text"
path = "reference/patterns/architecture.md"
required = []
prohibited = [
  "assign each package a stable architectural role",
  "App packages may compose other roles",
  "Tooling/config packages should support development workflows",
  "place it in a contracts package",
  "shared utilities ─",
]
match_case = "insensitive"

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id"]
order = "source"
expected = [["STD-0034"], ["STD-0035"], ["STD-0036"], ["STD-0037"], ["STD-0038"], ["STD-0039"]]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0034", "STD-0035", "STD-0036", "STD-0037", "STD-0038", "STD-0039"]

[[checks]]
id = "owner-lineage"
type = "keyed_relation"
[checks.keys]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
columns = ["id"]
order = "source"
where = { field = "id", op = "in", values = ["STD-0034", "STD-0035", "STD-0036", "STD-0037", "STD-0038", "STD-0039"] }
[checks.expected]
path = "evaluation/standards-effectiveness/milestone-7-row-36-owner-validation.tsv"
header = ["id", "canonical_owner", "disposition", "reference_treatment", "rationale"]
key = "id"
values = ["canonical_owner", "disposition"]
[checks.observed]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
key = "id"
values = ["target", "disposition"]
