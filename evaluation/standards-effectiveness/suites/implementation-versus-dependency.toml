schema_version = 1
id = "implementation-versus-dependency"
owner = "topic.dependencies"
description = "Implementation-versus-dependency decisions bind semantic difficulty, implementation shape, lifecycle trigger, conformance support, maintenance, security, and maintained local subset cost without automatic retroactive deletion."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/dependencies/implementation-versus-dependency-decisions.tsv"
expected_column = "expected"
default = "implement"
[checks.domains]
case = ["*"]
semantics = ["difficult", "simple"]
shape = ["domain-product", "simple-local", "standardized-reimplementation", "thin-adapter", "unknown"]
lifecycle = ["create", "material-extension", "renewal", "unchanged", "unknown"]
candidate = ["mature", "none", "unknown"]
conformance = ["not-applicable", "supported", "unknown", "unsupported"]
maintenance = ["missing", "owned"]
security = ["missing", "owned"]
local_subset = ["larger", "small", "unknown"]
distinct_semantics = ["no", "not-applicable", "unknown", "yes"]
decision = ["adopt", "local", "undecided"]
automatic_delete = ["no", "yes"]
expected = ["adopt", "implement", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "candidate", op = "eq", value = "unknown" },
  { field = "maintenance", op = "eq", value = "missing" },
  { field = "security", op = "eq", value = "missing" },
  { field = "shape", op = "eq", value = "unknown" },
  { field = "lifecycle", op = "eq", value = "unknown" },
  { field = "distinct_semantics", op = "eq", value = "unknown" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "conformance", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "automatic_delete", op = "eq", value = "yes" },
  { all = [
    { field = "shape", op = "eq", value = "domain-product" },
    { field = "distinct_semantics", op = "eq", value = "no" },
    { field = "candidate", op = "eq", value = "mature" },
    { field = "conformance", op = "eq", value = "supported" },
    { field = "decision", op = "eq", value = "local" },
  ] },
  { all = [
    { field = "semantics", op = "eq", value = "difficult" },
    { field = "shape", op = "eq", value = "standardized-reimplementation" },
    { field = "lifecycle", op = "in", values = ["create", "material-extension", "renewal"] },
    { field = "candidate", op = "eq", value = "mature" },
    { field = "conformance", op = "eq", value = "supported" },
    { field = "local_subset", op = "eq", value = "larger" },
    { field = "decision", op = "eq", value = "local" },
  ] },
]
[[checks.rules]]
outcome = "adopt"
[checks.rules.when]
all = [
  { field = "semantics", op = "eq", value = "difficult" },
  { field = "candidate", op = "eq", value = "mature" },
  { field = "conformance", op = "eq", value = "supported" },
  { field = "decision", op = "eq", value = "adopt" },
]

[[checks]]
id = "registered-consumers"
type = "path_state"
present = [
  "STANDARDS-ROUTER.md",
  "profiles/boundaries/generated-contract.md",
  "prompts/planning.md",
  "prompts/implement-plan.md",
]
