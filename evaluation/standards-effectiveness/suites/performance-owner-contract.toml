schema_version = 1
id = "performance-owner-contract"
owner = "topic.performance"
description = "Owned performance claims, measurement, optimization, and regression evidence without fixed thresholds, workloads, environments, or mechanism defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/performance/owner-contract-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
authority = ["contradictory", "missing", "owned"]
workload = ["alternate", "contradictory", "isolated", "loop", "representative", "startup"]
environment = ["debug", "missing", "representative", "unsupported"]
baseline = ["missing", "present", "stale"]
evidence = ["documentation", "missing", "proved"]
mechanism = ["allocation", "selected"]
fallback = ["allocation-ban", "alternate-workload", "conventional-threshold", "documentation-proof", "hot-loop", "none", "stale-baseline", "weaker-environment"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "authority", op = "eq", value = "contradictory" },
  { field = "workload", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "environment", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "authority", op = "eq", value = "missing" },
  { field = "environment", op = "eq", value = "missing" },
  { field = "baseline", op = "eq", value = "missing" },
  { field = "evidence", op = "eq", value = "missing" },
]

[[checks]]
id = "owner"
type = "text"
path = "topics/performance.md"
required = ["ID: `topic.performance`", "## Performance Claim Authority", "## Measurement Contract", "## Optimization Decision", "## Benchmarks And Regression Evidence", "does not independently", "mechanisms, not defaults", "Documentation records durable claim"]
prohibited = []

[[checks]]
id = "routes-and-legacy"
type = "text"
path = "CODING-STANDARDS.md"
required = ["[Performance](topics/performance.md)"]
prohibited = ["Avoid allocations in hot paths", "Code runs once at startup"]

[[checks]]
id = "router"
type = "text"
path = "STANDARDS-ROUTER.md"
required = ["[Performance](topics/performance.md)"]
prohibited = []

[[checks]]
id = "dispositions"
type = "text"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
required = [
  "STD-0188\tCODING-STANDARDS.md\tCODING-STANDARDS.md\tindex\treplace the performance parent with a non-normative route to canonical Performance authority",
  "STD-0189\tCODING-STANDARDS.md\ttopics/performance.md\trefine\trecord durable claim tradeoff and reproduction facts without a copied performance documentation template",
  "STD-0190\tCODING-STANDARDS.md\ttopics/performance.md\trefine\tdefine performance from an owned metric workload budget environment and consumer claim without a hot-path label default",
  "STD-0191\tCODING-STANDARDS.md\ttopics/performance.md\trefine\tselect optimization mechanisms from measured contributors and tradeoffs without preallocation batching or early-out defaults",
  "STD-0192\tCODING-STANDARDS.md\ttopics/performance.md\trefine\tselect benchmark scope threshold environment and schedule from the claim without fixed targets or automated-regression defaults",
  "STD-0193\tCODING-STANDARDS.md\ttopics/performance.md\trefine\trequire claim-matched measurement and evidence without universal profile documentation benchmark or allocation rules",
  "STD-0194\tCODING-STANDARDS.md\ttopics/performance.md\trefine\toptimize from owned unsatisfied claims and measured contributors without hot-loop startup critical-path or readability slogans",
]
prohibited = []
