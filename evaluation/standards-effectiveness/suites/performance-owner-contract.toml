schema_version = 1
id = "performance-owner-contract"
owner = "topic.performance"
description = "Owned performance claims, measurement, optimization, and regression evidence without fixed thresholds, workloads, environments, or mechanism defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/performance/owner-contract-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
authority = ["contradictory", "missing", "owned"]
workload = ["alternate", "contradictory", "isolated", "loop", "representative", "startup"]
environment = ["debug", "missing", "representative", "unsupported"]
baseline = ["missing", "present", "stale"]
evidence = ["documentation", "missing", "proved"]
mechanism = ["allocation", "selected"]
fallback = ["allocation-ban", "alternate-workload", "conventional-threshold", "documentation-proof", "hot-loop", "none", "stale-baseline", "weaker-environment"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "authority", op = "eq", value = "contradictory" },
  { field = "workload", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "environment", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "authority", op = "eq", value = "missing" },
  { field = "environment", op = "eq", value = "missing" },
  { field = "baseline", op = "eq", value = "missing" },
  { field = "evidence", op = "eq", value = "missing" },
]


[[checks]]
id = "dispositions-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0188", "CODING-STANDARDS.md", "CODING-STANDARDS.md", "index"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0188"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0189", "CODING-STANDARDS.md", "topics/performance.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0189"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0190", "CODING-STANDARDS.md", "topics/performance.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0190"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0191", "CODING-STANDARDS.md", "topics/performance.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0191"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0192", "CODING-STANDARDS.md", "topics/performance.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0192"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0193", "CODING-STANDARDS.md", "topics/performance.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0193"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0194", "CODING-STANDARDS.md", "topics/performance.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0194"}]}}]
