schema_version = 1
id = "owner-state-transitions"
owner = "migration.parent-plan"
description = "Typed baseline, activation, and shared-owner transition decisions for execution-train ownership lifecycle."

[[checks]]
id = "row-transitions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/execution-train/owner-state-transition-decisions.tsv"
expected_column = "expected"
default = "typed-invalid"
[checks.domains]
case = ["*"]
baseline = ["exists", "missing"]
transition = ["none", "missing-to-exists", "repeated", "exists-to-missing"]
completion = ["pending", "complete", "partial"]
filesystem = ["exists", "missing"]
expected = ["allow", "typed-invalid"]
[[checks.rules]]
outcome = "allow"
[checks.rules.when]
any = [
  { all = [
    { field = "baseline", op = "eq", value = "exists" },
    { field = "transition", op = "eq", value = "none" },
    { field = "completion", op = "in", values = ["pending", "complete"] },
    { field = "filesystem", op = "eq", value = "exists" },
  ] },
  { all = [
    { field = "baseline", op = "eq", value = "missing" },
    { field = "transition", op = "eq", value = "none" },
    { field = "completion", op = "in", values = ["pending", "complete"] },
    { field = "filesystem", op = "eq", value = "missing" },
  ] },
  { all = [
    { field = "baseline", op = "eq", value = "missing" },
    { field = "transition", op = "eq", value = "missing-to-exists" },
    { field = "completion", op = "eq", value = "pending" },
    { field = "filesystem", op = "eq", value = "missing" },
  ] },
  { all = [
    { field = "baseline", op = "eq", value = "missing" },
    { field = "transition", op = "eq", value = "missing-to-exists" },
    { field = "completion", op = "eq", value = "complete" },
    { field = "filesystem", op = "eq", value = "exists" },
  ] },
]

[[checks]]
id = "activation-transitions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/execution-train/owner-activation-decisions.tsv"
expected_column = "expected"
default = "typed-invalid"
[checks.domains]
case = ["*"]
transition = ["none", "missing-to-exists"]
activation = ["pre-slice-review", "owner-review", "final-closure", "implicit"]
expected = ["allow", "typed-invalid"]
[[checks.rules]]
outcome = "allow"
[checks.rules.when]
any = [
  { all = [
    { field = "transition", op = "eq", value = "none" },
    { field = "activation", op = "in", values = ["pre-slice-review", "owner-review", "final-closure"] },
  ] },
  { all = [
    { field = "transition", op = "eq", value = "missing-to-exists" },
    { field = "activation", op = "eq", value = "owner-review" },
  ] },
]

[[checks]]
id = "shared-owner-transitions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/execution-train/shared-owner-state-transition-decisions.tsv"
expected_column = "expected"
default = "typed-invalid"
[checks.domains]
case = ["*"]
baseline = ["exists", "missing"]
prior_transition = ["none", "pending", "complete"]
current_transition = ["none", "missing-to-exists"]
current_completion = ["pending", "complete"]
filesystem = ["exists", "missing"]
expected = ["allow", "typed-invalid"]
[[checks.rules]]
outcome = "allow"
[checks.rules.when]
any = [
  { all = [
    { field = "baseline", op = "eq", value = "exists" },
    { field = "prior_transition", op = "eq", value = "none" },
    { field = "current_transition", op = "eq", value = "none" },
    { field = "filesystem", op = "eq", value = "exists" },
  ] },
  { all = [
    { field = "baseline", op = "eq", value = "missing" },
    { field = "prior_transition", op = "in", values = ["none", "pending"] },
    { field = "current_transition", op = "eq", value = "none" },
    { field = "filesystem", op = "eq", value = "missing" },
  ] },
  { all = [
    { field = "baseline", op = "eq", value = "missing" },
    { field = "prior_transition", op = "eq", value = "complete" },
    { field = "current_transition", op = "eq", value = "none" },
    { field = "filesystem", op = "eq", value = "exists" },
  ] },
  { all = [
    { field = "baseline", op = "eq", value = "missing" },
    { field = "prior_transition", op = "eq", value = "none" },
    { field = "current_transition", op = "eq", value = "missing-to-exists" },
    { field = "current_completion", op = "eq", value = "pending" },
    { field = "filesystem", op = "eq", value = "missing" },
  ] },
  { all = [
    { field = "baseline", op = "eq", value = "missing" },
    { field = "prior_transition", op = "eq", value = "none" },
    { field = "current_transition", op = "eq", value = "missing-to-exists" },
    { field = "current_completion", op = "eq", value = "complete" },
    { field = "filesystem", op = "eq", value = "exists" },
  ] },
]

[[checks]]
id = "terminal-authority"
type = "path_state"
present = ["evaluation/standards-effectiveness/suites/owner-state-transitions.toml"]
absent = ["evaluation/standards-effectiveness/verify-owner-state-transitions.sh"]
