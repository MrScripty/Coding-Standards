  { field = "owner_transition", op = "eq", value = "missing-to-exists" },
]

[[checks]]
id = "owner-action-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/execution-train/package-owner-action-decisions.tsv"
expected_column = "expected"
default = "typed-invalid"
[checks.domains]
case = ["*"]
owner_action = ["existing-review", "create-before-populate", "populate-after-create", "closure-only", "implicit"]
baseline = ["exists", "missing"]
prior_creation = ["yes", "no"]
risk = ["mechanical", "consolidation", "new-owner-design"]
verification = ["owner-contract", "migration-structure"]
integration_gate = ["focused", "full-suite"]
expected = ["allow", "typed-invalid"]
[[checks.rules]]
outcome = "allow"
[checks.rules.when]
all = [
  { field = "owner_action", op = "in", values = ["existing-review", "closure-only"] },
  { field = "baseline", op = "eq", value = "exists" },
]
[[checks.rules]]
outcome = "allow"
[checks.rules.when]
all = [
  { field = "owner_action", op = "eq", value = "create-before-populate" },
  { field = "baseline", op = "eq", value = "missing" },
  { field = "risk", op = "eq", value = "new-owner-design" },
  { field = "verification", op = "eq", value = "owner-contract" },
  { field = "integration_gate", op = "eq", value = "full-suite" },
]
[[checks.rules]]
outcome = "allow"
[checks.rules.when]
all = [
  { field = "owner_action", op = "eq", value = "populate-after-create" },
  { field = "baseline", op = "eq", value = "missing" },
  { field = "prior_creation", op = "eq", value = "yes" },
  { field = "risk", op = "eq", value = "consolidation" },
  { field = "verification", op = "eq", value = "migration-structure" },
]

