schema_version = 1
id = "rust-release-workspace-package-metadata"
owner = "profile.language.rust.release"
description = "Accepted Cargo workspace package-metadata mechanisms without layout or inheritance defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/release-workspace-package-metadata-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
release_unit = ["accepted", "contradictory", "missing"]
package_facts = ["accepted", "missing"]
capability = ["supported", "unsupported"]
evidence = ["complete", "incomplete"]
fallback = ["dependency-inheritance", "edition-inheritance", "existing-root-manifest", "license-inheritance", "none", "one-product", "repository-inheritance", "rust-version-inheritance", "shared-version", "version-inheritance", "workspace-layout"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "release_unit", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "release_unit", op = "eq", value = "missing" }, { field = "package_facts", op = "eq", value = "missing" }, { field = "evidence", op = "eq", value = "incomplete" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]


[[checks]]
id = "disposition-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0815", "languages/rust/RUST-RELEASE-STANDARDS.md", "profiles/languages/rust/release.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0815"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0816", "languages/rust/RUST-RELEASE-STANDARDS.md", "reference/recipes/rust-release.md", "move"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0816"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0817", "languages/rust/RUST-RELEASE-STANDARDS.md", "reference/recipes/rust-release.md", "move"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0817"}]}}]
