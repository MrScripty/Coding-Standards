schema_version = 1
id = "accessibility-owner-contract"
owner = "topic.accessibility"
description = "Accessibility authority and modality-neutral mechanism selection with typed invalid, unsupported, and unavailable outcomes and no web, WCAG, keyboard, lint, or default-success fallback."

[[checks]]
id = "owner-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/accessibility/owner-contract-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
users = ["contradictory", "missing", "selected"]
tasks = ["contradictory", "missing", "selected"]
platforms = ["missing", "supported", "unsupported"]
modalities = ["contradictory", "keyboard", "missing", "multiple", "selected"]
conformance = ["contradictory", "missing", "selected", "versioned"]
capability = ["missing", "supported", "unsupported"]
evidence = ["lint-only", "missing", "proved"]
fallback = ["default-success", "keyboard-only", "lint-proof", "none", "universal-wcag", "web"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "users", op = "eq", value = "contradictory" },
  { field = "tasks", op = "eq", value = "contradictory" },
  { field = "modalities", op = "eq", value = "contradictory" },
  { field = "conformance", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
any = [
  { field = "platforms", op = "eq", value = "unsupported" },
  { field = "capability", op = "eq", value = "unsupported" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "users", op = "eq", value = "missing" },
  { field = "tasks", op = "eq", value = "missing" },
  { field = "platforms", op = "eq", value = "missing" },
  { field = "modalities", op = "eq", value = "missing" },
  { field = "conformance", op = "eq", value = "missing" },
  { field = "capability", op = "eq", value = "missing" },
  { field = "evidence", op = "eq", value = "missing" },
]

[[checks]]
id = "exact-disposition"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [["STD-0007", "ACCESSIBILITY-STANDARDS.md", "topics/accessibility.md", "index", "legacy accessibility parent now routes to the canonical modality-neutral owner"]]
[checks.projections.where]
field = "id"
op = "eq"
value = "STD-0007"
