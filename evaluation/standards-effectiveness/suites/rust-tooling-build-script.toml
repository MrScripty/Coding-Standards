schema_version = 1
id = "rust-tooling-build-script"
owner = "profile.language.rust.tooling"
description = "Cargo build-script expression mechanisms after Build authority is accepted."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/tooling-build-script-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
build = ["accepted", "contradictory", "missing"]
owners = ["accepted", "missing"]
capability = ["supported", "unsupported"]
fallback = ["build-success", "compiler", "dependency", "detection-phase", "directive", "existing-script", "none", "out-dir", "purpose", "raw-command", "sparing-use", "timestamp"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "build", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "build", op = "eq", value = "missing" }, { field = "owners", op = "eq", value = "missing" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]


[[checks]]
id = "disposition-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0841", "languages/rust/RUST-TOOLING-STANDARDS.md", "profiles/languages/rust/tooling.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0841"}]}}]
