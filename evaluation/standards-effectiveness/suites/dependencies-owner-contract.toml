schema_version = 1
id = "dependencies-owner-contract"
owner = "topic.dependencies"
description = "Dependency requirement, ownership, candidate, resolution, authority, and evidence decisions without incumbent or mechanism fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/dependencies/owner-contract-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
requirement = ["complete", "contradictory", "missing"]
owner = ["narrow", "shared-proven", "unknown"]
candidate = ["supported", "unsupported"]
constraints = ["complete", "missing"]
resolution = ["missing", "reproducible"]
authority = ["explicit", "missing"]
evidence = ["complete", "failed", "missing"]
fallback = ["alternate-registry", "auto-sudo", "default-success", "global", "implicit-install", "none", "popularity", "standard-library", "successful-noop", "transitive"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "requirement", op = "eq", value = "contradictory" },
  { field = "authority", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "candidate", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "requirement", op = "eq", value = "missing" },
  { field = "owner", op = "eq", value = "unknown" },
  { field = "constraints", op = "eq", value = "missing" },
  { field = "resolution", op = "eq", value = "missing" },
  { field = "evidence", op = "ne", value = "complete" },
]

[[checks]]
id = "disposition-membership"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id"]
order = "source"
expected = [["STD-0496"], ["STD-0497"], ["STD-0498"]]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0496", "STD-0497", "STD-0498"]

[[checks]]
id = "execution-overlay"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
[[checks.projections]]
columns = ["ids", "owner", "owner_state", "activation", "checkpoint"]
order = "source"
expected = [["STD-0496,STD-0497,STD-0498", "topics/dependencies.md", "exists", "pre-slice-review", "focused"]]
[checks.projections.where]
all = [{ field = "baseline_order", op = "eq", value = "14" }, { field = "child_order", op = "eq", value = "3" }]

[[checks]]
id = "execution-train"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-train.tsv"
header = ["order", "wave", "start_id", "end_id", "source", "owner", "owner_state", "activation", "checkpoint"]
[[checks.projections]]
columns = ["start_id", "end_id", "owner", "owner_state", "activation", "checkpoint"]
order = "source"
expected = [["STD-0300", "STD-0348", "topics/dependencies.md", "exists", "pre-slice-review", "focused"]]
[checks.projections.where]
field = "order"
op = "eq"
value = "16"

[[checks]]
id = "accelerated-package"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-accelerated-packages.tsv"
header = ["train_order", "package_id", "risk_class", "owner", "owner_action", "verification_family", "draft_mode", "integration_gate", "semantic_outcome", "prerequisites"]
[[checks.projections]]
columns = ["risk_class", "owner", "owner_action", "verification_family", "integration_gate"]
order = "source"
expected = [["consolidation", "topics/dependencies.md", "existing-review", "decision-table", "full-suite"]]
[checks.projections.where]
field = "train_order"
op = "eq"
value = "16"
