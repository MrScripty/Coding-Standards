schema_version = 1
id = "binding-contract-evolution"
owner = "topic.contracts"
description = "Per-artifact binding contract evolution, regeneration, and version selection from complete contract and deployment facts with typed no-fallback outcomes."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/contracts/binding-evolution-decisions.tsv"
expected_column = "expected"
default = "typed-invalid"
[checks.domains]
case = ["*"]
class = ["internal-coordinated", "persisted", "public-versioned", "distributed-independent", "generated"]
deployment = ["atomic", "independent"]
change = ["compatible", "breaking", "unsupported", "none"]
generator_input = ["changed", "unchanged", "not-applicable"]
version_relation = ["contract-selected", "forced-lockstep", "forced-independent", "missing"]
evidence = ["complete", "missing"]
fallback = ["none", "assume-additive", "regenerate-all", "skip-regeneration", "compatibility-shim", "default-success"]
expected = ["replace", "migrate", "version", "negotiate", "regenerate", "no-regeneration", "typed-invalid", "typed-unsupported", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "version_relation", op = "in", values = ["forced-lockstep", "forced-independent"] },
  { all = [
    { field = "class", op = "eq", value = "internal-coordinated" },
    { field = "deployment", op = "ne", value = "atomic" },
  ] },
  { all = [
    { field = "class", op = "eq", value = "generated" },
    { field = "generator_input", op = "eq", value = "not-applicable" },
  ] },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "change", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "version_relation", op = "eq", value = "missing" },
  { field = "evidence", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "replace"
[checks.rules.when]
all = [{ field = "class", op = "eq", value = "internal-coordinated" }]
[[checks.rules]]
outcome = "migrate"
[checks.rules.when]
all = [{ field = "class", op = "eq", value = "persisted" }]
[[checks.rules]]
outcome = "version"
[checks.rules.when]
all = [{ field = "class", op = "eq", value = "public-versioned" }]
[[checks.rules]]
outcome = "negotiate"
[checks.rules.when]
all = [{ field = "class", op = "eq", value = "distributed-independent" }]
[[checks.rules]]
outcome = "regenerate"
[checks.rules.when]
all = [
  { field = "class", op = "eq", value = "generated" },
  { field = "generator_input", op = "eq", value = "changed" },
]
[[checks.rules]]
outcome = "no-regeneration"
[checks.rules.when]
all = [
  { field = "class", op = "eq", value = "generated" },
  { field = "generator_input", op = "eq", value = "unchanged" },
]

[[checks]]
id = "source-identities"
type = "table"
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "path", "level", "target_role", "disposition", "heading"]
order = "source"
expected = [
  ["STD-0767", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "3", "language-profile", "split", "Compatibility Notes"],
  ["STD-0807", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "2", "language-profile", "split", "Versioning and Compatibility"],
  ["STD-0808", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "3", "language-profile", "split", "Rules"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0767", "STD-0807", "STD-0808"]

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [
  ["STD-0807", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "topics/contracts.md", "refine", "classify binding artifacts and compatibility by actual consumer contracts"],
  ["STD-0808", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "topics/contracts.md", "refine", "regenerate affected outputs and select version relationships from deployment facts"],
  ["STD-0767", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "topics/contracts.md", "refine", "classify every binding artifact independently and reject compatibility or lockstep versions inferred from shared provenance"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0767", "STD-0807", "STD-0808"]
