schema_version = 1
id = "immutable-authority-closure"
owner = "topic.architecture"
description = "Immutable A1b authority uses exact leaf capture, durable direct lookup, owner codecs, roots-only closure, and cold reconstruction."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/architecture/immutable-authority-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
capture = ["exact"]
closure = ["complete", "incomplete"]
store = ["memory-only", "persistent", "unavailable"]
process = ["fresh", "same"]
post_capture_mutation = ["isolated", "visible"]
authorization_view = ["ambient", "immutable"]
provider_view = ["ambient", "immutable"]
expected = ["allow", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "closure", op = "eq", value = "incomplete" },
  { field = "store", op = "eq", value = "unavailable" },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "store", op = "eq", value = "memory-only" },
  { field = "process", op = "eq", value = "same" },
  { field = "post_capture_mutation", op = "eq", value = "visible" },
  { field = "authorization_view", op = "eq", value = "ambient" },
  { field = "provider_view", op = "eq", value = "ambient" },
]

[[checks]]
id = "architecture-policy"
type = "text"
path = "topics/architecture.md"
required = ["## Immutable Authority Closure", "originating process", "live", "missing immutable input with current ambient state"]
prohibited = []

[[checks]]
id = "platform-and-containment"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/architecture/a1b-authority/authority-platform-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
platform = ["linux", "windows", "macos"]
filesystem = ["ext4", "ntfs", "apfs"]
path_state = ["exact", "alias", "replaced"]
containment = ["contained", "escaped", "contradictory"]
capability = ["available", "unavailable"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unavailable" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
any = [
  { field = "platform", op = "in", values = ["windows", "macos"] },
  { field = "filesystem", op = "in", values = ["ntfs", "apfs"] },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "path_state", op = "in", values = ["alias", "replaced"] },
  { field = "containment", op = "in", values = ["escaped", "contradictory"] },
]

[[checks]]
id = "persistence-owner"
type = "text"
path = "profiles/boundaries/persistence.md"
required = ["ID: `profile.boundary.persistence`"]
prohibited = []

[[checks]]
id = "a1b-authority-closure"
type = "path_state"
present = [
  "tools/standards_authority/standards_authority/__init__.py",
  "tools/standards_authority/standards_authority/capture.py",
  "tools/standards_authority/standards_authority/closure.py",
  "tools/standards_authority/standards_authority/repository.py",
  "tools/standards_authority/standards_authority/snapshot.py",
  "tools/standards_authority/standards_authority/store.py",
  "tools/standards_authority/tests/test_closure.py",
  "tools/standards_authority/tests/test_repository.py",
  "tools/standards_authority/tests/test_snapshot.py",
  "tools/standards_authority/tests/test_sqlite_store.py",
  "tools/standards_analysis/standards_analysis/authority.py",
  "tools/standards_analysis/standards_analysis/kernel.py",
  "tools/standards_analysis/standards_analysis/trust.py",
  "tools/standards_engine/standards_engine/authority.py",
  "tools/standards_engine/standards_engine/engine.py",
  "tools/standards_engine/tests/test_analysis.py",
  "tools/standards_engine/tests/test_c7_analysis.py",
  "tools/standards_engine/tests/test_navigation.py",
  "evaluation/standards-effectiveness/fixtures/architecture/a1b-authority/authority-platform-decisions.tsv",
]
absent = [
  "tools/standards_analysis/standards_analysis/facts.py",
  "tools/standards_analysis/standards_analysis/resolution.py",
  "tools/standards_analysis/standards_analysis/results.py",
  "tools/standards_analysis/standards_analysis/snapshots.py",
  "tools/standards_analysis/tests/test_facts.py",
  "tools/standards_analysis/tests/test_results.py",
  "tools/standards_analysis/tests/test_snapshots.py",
]
