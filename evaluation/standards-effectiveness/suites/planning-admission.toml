schema_version = 1
id = "planning-admission"
owner = "workflow.planning"
description = "Explicit ordinary-plan admission and lifecycle decisions without plan discovery, inferred operations, or a universal revision protocol."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/planning/admission-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
path = ["escape", "missing", "valid"]
operation = ["continue", "missing", "start", "verify"]
state = ["Accepted", "Active", "Blocked", "Deferred", "Implemented", "Planned", "Superseded", "Verifying"]
linked_artifacts = ["complete", "missing"]
fallback = ["infer", "none", "scan"]
expected = ["allow", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
all = [{ field = "fallback", op = "ne", value = "none" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "path", op = "eq", value = "missing" },
  { field = "operation", op = "eq", value = "missing" },
  { field = "state", op = "in", values = ["Blocked", "Deferred"] },
  { field = "linked_artifacts", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "path", op = "eq", value = "escape" },
  { field = "state", op = "in", values = ["Accepted", "Superseded"] },
  { all = [{ field = "operation", op = "eq", value = "start" }, { field = "state", op = "ne", value = "Planned" }] },
  { all = [{ field = "operation", op = "eq", value = "continue" }, { field = "state", op = "ne", value = "Active" }] },
  { all = [{ field = "operation", op = "eq", value = "verify" }, { field = "state", op = "not_in", values = ["Implemented", "Verifying"] }] },
]

[[checks]]
id = "planning-workflow"
type = "text"
path = "workflows/planning.md"
required = ["## Explicit Plan Admission", "`start` accepts only `Planned`", "`continue` accepts only `Active`", "`verify` accepts `Implemented` or `Verifying`", "## Concurrent Integration Routing", "Ordinary planning does not require a revision digest", "## Policy Projection Completeness", "semantically distinguishable"]
prohibited = ["`planning-admission-v1`", "`planning-transition-v1`", "length-delimited", "`complete-transition`", "`restore-prior-state`", "`supersede-transition`"]

[[checks]]
id = "implementation-consumer"
type = "text"
path = "workflows/implementation.md"
required = ["explicit canonical", "Consume the Planning workflow's path, operation, lifecycle", "only when Router applicability", "selects the Concurrent Plan Integration profile", "Ordinary implementation must", "not request or invent those records", "scan for a plan", "infer an operation"]
prohibited = ["admission, transition identity,", "compatibility, revision-gate, evidence, and reconciliation decisions"]

[[checks]]
id = "work-slice-proportionality"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/planning/work-slice-proportionality.tsv"
input_columns = ["bounded", "boundary", "sequencing", "independent_acceptance", "risk", "split_value", "commits", "concurrency", "record_change"]
[checks.domains]
case = ["*"]
bounded = ["no", "yes"]
boundary = ["cross-layer", "none", "public-or-ui"]
sequencing = ["material", "none"]
independent_acceptance = ["no", "yes"]
risk = ["bounded", "material"]
split_value = ["material", "none"]
commits = ["one", "several"]
concurrency = ["none", "stale-capable"]
record_change = ["accepted-boundary", "current-authority", "material-deviation", "none", "verification-result"]
expected_plan = ["none", "written"]
expected_slices = ["one", "vertical"]
expected_artifact_update = ["no", "yes"]
expected_concurrent_profile = ["exclude", "select"]
expected_concurrent_records = ["omit", "require"]

[[checks.outputs]]
column = "expected_plan"
default = "none"
[[checks.outputs.rules]]
outcome = "written"
[checks.outputs.rules.when]
any = [
  { field = "sequencing", op = "eq", value = "material" },
  { field = "independent_acceptance", op = "eq", value = "yes" },
  { field = "risk", op = "eq", value = "material" },
  { field = "concurrency", op = "eq", value = "stale-capable" },
]

[[checks.outputs]]
column = "expected_slices"
default = "one"
[[checks.outputs.rules]]
outcome = "vertical"
[checks.outputs.rules.when]
all = [{ field = "split_value", op = "eq", value = "material" }]

[[checks.outputs]]
column = "expected_artifact_update"
default = "no"
[[checks.outputs.rules]]
outcome = "yes"
[checks.outputs.rules.when]
all = [{ field = "record_change", op = "ne", value = "none" }]

[[checks.outputs]]
column = "expected_concurrent_profile"
default = "exclude"
[[checks.outputs.rules]]
outcome = "select"
[checks.outputs.rules.when]
all = [{ field = "concurrency", op = "eq", value = "stale-capable" }]

[[checks.outputs]]
column = "expected_concurrent_records"
default = "omit"
[[checks.outputs.rules]]
outcome = "require"
[checks.outputs.rules.when]
all = [{ field = "concurrency", op = "eq", value = "stale-capable" }]
