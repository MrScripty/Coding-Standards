schema_version = 1
id = "planning-admission"
owner = "workflow.planning"
description = "Explicit ordinary-plan admission and lifecycle decisions without plan discovery, inferred operations, or a universal revision protocol."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/planning/admission-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
path = ["escape", "missing", "valid"]
operation = ["continue", "missing", "start", "verify"]
state = ["Accepted", "Active", "Blocked", "Deferred", "Implemented", "Planned", "Superseded", "Verifying"]
linked_artifacts = ["complete", "missing"]
fallback = ["infer", "none", "scan"]
expected = ["allow", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
all = [{ field = "fallback", op = "ne", value = "none" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "path", op = "eq", value = "missing" },
  { field = "operation", op = "eq", value = "missing" },
  { field = "state", op = "in", values = ["Blocked", "Deferred"] },
  { field = "linked_artifacts", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "path", op = "eq", value = "escape" },
  { field = "state", op = "in", values = ["Accepted", "Superseded"] },
  { all = [{ field = "operation", op = "eq", value = "start" }, { field = "state", op = "ne", value = "Planned" }] },
  { all = [{ field = "operation", op = "eq", value = "continue" }, { field = "state", op = "ne", value = "Active" }] },
  { all = [{ field = "operation", op = "eq", value = "verify" }, { field = "state", op = "not_in", values = ["Implemented", "Verifying"] }] },
]

[[checks]]
id = "planning-workflow"
type = "text"
path = "workflows/planning.md"
required = ["## Explicit Plan Admission", "`start` accepts only `Planned`", "`continue` accepts only `Active`", "`verify` accepts `Implemented` or `Verifying`", "## Concurrent Integration Routing", "Ordinary planning does not require a revision digest", "## Policy Projection Completeness", "semantically distinguishable"]
prohibited = ["`planning-admission-v1`", "`planning-transition-v1`", "length-delimited", "`complete-transition`", "`restore-prior-state`", "`supersede-transition`"]

[[checks]]
id = "implementation-consumer"
type = "text"
path = "workflows/implementation.md"
required = ["explicit canonical", "Consume the Planning workflow", "Do not", "scan for a plan", "infer an operation"]
prohibited = []
