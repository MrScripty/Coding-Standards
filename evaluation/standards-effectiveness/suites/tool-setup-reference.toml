schema_version = 1
id = "tool-setup-reference"
owner = "reference/recipes/tooling.md"
description = "Non-normative legacy tool setup examples without product or installation authority."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/tooling/tool-setup-reference-decisions.tsv"
expected_column = "expected"
default = "allow-reference"
[checks.domains]
case = ["*"]
role = ["normative", "reference"]
authority = ["implicit", "none"]
fallback = ["command-success", "implicit-install", "minimum-tool-list", "none", "product-default"]
expected = ["allow-reference", "typed-invalid"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "role", op = "eq", value = "normative" }, { field = "authority", op = "ne", value = "none" }]


[[checks]]
id = "disposition-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0701", "TOOLING-STANDARDS.md", "reference/recipes/tooling.md", "move"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0701"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0702", "TOOLING-STANDARDS.md", "reference/recipes/tooling.md", "move"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0702"}]}}]
