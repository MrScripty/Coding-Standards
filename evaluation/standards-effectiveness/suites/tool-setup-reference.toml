schema_version = 1
id = "tool-setup-reference"
owner = "reference/recipes/tooling.md"
description = "Non-normative legacy tool setup examples without product or installation authority."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/tooling/tool-setup-reference-decisions.tsv"
expected_column = "expected"
default = "allow-reference"
[checks.domains]
case = ["*"]
role = ["normative", "reference"]
authority = ["implicit", "none"]
fallback = ["command-success", "implicit-install", "minimum-tool-list", "none", "product-default"]
expected = ["allow-reference", "typed-invalid"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "role", op = "eq", value = "normative" }, { field = "authority", op = "ne", value = "none" }]

[[checks]]
id = "reference"
type = "text"
path = "reference/recipes/tooling.md"
required = ["## Legacy Tool Setup And Package Script Example", "historical illustration only", "\"lint:critical\"", "\"prepare\": \"lefthook install\"", "none of this example is a default"]
prohibited = []
[[checks]]
id = "former-source"
type = "text"
path = "TOOLING-STANDARDS.md"
required = ["legacy setup and package-script examples"]
prohibited = ["### Minimum Setup", "### Commands to Add", "\"lint:critical\""]
[[checks]]
id = "disposition"
type = "text"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
required = ["STD-0701\tTOOLING-STANDARDS.md\treference/recipes/tooling.md\tmove\t", "STD-0702\tTOOLING-STANDARDS.md\treference/recipes/tooling.md\tmove\t"]
prohibited = []
