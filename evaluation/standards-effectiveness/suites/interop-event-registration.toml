schema_version = 1
id = "interop-event-registration"
owner = "profile.boundary.interop"
description = "Provider-governed event registration, delivery, unregistration, release, shutdown ordering, conditional Concurrency ownership, and phase-aware typed outcomes without cleanup fallbacks."

