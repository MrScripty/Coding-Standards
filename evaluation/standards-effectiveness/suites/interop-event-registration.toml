expected = ["allow", "preserve-provider-outcome", "typed-invalid", "typed-unsupported", "typed-unavailable", "typed-incomplete"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "input_scope", op = "eq", value = "retained-prior" },
  { all = [
    { field = "local_work", op = "eq", value = "outliving" },
    { field = "work_owner", op = "ne", value = "concurrency-owner" },
  ] },
  { all = [
    { field = "local_work", op = "eq", value = "inline" },
    { field = "work_owner", op = "ne", value = "callback-scope" },
  ] },
  { all = [
    { field = "observed_order", op = "not_in", values = ["not-required", "unknown", "incomplete"] },
    { field = "observed_order", op = "ne_field", other_field = "selected_order" },
  ] },
  { all = [
    { field = "phase", op = "eq", value = "released" },
    { any = [
      { field = "provider_delivery", op = "ne", value = "stopped" },
      { field = "release", op = "ne", value = "complete" },
    ] },
  ] },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [
  { field = "phase", op = "eq", value = "pre-registration" },
  { field = "capability", op = "eq", value = "unsupported" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
all = [
  { field = "phase", op = "eq", value = "pre-registration" },
  { any = [
    { field = "capability", op = "eq", value = "unavailable" },
    { field = "unregister_contract", op = "ne", value = "selected" },
    { field = "order_contract", op = "ne", value = "selected" },
  ] },
]
[[checks.rules]]
outcome = "typed-incomplete"
[checks.rules.when]
all = [
  { field = "phase", op = "ne", value = "pre-registration" },
  { any = [
    { field = "capability", op = "ne", value = "available" },
    { field = "unregister_contract", op = "ne", value = "selected" },
    { field = "order_contract", op = "ne", value = "selected" },
    { field = "in_flight", op = "in", values = ["incomplete", "unknown"] },
    { field = "unregister_outcome", op = "in", values = ["incomplete", "unknown"] },
    { field = "release", op = "in", values = ["incomplete", "unavailable"] },
    { field = "observed_order", op = "in", values = ["unknown", "incomplete"] },
    { all = [
      { field = "unregister_action", op = "ne", value = "none" },
      { field = "observed_order", op = "eq", value = "not-required" },
    ] },
  ] },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
field = "fallback"
op = "ne"
value = "none"
[[checks.rules]]
outcome = "preserve-provider-outcome"
[checks.rules.when]
field = "unregister_outcome"
op = "eq"
value = "provider-reject"

