schema_version = 1
id = "rust-unsafe-contracts"
owner = "profile.language.rust.unsafe"
description = "Rust unsafe proof, caller, module, feature-path, and verification contracts without safe-path fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/unsafe-contract-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
operation_proof = ["complete", "incomplete", "absent"]
caller_contract = ["complete", "incomplete", "absent", "not-required"]
module_invariants = ["complete", "incomplete", "absent", "not-required"]
wrapper = ["valid", "overclaims"]
verification = ["selected", "unavailable", "alternate-only", "not-run"]
feature_execution = ["direct", "disabled-only", "safe-default-only", "not-applicable"]
expected = ["allow", "typed-invalid", "evidence-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "operation_proof", op = "ne", value = "complete" },
  { field = "caller_contract", op = "in", values = ["incomplete", "absent"] },
  { field = "module_invariants", op = "in", values = ["incomplete", "absent"] },
  { field = "wrapper", op = "ne", value = "valid" },
  { field = "verification", op = "in", values = ["alternate-only", "not-run"] },
  { field = "feature_execution", op = "in", values = ["disabled-only", "safe-default-only"] },
]
[[checks.rules]]
outcome = "evidence-unavailable"
[checks.rules.when]
field = "verification"
op = "eq"
value = "unavailable"

[[checks]]
id = "exact-source-inventory"
type = "table"
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
[[checks.projections]]
columns = ["id"]
order = "source"
expected = [
  ["STD-0843"], ["STD-0844"], ["STD-0845"],
  ["STD-0846"], ["STD-0847"], ["STD-0848"],
]
[checks.projections.where]
field = "path"
op = "eq"
value = "languages/rust/RUST-UNSAFE-STANDARDS.md"

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
non_empty = ["rationale"]
[[checks.projections]]
columns = ["id", "source", "target", "disposition"]
order = "source"
expected = [
  ["STD-0843", "languages/rust/RUST-UNSAFE-STANDARDS.md", "profiles/languages/rust/unsafe.md", "move"],
  ["STD-0844", "languages/rust/RUST-UNSAFE-STANDARDS.md", "profiles/languages/rust/unsafe.md", "refine"],
  ["STD-0845", "languages/rust/RUST-UNSAFE-STANDARDS.md", "profiles/languages/rust/unsafe.md", "refine"],
  ["STD-0846", "languages/rust/RUST-UNSAFE-STANDARDS.md", "profiles/languages/rust/unsafe.md", "refine"],
  ["STD-0847", "languages/rust/RUST-UNSAFE-STANDARDS.md", "profiles/languages/rust/unsafe.md", "refine"],
  ["STD-0848", "languages/rust/RUST-UNSAFE-STANDARDS.md", "profiles/languages/rust/unsafe.md", "refine"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0843", "STD-0844", "STD-0845", "STD-0846", "STD-0847", "STD-0848"]

[[checks]]
id = "metadata-closure"
type = "metadata_graph"
paths = ["CORE-STANDARDS.md", "workflows/verification.md", "profiles/languages/rust/README.md", "profiles/languages/rust/unsafe.md", "workflows/verification/oracles.md", "workflows/verification/platforms.md", "workflows/verification/gui.md", "topics/code-design.md"]
