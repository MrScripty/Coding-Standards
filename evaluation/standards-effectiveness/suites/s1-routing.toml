schema_version = 1
id = "s1-routing"
owner = "migration.parent-plan"
description = "Checks resolvable Markdown links, fact-driven routing outcomes. Does not certify prose quality, consumer compliance, or unexecuted runtime behavior."

[[checks]]
id = "verifier-change-route-closure"
type = "metadata_route"
path = "evaluation/standards-effectiveness/fixtures/routing/verifier-change-decisions.tsv"
header = ["case", "routing.activities", "routing.topics", "expected_architecture", "expected_performance", "expected_planning", "expected_route"]
facts = ["routing.activities", "routing.topics"]
expectations_path = "evaluation/standards-effectiveness/fixtures/routing/verifier-change-routes.tsv"
route_column = "expected_route"
resolved = "route"
unresolved = "unresolved"
selections = [{ column = "expected_architecture", excluded = "exclude", module = "topic.architecture", selected = "select" }, { column = "expected_performance", excluded = "exclude", module = "topic.performance", selected = "select" }, { column = "expected_planning", excluded = "exclude", module = "workflow.planning", selected = "select" }]

[[checks]]
id = "local-links"
type = "markdown_links"
paths = ["CORE-STANDARDS.md", "STANDARDS-ROUTER.md", "workflows/implementation.md", "workflows/verification.md", "profiles/applications/library.md", "profiles/languages/rust/README.md"]
