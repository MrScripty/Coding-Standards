schema_version = 1
id = "s1-routing"
owner = "migration.parent-plan"
description = "Exact S1 Rust-library and verifier-change routing, metadata closure, local links, bounded context, and root full-library-read prohibition without Bash execution or fallback inference."

[[checks]]
id = "verifier-change-routing"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/routing/verifier-change-decisions.tsv"
input_columns = ["module_boundary", "dependency_direction", "performance_concern", "migration_lifecycle", "facts"]
[checks.domains]
case = ["*"]
module_boundary = ["changed", "unchanged", "unknown"]
dependency_direction = ["changed", "unchanged", "unknown"]
performance_concern = ["changed", "none", "unknown"]
migration_lifecycle = ["changed", "none", "unknown"]
facts = ["complete", "missing"]
expected_architecture = ["exclude", "select", "unresolved"]
expected_performance = ["exclude", "select", "unresolved"]
expected_migration = ["exclude", "select", "unresolved"]
expected_route = ["route", "unresolved"]

[[checks.outputs]]
column = "expected_architecture"
default = "exclude"
[[checks.outputs.rules]]
outcome = "unresolved"
[checks.outputs.rules.when]
all = [{ field = "facts", op = "eq", value = "missing" }]
[[checks.outputs.rules]]
outcome = "select"
[checks.outputs.rules.when]
any = [
  { field = "module_boundary", op = "eq", value = "changed" },
  { field = "dependency_direction", op = "eq", value = "changed" },
]

[[checks.outputs]]
column = "expected_performance"
default = "exclude"
[[checks.outputs.rules]]
outcome = "unresolved"
[checks.outputs.rules.when]
all = [{ field = "facts", op = "eq", value = "missing" }]
[[checks.outputs.rules]]
outcome = "select"
[checks.outputs.rules.when]
all = [{ field = "performance_concern", op = "eq", value = "changed" }]

[[checks.outputs]]
column = "expected_migration"
default = "exclude"
[[checks.outputs.rules]]
outcome = "unresolved"
[checks.outputs.rules.when]
all = [{ field = "facts", op = "eq", value = "missing" }]
[[checks.outputs.rules]]
outcome = "select"
[checks.outputs.rules.when]
all = [{ field = "migration_lifecycle", op = "eq", value = "changed" }]

[[checks.outputs]]
column = "expected_route"
default = "route"
[[checks.outputs.rules]]
outcome = "unresolved"
[checks.outputs.rules.when]
all = [{ field = "facts", op = "eq", value = "missing" }]

[[checks]]
id = "metadata-closure"
type = "metadata_graph"
paths = [
  "CORE-STANDARDS.md",
  "STANDARDS-ROUTER.md",
  "workflows/implementation.md",
  "workflows/verification.md",
  "profiles/applications/library.md",
  "profiles/languages/rust/README.md",
]

[[checks]]
id = "core-id"
type = "text"
path = "CORE-STANDARDS.md"
required = ["\n- ID: `core`\n"]

[[checks]]
id = "router-id"
type = "text"
path = "STANDARDS-ROUTER.md"
required = ["\n- ID: `router`\n"]

[[checks]]
id = "bounded-planning-route"
type = "text"
path = "STANDARDS-ROUTER.md"
required = ["Apply the bounded-local exclusion before Planning triggers", "does not require a written plan merely because it touches multiple files"]
prohibited = ["Multi-step work, architectural decisions, or re-planning"]

[[checks]]
id = "implementation-id"
type = "text"
path = "workflows/implementation.md"
required = ["\n- ID: `workflow.implementation`\n"]

[[checks]]
id = "verification-id"
type = "text"
path = "workflows/verification.md"
required = ["\n- ID: `workflow.verification`\n"]

[[checks]]
id = "library-profile-id"
type = "text"
path = "profiles/applications/library.md"
required = ["\n- ID: `profile.application.library`\n"]

[[checks]]
id = "rust-profile-id"
type = "text"
path = "profiles/languages/rust/README.md"
required = ["\n- ID: `profile.language.rust`\n"]

[[checks]]
id = "local-links"
type = "markdown_links"
paths = [
  "CORE-STANDARDS.md",
  "STANDARDS-ROUTER.md",
  "workflows/implementation.md",
  "workflows/verification.md",
  "profiles/applications/library.md",
  "profiles/languages/rust/README.md",
]

[[checks]]
id = "context-budget"
type = "line_budget"
paths = [
  "CORE-STANDARDS.md",
  "STANDARDS-ROUTER.md",
  "workflows/implementation.md",
  "workflows/verification.md",
  "profiles/applications/library.md",
  "profiles/languages/rust/README.md",
]
baseline_path = "evaluation/standards-effectiveness/generated/summary.tsv"
baseline_key = "normative_and_derived_lines"
maximum_numerator = 1
maximum_denominator = 4

[[checks]]
id = "root-routing-boundary"
type = "text"
path = "README.md"
prohibited = ["Read each document"]
