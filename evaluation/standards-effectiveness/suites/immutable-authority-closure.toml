schema_version = 1
id = "immutable-authority-closure"
owner = "topic.architecture"
description = "Immutable result handles require complete transitive authority, durable storage, fresh-process reconstruction, and isolation from later source mutation."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/architecture/immutable-authority-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
capture = ["exact"]
closure = ["complete", "incomplete"]
store = ["memory-only", "persistent", "unavailable"]
process = ["fresh", "same"]
post_capture_mutation = ["isolated", "visible"]
authorization_view = ["ambient", "immutable"]
provider_view = ["ambient", "immutable"]
expected = ["allow", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "closure", op = "eq", value = "incomplete" },
  { field = "store", op = "eq", value = "unavailable" },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "store", op = "eq", value = "memory-only" },
  { field = "process", op = "eq", value = "same" },
  { field = "post_capture_mutation", op = "eq", value = "visible" },
  { field = "authorization_view", op = "eq", value = "ambient" },
  { field = "provider_view", op = "eq", value = "ambient" },
]

[[checks]]
id = "architecture-policy"
type = "text"
path = "topics/architecture.md"
required = ["## Immutable Authority Closure", "originating process", "live", "missing immutable input with current ambient state"]
prohibited = []

[[checks]]
id = "persistence-owner"
type = "text"
path = "profiles/boundaries/persistence.md"
required = ["ID: `profile.boundary.persistence`"]
prohibited = []

