schema_version = 1
id = "frontend-view-model-lineage"
owner = "profile.application.frontend"
description = "Frontend view-model legacy lineage to selected projection and synchronization authority without fixed-class fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/frontend/view-model-lineage-decisions.tsv"
expected_column = "expected"
default = "route"
[checks.domains]
case = ["*"]
authority = ["complete", "contradictory", "missing", "presentation-local"]
source_contract = ["complete", "missing", "not-applicable"]
projection = ["supported", "unsupported"]
interaction = ["complete", "missing"]
lifecycle = ["complete", "missing"]
fallback = ["backend-location", "copied-state", "dedicated-class", "fixed-subscription", "none"]
expected = ["route", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "authority", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "authority", op = "eq", value = "missing" },
  { field = "source_contract", op = "eq", value = "missing" },
  { field = "interaction", op = "eq", value = "missing" },
  { field = "lifecycle", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
field = "projection"
op = "eq"
value = "unsupported"

[[checks]]
id = "legacy-routes"
type = "text"
path = "ARCHITECTURE-PATTERNS.md"
required = [
  "[Frontend application profile](profiles/applications/frontend.md#projection-authority)",
  "[Architecture](topics/architecture.md#data-and-state-authority)",
  "[Verification](workflows/verification.md#selecting-claims)",
  "[Frontend mechanism recipes](reference/recipes/frontend.md)",
  "does not require a dedicated class",
]
prohibited = []

[[checks]]
id = "canonical-sections"
type = "text"
path = "profiles/applications/frontend.md"
required = ["## Projection Authority", "## Rendering And Synchronization"]
prohibited = []

[[checks]]
id = "reference-section"
type = "text"
path = "reference/recipes/frontend.md"
required = ["## Illustrative Synchronization Mechanisms"]
prohibited = []

[[checks]]
id = "legacy-fixed-defaults"
type = "text"
path = "ARCHITECTURE-PATTERNS.md"
required = []
prohibited = [
  "Separate data management from presentation using dedicated view model objects",
  "Subscribe to data source",
  "Don't duplicate backend-owned data",
  "class UserListViewModel",
  "Forward action to backend",
  "Same view model for different view implementations",
]
match_case = "insensitive"

[[checks]]
id = "reference-fixed-defaults"
type = "text"
path = "reference/recipes/frontend.md"
required = []
prohibited = [
  "Separate data management from presentation using dedicated view model objects",
  "Subscribe to data source",
  "Don't duplicate backend-owned data",
  "class UserListViewModel",
  "Forward action to backend",
  "Same view model for different view implementations",
]
match_case = "insensitive"

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "target", "disposition"]
order = "source"
expected = [
  ["STD-0081", "profiles/applications/frontend.md", "index"],
  ["STD-0082", "profiles/applications/frontend.md", "merge-duplicate"],
  ["STD-0083", "profiles/applications/frontend.md", "merge-duplicate"],
  ["STD-0084", "profiles/applications/frontend.md", "split"],
  ["STD-0085", "reference/recipes/frontend.md", "merge-duplicate"],
  ["STD-0086", "workflows/verification.md", "merge-duplicate"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0081", "STD-0082", "STD-0083", "STD-0084", "STD-0085", "STD-0086"]

[[checks]]
id = "owner-lineage"
type = "keyed_relation"
[checks.keys]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
columns = ["id"]
order = "source"
where = { field = "id", op = "in", values = ["STD-0081", "STD-0082", "STD-0083", "STD-0084", "STD-0085", "STD-0086"] }
[checks.expected]
path = "evaluation/standards-effectiveness/milestone-7-row-37-owner-validation.tsv"
header = ["id", "canonical_owner", "disposition", "reference_treatment", "rationale"]
key = "id"
values = ["canonical_owner", "disposition"]
[checks.observed]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
key = "id"
values = ["target", "disposition"]
