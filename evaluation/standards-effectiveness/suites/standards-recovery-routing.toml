schema_version = 1
id = "standards-recovery-routing"
owner = "router"
description = "Checks current metadata graph constraints, fact-driven routing outcomes. Does not certify prose quality, consumer compliance, or unexecuted runtime behavior."

[[checks]]
id = "requires-closure"
type = "metadata_route"
path = "evaluation/standards-effectiveness/fixtures/routing/generated-contract-decisions.tsv"
header = ["case", "program_consumer", "generated_source", "cross_language", "process_boundary", "durable_state", "diagnostics", "security", "facts", "expected_generated_contract", "expected_language_binding", "expected_ipc", "expected_persistence", "expected_diagnostics", "expected_security", "expected_route"]
expectations_path = "evaluation/standards-effectiveness/fixtures/routing/generated-contract-routes.tsv"
route_column = "expected_route"
resolved = "route"
unresolved = "unresolved"
base_modules = ["router", "workflow.planning", "workflow.implementation", "workflow.verification", "workflow.documentation", "workflow.build", "workflow.tooling", "topic.architecture", "topic.contracts", "topic.dependencies", "profile.application.library"]
selections = [{ column = "expected_generated_contract", excluded = "exclude", module = "profile.boundary.generated-contract", selected = "select" }, { column = "expected_language_binding", excluded = "exclude", module = "profile.boundary.language-bindings", selected = "select" }, { column = "expected_ipc", excluded = "exclude", module = "profile.boundary.ipc", selected = "select" }, { column = "expected_persistence", excluded = "exclude", module = "profile.boundary.persistence", selected = "select" }, { column = "expected_diagnostics", excluded = "exclude", module = "topic.diagnostics", selected = "select" }, { column = "expected_security", excluded = "exclude", module = "topic.security", selected = "select" }]

[[checks]]
id = "metadata-closure"
type = "metadata_graph"
paths = ["CORE-STANDARDS.md", "STANDARDS-ROUTER.md", "profiles/boundaries/generated-contract.md", "topics/architecture.md", "topics/contracts.md", "topics/dependencies.md", "workflows/build.md", "workflows/commit.md", "workflows/development-proportionality.md", "workflows/documentation.md", "workflows/implementation.md", "workflows/planning.md", "workflows/release.md", "workflows/tooling.md", "workflows/verification.md", "topics/architecture/replay.md", "topics/contracts/schemas.md", "topics/contracts/protocols.md", "topics/contracts/evolution.md", "workflows/verification/oracles.md", "workflows/verification/platforms.md", "workflows/release/operations.md", "workflows/verification/gui.md", "topics/code-design.md"]
