schema_version = 1
id = "milestone-7-row-25-decomposition"
owner = "migration.parent-plan"
description = "Accepted row 25 implementation-entrypoint decomposition with exact identity, ownership, disposition, report, and lifecycle evidence."

[[checks]]
id = "execution-decomposition"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
non_empty = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
unique = [["baseline_order", "child_order"]]
[[checks.projections]]
columns = ["child_order", "ids", "source", "owner"]
order = "source"
expected = [["1", "STD-0852,STD-0853,STD-0854,STD-0855,STD-0856,STD-0857,STD-0858", "prompts/implement-plan.md", "workflows/implementation.md"]]
[checks.projections.where]
field = "baseline_order"
op = "eq"
value = "25"

[[checks]]
id = "decomposition-identities"
type = "relation"
mode = "set"
[checks.left]
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
columns = ["ids"]
order = "source"
[checks.left.where]
field = "baseline_order"
op = "eq"
value = "25"
[checks.left.split]
field = "ids"
delimiter = ","
[checks.right]
path = "evaluation/standards-effectiveness/milestone-7-row-25-owner-validation.tsv"
header = ["id", "owner", "disposition", "rationale"]
columns = ["id"]
order = "source"

[[checks]]
id = "disposition-lineage"
type = "relation"
mode = "set"
[checks.left]
path = "evaluation/standards-effectiveness/milestone-7-row-25-owner-validation.tsv"
header = ["id", "owner", "disposition", "rationale"]
columns = ["id", "owner", "disposition"]
order = "source"
[checks.right]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
columns = ["id", "target", "disposition"]
order = "source"
[checks.right.where]
field = "source"
op = "eq"
value = "prompts/implement-plan.md"

