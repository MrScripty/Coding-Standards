schema_version = 1
id = "documentation-traceability-policy"
owner = "workflow.documentation"
description = "Documentation decision traceability from explicit change inputs and mappings without path, mode, branch, or skip defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/documentation/traceability-policy-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
facts = ["complete", "contradictory"]
mapping = ["complete", "missing"]
input = ["missing", "range", "staged"]
capability = ["supported", "unsupported"]
fallback = ["adjacent-revisions", "broad-directory", "default-branch", "none", "readme-per-directory", "skip-unresolved", "src-directory", "staged-mode", "unrelated-adr"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "facts", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "mapping", op = "eq", value = "missing" }, { field = "input", op = "eq", value = "missing" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]


[[checks]]
id = "dispositions-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0696", "TOOLING-STANDARDS.md", "workflows/documentation.md", "index"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0696"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0697", "TOOLING-STANDARDS.md", "workflows/documentation.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0697"}]}}]
