schema_version = 1
id = "testing-persisted-contract-artifacts"
owner = "topic.contracts"
description = "Persisted contract-artifact evidence from declared authority, supported versions, deterministic derivation, consumer proof, and provenance without stale or inferred substitutes."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/contracts/persisted-artifact-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
artifact_role = ["authored", "derived"]
authority = ["declared", "inferred", "missing"]
version = ["invalid", "supported", "unsupported"]
derivation = ["deterministic", "guessed", "missing", "not-required"]
consumer_evidence = ["complete", "missing"]
provenance = ["complete", "missing"]
action = ["accept", "regenerate", "validate"]
substitute = ["consumer-guess", "generation-success", "inferred-authority", "none", "overwrite", "parse-success", "producer-snapshot", "stale"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "substitute", op = "ne", value = "none" },
  { field = "authority", op = "eq", value = "inferred" },
  { field = "derivation", op = "eq", value = "guessed" },
  { field = "version", op = "eq", value = "invalid" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "version", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "authority", op = "eq", value = "missing" },
  { field = "derivation", op = "eq", value = "missing" },
  { field = "consumer_evidence", op = "eq", value = "missing" },
  { field = "provenance", op = "eq", value = "missing" },
]


[[checks]]
id = "dispositions-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0635", "TESTING-STANDARDS.md", "topics/contracts.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0635"}]}}]
