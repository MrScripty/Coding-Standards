schema_version = 1
id = "testing-persisted-contract-artifacts"
owner = "topic.contracts"
description = "Persisted contract-artifact evidence from declared authority, supported versions, deterministic derivation, consumer proof, and provenance without stale or inferred substitutes."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/contracts/persisted-artifact-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
artifact_role = ["authored", "derived"]
authority = ["declared", "inferred", "missing"]
version = ["invalid", "supported", "unsupported"]
derivation = ["deterministic", "guessed", "missing", "not-required"]
consumer_evidence = ["complete", "missing"]
provenance = ["complete", "missing"]
action = ["accept", "regenerate", "validate"]
substitute = ["consumer-guess", "generation-success", "inferred-authority", "none", "overwrite", "parse-success", "producer-snapshot", "stale"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "substitute", op = "ne", value = "none" },
  { field = "authority", op = "eq", value = "inferred" },
  { field = "derivation", op = "eq", value = "guessed" },
  { field = "version", op = "eq", value = "invalid" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "version", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "authority", op = "eq", value = "missing" },
  { field = "derivation", op = "eq", value = "missing" },
  { field = "consumer_evidence", op = "eq", value = "missing" },
  { field = "provenance", op = "eq", value = "missing" },
]

[[checks]]
id = "canonical-policy"
type = "text"
path = "topics/contracts.md"
required = ["## Persisted Contract Artifacts"]
prohibited = []

[[checks]]
id = "canonical-policy-detail-1"
type = "text"
path = "topics/contracts/evolution.md"
required = ["canonical authority, applicable contract version", "Validation proves that the current artifact satisfies", "Regeneration proves deterministic derivation", "it does not by itself prove that consumers accept", "Do not accept a stale artifact"]
prohibited = []

[[checks]]
id = "testing-route-and-legacy"
type = "text"
path = "TESTING-STANDARDS.md"
required = ["topics/contracts.md"]
prohibited = ["must be validated or regenerated before commit"]

[[checks]]
id = "dispositions"
type = "text"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
required = ["STD-0635\tTESTING-STANDARDS.md\ttopics/contracts.md\trefine\trequire canonical authority version derivation provenance and producer-consumer evidence for persisted contract artifacts without stale-shape inferred-authority consumer-guess overwrite producer-snapshot parse-success or regeneration-success fallback"]
prohibited = []

[[checks]]
id = "row-18-route"
type = "text"
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
required = ["18\t4\tSTD-0635\tTESTING-STANDARDS.md\ttopics/contracts.md\texists\tpre-slice-review\tfocused"]
prohibited = []
