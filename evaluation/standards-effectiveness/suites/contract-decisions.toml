schema_version = 1
id = "contract-decisions"
owner = "topic.contracts"
description = "Contract-class decisions, persistence and deployment boundaries, derived-state recovery, degraded results, and typed handling when substitute authority is unknown."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/contracts/decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
class = ["internal-coordinated", "persisted", "public-versioned", "distributed-independent", "generated"]
deployment = ["atomic", "independent"]
state = ["ephemeral", "authoritative", "derived"]
substitute = ["none", "authoritative-equivalent", "unknown"]
action = ["replace", "migrate", "version", "negotiate", "regenerate", "rebuild-derived", "degrade-defined", "typed-unavailable", "typed-invalid", "typed-unsupported"]
expected = ["allow", "typed-invalid"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { all = [
    { field = "action", op = "eq", value = "replace" },
    { any = [
      { field = "deployment", op = "ne", value = "atomic" },
      { field = "state", op = "eq", value = "authoritative" },
    ] },
  ] },
  { all = [
    { field = "action", op = "eq", value = "rebuild-derived" },
    { any = [
      { field = "state", op = "ne", value = "derived" },
      { field = "substitute", op = "ne", value = "authoritative-equivalent" },
    ] },
  ] },
  { all = [
    { field = "action", op = "eq", value = "degrade-defined" },
    { field = "substitute", op = "ne", value = "authoritative-equivalent" },
  ] },
  { all = [
    { field = "substitute", op = "eq", value = "unknown" },
    { field = "action", op = "not_in", values = ["typed-unavailable", "typed-invalid", "typed-unsupported"] },
  ] },
]

[[checks]]
id = "documentation-projection"
type = "text"
path = "evaluation/standards-effectiveness/README.md"
required = [
  "`fixtures/contracts/decisions.tsv` and the registered `contract-decisions`\nsuite check coordinated replacement",
  "invalid derived-state rebuilds",
  "untyped handling of an\nunknown substitute",
]
prohibited = ["verify-contract-decisions.sh"]
