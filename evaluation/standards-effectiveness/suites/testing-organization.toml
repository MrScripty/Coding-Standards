schema_version = 1
id = "testing-organization"
owner = "workflow.verification"
description = "Owner-selected test placement, discovery, tooling, execution, and naming without placement, suite-label, naming-template, or documentation fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/verification/test-organization-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
owner = ["contradictory", "known", "missing"]
discovery = ["contradictory", "known", "missing"]
tooling = ["known", "missing", "unsupported"]
execution = ["known", "missing"]
placement = ["colocated", "multiple-owned", "test-root", "unknown"]
fallback = ["colocated-default", "hybrid-default", "mirrored-default", "name-template", "none", "readme-required", "suite-label"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "owner", op = "eq", value = "contradictory" },
  { field = "discovery", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
field = "tooling"
op = "eq"
value = "unsupported"
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "owner", op = "eq", value = "missing" },
  { field = "discovery", op = "eq", value = "missing" },
  { field = "tooling", op = "eq", value = "missing" },
  { field = "execution", op = "eq", value = "missing" },
]

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id"]
order = "lexical"
expected = [["STD-0603"], ["STD-0604"], ["STD-0605"], ["STD-0606"], ["STD-0607"]]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0603", "STD-0604", "STD-0605", "STD-0606", "STD-0607"]
