schema_version = 1
id = "testing-async-evidence"
owner = "workflow.verification"
description = "Async completion and failure evidence at the selected boundary without syntax, generic-error, or weaker-boundary fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/verification/async-completion-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
completion = ["contradictory", "missing", "owned"]
states = ["cancellation", "contradictory", "failure", "missing", "partial", "retry-exhausted", "running", "success", "timeout"]
boundary = ["contradictory", "local", "process", "service"]
timing = ["missing", "not-applicable", "owned"]
diagnostics = ["not-applicable", "owned"]
mechanism = ["await", "clock", "event", "harness", "join", "observe", "unsupported"]
substitute = ["await-syntax", "generic-error", "none"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "substitute", op = "ne", value = "none" },
  { field = "completion", op = "eq", value = "contradictory" },
  { field = "states", op = "eq", value = "contradictory" },
  { field = "boundary", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "mechanism", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "completion", op = "eq", value = "missing" },
  { field = "states", op = "eq", value = "missing" },
  { field = "timing", op = "eq", value = "missing" },
]


[[checks]]
id = "dispositions-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0636", "TESTING-STANDARDS.md", "workflows/verification.md", "index"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0636"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0637", "TESTING-STANDARDS.md", "workflows/verification.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0637"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0638", "TESTING-STANDARDS.md", "workflows/verification.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0638"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0640", "TESTING-STANDARDS.md", "workflows/verification.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0640"}]}}]
