[checks.classifications]
retained-diff = "present"
deferred-row38 = "absent"
deferred-row47 = "absent"

[[checks]]
id = "closure-manifest"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-final-source-closure.tsv"
header = ["order", "source", "canonical_owner", "current_shape", "treatment", "retention_evidence", "risk", "concurrency", "gate"]
non_empty = ["order", "source", "canonical_owner", "current_shape", "treatment", "retention_evidence", "risk", "concurrency", "gate"]
unique = [["order"], ["source"]]
members = { key = "source", path = "evaluation/standards-effectiveness/corpus.tsv", header = ["path", "kind", "normative", "target_role", "preliminary_disposition", "baseline_source"], columns = ["path"], order = "source", where = { all = [{ field = "kind", op = "eq", value = "standard" }, { field = "normative", op = "eq", value = "derived" }] } }
[[checks.projections]]
columns = ["source", "canonical_owner", "current_shape", "treatment"]
order = "lexical"
expected = [
  ["CODING-STANDARDS.md", "CORE-STANDARDS.md", "expanded", "rewrite-index"],
  ["COMMIT-STANDARDS.md", "workflows/commit.md", "concise", "retain-index"],
  ["CONCURRENCY-STANDARDS.md", "topics/concurrency.md", "expanded", "rewrite-index"],
  ["CROSS-PLATFORM-STANDARDS.md", "topics/cross-platform.md", "expanded", "rewrite-index"],
