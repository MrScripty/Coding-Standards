  ["FRONTEND-STANDARDS.md", "profiles/applications/frontend.md", "concise", "rewrite-index"],
  ["PLAN-STANDARDS.md", "workflows/planning.md", "concise", "retain-index"],
  ["SECURITY-STANDARDS.md", "topics/security.md", "expanded", "rewrite-index"],
]
