schema_version = 1
id = "source-index-closures"
owner = "verification-engine.migration-source-closure"
description = "Checks current navigation link coverage, resolvable Markdown links. Does not certify prose quality, consumer compliance, or unexecuted runtime behavior."

[[checks]]
id = "source-links"
type = "markdown_links"
members = { columns = ["path"], header = ["path", "kind", "normative", "target_role", "preliminary_disposition", "baseline_source"], order = "source", path = "evaluation/standards-effectiveness/corpus.tsv", where = { all = [{ field = "kind", op = "eq", value = "standard" }, { field = "normative", op = "eq", value = "derived" }] } }

[[checks]]
id = "coding-routes"
type = "markdown_link_coverage"
path = "CODING-STANDARDS.md"
identity = "destination"
members = { columns = ["destination"], header = ["source", "route", "destination"], order = "source", path = "evaluation/standards-effectiveness/fixtures/source-closure/routes.tsv", where = { field = "source", op = "eq", value = "CODING-STANDARDS.md" } }

