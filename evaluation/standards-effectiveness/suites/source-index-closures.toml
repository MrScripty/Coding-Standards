schema_version = 1
id = "source-index-closures"
owner = "verification-engine.migration-source-closure"
description = "Declarative closure proof for registered former normative source indexes without a policy-specific engine interface."

[[checks]]
id = "undisposed-baseline-headings"
type = "baseline_markdown_headings"
inventory = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
