schema_version = 1
id = "rust-tooling-baseline-commands"
owner = "profile.language.rust.tooling"
description = "Contract-selected Cargo baseline command mechanisms without universal command defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/tooling-baseline-command-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
claim = ["accepted", "contradictory", "missing"]
scope = ["known", "unknown"]
capability = ["supported", "unsupported"]
environment = ["known", "unknown"]
fallback = ["all-features", "all-targets", "command-success", "conventional-command", "doctest", "local-and-ci", "no-default-features", "none", "public-feature-category", "warning-denial", "workspace-scope"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "claim", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "claim", op = "eq", value = "missing" }, { field = "scope", op = "eq", value = "unknown" }, { field = "environment", op = "eq", value = "unknown" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]

[[checks]]
id = "profile"
type = "text"
path = "profiles/languages/rust/tooling.md"
required = ["## Cargo Baseline Command Mechanisms", "After Verification selects claims", "does not create a universal baseline"]
prohibited = []
[[checks]]
id = "reference"
type = "text"
path = "reference/recipes/rust-tooling.md"
required = ["## Cargo Baseline Command Examples", "cargo clippy --workspace", "illustrative only after Verification"]
prohibited = []
[[checks]]
id = "former-source"
type = "text"
path = "languages/rust/RUST-TOOLING-STANDARDS.md"
required = []
prohibited = ["Every Rust workspace should define local and CI commands"]
[[checks]]
id = "disposition"
type = "text"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
required = ["STD-0832\tlanguages/rust/RUST-TOOLING-STANDARDS.md\tprofiles/languages/rust/tooling.md\tsplit\t"]
prohibited = []
