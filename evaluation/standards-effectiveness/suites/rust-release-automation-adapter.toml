schema_version = 1
id = "rust-release-automation-adapter"
owner = "profile.language.rust.release"
description = "Contract-selected Rust release automation adapters without tool or procedure defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/release-automation-adapter-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
procedure = ["accepted", "contradictory", "missing"]
tool = ["missing", "selected"]
capability = ["supported", "unsupported"]
evidence = ["complete", "incomplete"]
fallback = ["cargo-release", "changelog-replacement", "command-success", "consolidate-commits", "first-release", "installed-tool", "manual-acceptable", "none", "shared-version", "stable-cadence", "tag-prefix"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "procedure", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "procedure", op = "eq", value = "missing" }, { field = "tool", op = "eq", value = "missing" }, { field = "evidence", op = "eq", value = "incomplete" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]


[[checks]]
id = "disposition-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0818", "languages/rust/RUST-RELEASE-STANDARDS.md", "profiles/languages/rust/release.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0818"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0819", "languages/rust/RUST-RELEASE-STANDARDS.md", "reference/recipes/rust-release.md", "move"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0819"}]}}]
