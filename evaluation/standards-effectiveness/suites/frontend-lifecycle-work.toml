schema_version = 1
id = "frontend-lifecycle-work"
owner = "profile.application.frontend"
description = "Frontend-owned lifecycle work with explicit identity, cleanup, terminal state, and evidence and no mechanism fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/frontend/lifecycle-work-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
scope = ["selected", "unselected"]
owner = ["missing", "present"]
identity = ["missing", "present"]
mechanism = ["animation", "missing", "none", "observer", "subscription", "timer", "unsupported"]
start = ["none", "selected"]
terminal = ["complete", "duplicate", "none", "observed", "stale", "superseded", "unobserved"]
cleanup = ["complete", "incomplete", "missing", "none"]
evidence = ["complete", "missing", "none"]
fallback = ["default-success", "detached", "fixed-cadence", "global-timer", "none", "ref-holder", "retry", "silent-stale", "state-holder"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "terminal", op = "in", values = ["duplicate", "stale", "unobserved"] }, { field = "cleanup", op = "eq", value = "incomplete" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "mechanism", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
all = [{ field = "scope", op = "eq", value = "selected" }, { any = [{ field = "owner", op = "eq", value = "missing" }, { field = "identity", op = "eq", value = "missing" }, { field = "mechanism", op = "eq", value = "missing" }, { field = "cleanup", op = "eq", value = "missing" }, { field = "evidence", op = "eq", value = "missing" }] }]

[[checks]]
id = "profile"
type = "text"
path = "profiles/applications/frontend.md"
required = ["## Lifecycle-Owned Frontend Work", "Concurrency owns generic work lifecycle", "Select a resource holder and cleanup trigger", "mechanism, not a default", "Prevent duplicate active work and stale result application", "Do not", "stale-result discard"]
prohibited = []

[[checks]]
id = "reference"
type = "text"
path = "reference/recipes/frontend.md"
required = ["## Illustrative React Timer Adapter", "This example does not select React", "duplicate exclusion", "stale-result rejection"]
prohibited = []

[[checks]]
id = "disposition-lineage"
type = "keyed_relation"
[checks.keys]
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
columns = ["ids"]
order = "source"
where = { all = [{ field = "baseline_order", op = "eq", value = "34" }, { field = "child_order", op = "eq", value = "3" }] }
split = { field = "ids", delimiter = "," }
[checks.expected]
path = "evaluation/standards-effectiveness/milestone-7-row-34-owner-validation.tsv"
header = ["id", "owner", "disposition", "rationale"]
key = "id"
values = ["owner", "disposition"]
[checks.observed]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
key = "id"
values = ["target", "disposition"]
