schema_version = 1
id = "rust-wire-representation"
owner = "profile.language.rust.language-bindings"
description = "Selected-schema Rust wire representation with complete attributes, consumer agreement, typed failures, and native-host evidence."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/wire-representation-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
schema = ["selected", "missing", "contradictory"]
serializer = ["selected", "missing", "contradictory"]
attributes = ["complete", "none-applicable", "incomplete", "contradictory"]
consumer = ["aligned", "mismatch", "missing"]
variant = ["supported", "unsupported", "malformed"]
capability = ["available", "unavailable"]
evidence = ["native-host-round-trip", "producer-only", "missing"]
fallback = ["none", "default-shape", "schema-free-json", "native-layout", "unknown-sentinel", "omit-variant", "alternate-serializer", "generated-assumption", "weaker-evidence"]
expected = ["allow", "typed-invalid", "typed-unsupported", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "schema", op = "eq", value = "contradictory" },
  { field = "serializer", op = "eq", value = "contradictory" },
  { field = "attributes", op = "in", values = ["incomplete", "contradictory"] },
  { field = "consumer", op = "eq", value = "mismatch" },
  { field = "variant", op = "eq", value = "malformed" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "variant", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "schema", op = "eq", value = "missing" },
  { field = "serializer", op = "eq", value = "missing" },
  { field = "consumer", op = "eq", value = "missing" },
  { field = "capability", op = "eq", value = "unavailable" },
  { field = "evidence", op = "ne", value = "native-host-round-trip" },
]

[[checks]]
id = "source-membership"
type = "table"
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
non_empty = ["id", "path"]
unique = [["id"]]
[checks.domains]
path = ["languages/rust/RUST-INTEROP-STANDARDS.md"]
[checks.members]
path = "evaluation/standards-effectiveness/fixtures/rust/wire-representation-members.tsv"
header = ["id"]
columns = ["id"]
order = "source"
key = "id"

[[checks]]
id = "exact-disposition"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[checks.domains]
source = ["languages/rust/RUST-INTEROP-STANDARDS.md"]
target = ["profiles/languages/rust/language-bindings.md"]
disposition = ["refine"]
[checks.members]
path = "evaluation/standards-effectiveness/fixtures/rust/wire-representation-members.tsv"
header = ["id"]
columns = ["id"]
order = "source"
key = "id"

[[checks]]
id = "metadata-closure"
type = "metadata_graph"
paths = ["CORE-STANDARDS.md", "workflows/verification.md", "topics/contracts.md", "topics/security.md", "profiles/boundaries/interop.md", "profiles/boundaries/language-bindings.md", "profiles/languages/rust/README.md", "profiles/languages/rust/language-bindings.md"]

[[checks]]
id = "profile-policy"
type = "text"
path = "profiles/languages/rust/language-bindings.md"
required = ["## Serialized Wire Representation", "Select the wire schema, serializer contract", "effective wire representation is derived", "Account for every applicable attribute.", "Receiving consumers must agree", "Generated types do not replace runtime decoding.", "typed `invalid`", "`unsupported`", "`unavailable`", "Rust-to-host and host-to-Rust", "Producer-only snapshots", "schema-free JSON", "another serializer or binding mechanism"]
prohibited = []

[[checks]]
id = "legacy-index"
type = "markdown_section_text"
path = "languages/rust/RUST-INTEROP-STANDARDS.md"
heading = "## Serde Wire-Format Alignment"
required = ["profiles/languages/rust/language-bindings.md#serialized-wire-representation"]
prohibited = ["#[derive(Serialize, Deserialize)]", "type ServerMessage", "Use explicit `rename_all`", "Prefer shared schema generation"]

[[checks]]
id = "rust-index"
type = "text"
path = "profiles/languages/rust/README.md"
required = ["(language-bindings.md)"]
prohibited = ["RUST-INTEROP-STANDARDS.md#serde-wire-format-alignment"]

[[checks]]
id = "finding-closure"
type = "text"
path = "docs/plans/standards-library-effectiveness/issues.md"
required = ["| F051 | Resolved in Milestone 7.4b7i |"]
prohibited = []

[[checks]]
id = "documentation-projection"
type = "text"
path = "evaluation/standards-effectiveness/verification-guide.md"
required = ["The registered `rust-wire-representation` suite requires a selected schema and"]
prohibited = ["`verify-rust-wire-representation.sh` require a selected schema and"]
