schema_version = 1
id = "resilience-owner-contract"
owner = "topic.resilience"
description = "Resilience criticality, degradation, retry, recovery, evidence, and typed owner outcomes without ignored failure, unbounded retry, or fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/resilience/owner-contract-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
criticality = ["best-effort", "missing", "required", "unknown"]
phase = ["recovery", "runtime", "startup"]
outcome = ["degrade", "fail", "ignore", "recover"]
retry = ["bounded", "none", "unbounded"]
evidence = ["complete", "missing"]
fallback = ["alternate-dependency", "default-success", "ignored-error", "none"]
expected = ["allow", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "retry", op = "eq", value = "unbounded" },
  { field = "outcome", op = "eq", value = "ignore" },
  { field = "criticality", op = "eq", value = "unknown" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "criticality", op = "eq", value = "missing" },
  { field = "evidence", op = "eq", value = "missing" },
]
