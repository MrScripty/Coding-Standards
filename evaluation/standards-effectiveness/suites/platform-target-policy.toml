schema_version = 1
id = "platform-target-policy"
owner = "topic.cross-platform"
description = "Contract-selected platform support, isolation, mechanism, and semantic fidelity with typed outcomes and no target, tier, layout, degradation, alternate-mechanism, or evidence fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/cross-platform/platform-target-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
targets = ["single", "multiple", "unknown", "default"]
target_contract = ["declared", "missing", "contradictory"]
support = ["required", "optional", "unsupported", "unknown", "default"]
behavior = ["available", "unavailable", "invalid"]
isolation = ["cohesive", "domain-inline", "universal", "missing"]
selection = ["compile-time", "runtime", "composition", "dispatch", "unknown", "default"]
layout = ["cohesive", "one-per-platform", "default"]
capability = ["available", "unsupported", "unavailable"]
semantics = ["preserved", "stub", "false-result", "omitted", "alternate"]
evidence = ["matched", "simulated-substitute", "missing", "not-required"]
fallback = ["none", "default-targets", "default-tier", "strategy-factory", "one-file-per-platform", "runtime-only", "compile-only", "stub", "silent-omission", "alternate-mechanism", "weaker-evidence"]
expected = ["allow", "typed-invalid", "typed-unsupported", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "targets", op = "eq", value = "default" },
  { field = "target_contract", op = "eq", value = "contradictory" },
  { field = "support", op = "eq", value = "default" },
  { field = "behavior", op = "eq", value = "invalid" },
  { field = "isolation", op = "in", values = ["domain-inline", "universal"] },
  { field = "selection", op = "eq", value = "default" },
  { field = "layout", op = "ne", value = "cohesive" },
  { field = "semantics", op = "ne", value = "preserved" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
any = [
  { field = "support", op = "eq", value = "unsupported" },
  { field = "capability", op = "eq", value = "unsupported" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "targets", op = "eq", value = "unknown" },
  { field = "target_contract", op = "eq", value = "missing" },
  { field = "support", op = "eq", value = "unknown" },
  { field = "behavior", op = "eq", value = "unavailable" },
  { field = "isolation", op = "eq", value = "missing" },
  { field = "selection", op = "eq", value = "unknown" },
  { field = "capability", op = "eq", value = "unavailable" },
  { field = "evidence", op = "eq", value = "missing" },
]

[[checks]]
id = "cross-platform-owner"
type = "text"
path = "topics/cross-platform.md"
required = [
  "## Platform Support Contract",
  "project, product, or release contract",
  "Product target names and support tiers are project facts",
  "## Platform Behavior Isolation",
  "smallest cohesive boundary",
  "Select compile-time, runtime, composition, and dispatch mechanisms",
  "No Strategy/Factory",
  "not graceful degradation",
  "typed `invalid`",
  "`unsupported`",
  "`unavailable`",
  "### No Fallback",
]
prohibited = []

[[checks]]
id = "dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [
  ["STD-0280", "CROSS-PLATFORM-STANDARDS.md", "topics/cross-platform.md", "move", "establish the generic cross-platform owner"],
  ["STD-0281", "CROSS-PLATFORM-STANDARDS.md", "topics/cross-platform.md", "refine", "derive supported targets and support claims from the project contract"],
  ["STD-0282", "CROSS-PLATFORM-STANDARDS.md", "topics/cross-platform.md", "refine", "establish contract-selected platform behavior and failure policy"],
  ["STD-0283", "CROSS-PLATFORM-STANDARDS.md", "topics/cross-platform.md", "refine", "isolate platform decisions from domain behavior without requiring one abstraction shape"],
  ["STD-0284", "CROSS-PLATFORM-STANDARDS.md", "topics/cross-platform.md", "refine", "select composition and dispatch mechanisms from language and deployment facts"],
  ["STD-0285", "CROSS-PLATFORM-STANDARDS.md", "topics/cross-platform.md", "refine", "select file and module boundaries from cohesion and language conventions"],
  ["STD-0286", "CROSS-PLATFORM-STANDARDS.md", "topics/cross-platform.md", "refine", "preserve declared semantics and return typed unsupported or unavailable outcomes"],
  ["STD-0287", "CROSS-PLATFORM-STANDARDS.md", "topics/cross-platform.md", "refine", "select compile-time or runtime platform mechanisms from the build and deployment contract"],
  ["STD-0288", "CROSS-PLATFORM-STANDARDS.md", "topics/cross-platform.md", "refine", "route language-specific platform mechanisms to selected profiles"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0280", "STD-0281", "STD-0282", "STD-0283", "STD-0284", "STD-0285", "STD-0286", "STD-0287", "STD-0288"]

[[checks]]
id = "accepted-finding"
type = "text"
path = "evaluation/standards-effectiveness/findings.md"
required = ["| F046 | Resolved in Milestone 7.4b7c |"]
prohibited = []

[[checks]]
id = "removed-authority"
type = "text"
path = "evaluation/standards-effectiveness/README.md"
required = ["registered `platform-target-policy` suite"]
prohibited = ["verify-platform-target-policy.sh"]
