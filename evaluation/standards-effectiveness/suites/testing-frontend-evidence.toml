schema_version = 1
id = "testing-frontend-evidence"
owner = "profile.application.frontend"
description = "Claim-selected Frontend interaction, browser, geometry, embedded-control, and lifecycle evidence with typed no-fallback outcomes."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/frontend/testing-evidence-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
claim = ["browser-geometry", "embedded", "lifecycle", "pure-geometry", "semantics"]
environment = ["browser", "component", "deterministic", "missing"]
interaction = ["ambiguous", "complete", "inaccessible", "none", "unsupported"]
lifecycle = ["complete", "missing", "none"]
substitute = ["happy-path", "mocked-geometry", "none", "selector-default", "snapshot", "synthetic-event"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "substitute", op = "ne", value = "none" },
  { field = "interaction", op = "in", values = ["ambiguous", "inaccessible"] },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
field = "interaction"
op = "eq"
value = "unsupported"
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "environment", op = "eq", value = "missing" },
  { field = "lifecycle", op = "eq", value = "missing" },
]

[[checks]]
id = "canonical-profile"
type = "text"
path = "profiles/applications/frontend.md"
required = [
  "Select interaction evidence from the user-observable contract",
  "A selector or event-dispatch API is not evidence",
  "require a representative browser environment",
  "DOM shim do not prove browser integration",
  "A successful update does not prove cleanup",
]
prohibited = []

[[checks]]
id = "testing-route"
type = "text"
path = "TESTING-STANDARDS.md"
required = ["profiles/applications/frontend.md"]
prohibited = []

[[checks]]
id = "frontend-route-and-retired-mechanisms"
type = "text"
path = "FRONTEND-STANDARDS.md"
required = ["profiles/applications/frontend.md"]
prohibited = [
  "Use `userEvent` for user flows",
  "Mock geometry on specific elements",
]

[[checks]]
id = "disposition-lineage"
type = "relation"
mode = "set"
[checks.left]
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
columns = ["ids"]
order = "source"
where = { all = [{ field = "baseline_order", op = "eq", value = "18" }, { field = "child_order", op = "eq", value = "5" }] }
split = { field = "ids", delimiter = "," }
[checks.right]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
columns = ["id"]
order = "source"
where = { all = [
  { field = "source", op = "eq", value = "TESTING-STANDARDS.md" },
  { field = "target", op = "eq", value = "profiles/applications/frontend.md" },
  { field = "disposition", op = "eq", value = "refine" },
] }

[[checks]]
id = "accepted-plan"
type = "text"
path = "plans/standards-library-effectiveness-restructure-plan.md"
required = ["`7.4b8bz` (`Accepted`)", "`7.4b9s` (`Accepted`)"]
prohibited = []
