schema_version = 1
id = "contract-artifact-selection"
owner = "topic.contracts"
description = "Contract artifact necessity and authority placement with typed outcomes and no inferred mirror, package, or placement fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/contracts/artifact-selection-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
purpose = ["boundary-invariant", "convenience", "deterministic-generation", "evolution", "invalid-states", "none", "wire-representation"]
authority = ["duplicated", "known", "missing"]
consumers = ["multiple", "one", "unknown"]
placement = ["dedicated-package", "generator-input", "owner-module", "producer-module", "unrelated-implementation"]
capability = ["supported", "unsupported"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "authority", op = "eq", value = "missing" },
  { field = "consumers", op = "eq", value = "unknown" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "purpose", op = "in", values = ["none", "convenience"] },
  { field = "authority", op = "eq", value = "duplicated" },
  { field = "placement", op = "eq", value = "unrelated-implementation" },
]

[[checks]]
id = "owner-policy"
type = "text"
path = "topics/contracts.md"
required = [
  "## Contract Artifact Necessity And Authority Placement",
  "distinct purpose",
  "dedicated package is not required",
  "authority is `unavailable`",
  "Do not fall back to an inferred mirror",
]
prohibited = []

[[checks]]
id = "legacy-authority-removed"
type = "text"
path = "ARCHITECTURE-PATTERNS.md"
required = []
prohibited = ["### Packaging Guidance", "### Contract Cost Test"]

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id"]
order = "source"
expected = [["STD-0055"], ["STD-0056"], ["STD-0057"]]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0055", "STD-0056", "STD-0057"]
