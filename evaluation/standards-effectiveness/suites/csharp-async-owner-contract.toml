schema_version = 1
id = "csharp-async-owner-contract"
owner = "profile.language.csharp.async"
description = "C# continuation scheduling selected from explicit affinity, capability, and evidence without blocking or fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/csharp/async-owner-contract-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
affinity = ["affine", "context-free", "unknown"]
mechanism = ["block", "capture", "dispatch", "suppress"]
capability = ["missing", "supported", "unsupported"]
evidence = ["complete", "contradictory", "missing"]
fallback = ["alternate-dispatch", "default-success", "none"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "mechanism", op = "eq", value = "block" },
  { field = "evidence", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
all = [
  { field = "affinity", op = "eq", value = "affine" },
  { field = "mechanism", op = "eq", value = "suppress" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "affinity", op = "eq", value = "unknown" },
  { field = "capability", op = "eq", value = "missing" },
  { field = "evidence", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [
  { field = "capability", op = "eq", value = "unsupported" },
]

[[checks]]
id = "canonical-owner-projection"
type = "text"
path = "profiles/languages/csharp/async.md"
required = [
  "ID: `profile.language.csharp.async`",
  "Specializes: `topic.concurrency`",
  "Inherit The Generic Lifecycle Contract",
  "Select Continuation Scheduling From Affinity",
  "Preserve Invocation Isolation",
  "typed `invalid`, `unsupported`, or `unavailable`",
  "Do not continue with context suppression",
]
prohibited = []

[[checks]]
id = "router-projection"
type = "text"
path = "STANDARDS-ROUTER.md"
required = ["C# `await`, `Task`, continuation scheduling, synchronization context, or thread-affinity mechanism changes"]
prohibited = []

[[checks]]
id = "legacy-projection"
type = "text"
path = "CONCURRENCY-STANDARDS.md"
required = [
  "### C# Continuation Scheduling",
  "[C# Async Profile](profiles/languages/csharp/async.md)",
]
prohibited = [
  "### Use ConfigureAwait(false) in Library/Service Code",
  "should use `ConfigureAwait(false)`",
]

[[checks]]
id = "exact-disposition"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [["STD-0273", "CONCURRENCY-STANDARDS.md", "profiles/languages/csharp/async.md", "refine", "select C sharp continuation scheduling from explicit affinity capability and evidence rather than library or service placement"]]
[checks.projections.where]
field = "id"
op = "eq"
value = "STD-0273"

[[checks]]
id = "execution-overlay"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
[[checks.projections]]
columns = ["ids", "owner", "owner_state", "activation"]
order = "source"
expected = [["STD-0273", "profiles/languages/csharp/async.md", "exists", "pre-slice-review"]]
[checks.projections.where]
all = [
  { field = "baseline_order", op = "eq", value = "13" },
  { field = "child_order", op = "eq", value = "1" },
]

[[checks]]
id = "documentation-projection"
type = "text"
path = "evaluation/standards-effectiveness/verification-guide.md"
required = ["the registered `csharp-async-owner-contract` suite establish the C# Async profile"]
prohibited = ["`verify-csharp-async-owner-contract.sh` establish the C# Async profile"]
