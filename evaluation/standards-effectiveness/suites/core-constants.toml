schema_version = 1
id = "core-constants"
owner = "core.constants"
description = "Semantic constant and configuration ownership without universal naming, centralization, ambient, incumbent, or duplicated-default fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/core/constants-decisions.tsv"
expected_column = "expected"
default = "name"
[checks.domains]
case = ["*"]
meaning = ["declared", "missing", "obvious"]
unit = ["clear", "missing"]
owner = ["local", "missing", "shared"]
reuse = ["multiple", "one"]
variation = ["authorized", "invariant", "unauthorized"]
fallback = ["ambient", "duplicate", "global", "incumbent", "name-all", "none"]
expected = ["configure", "keep-local", "name", "share", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "meaning", op = "eq", value = "missing" },
  { field = "unit", op = "eq", value = "missing" },
  { field = "owner", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "configure"
[checks.rules.when]
all = [{ field = "variation", op = "eq", value = "authorized" }]
[[checks.rules]]
outcome = "share"
[checks.rules.when]
all = [{ field = "owner", op = "eq", value = "shared" }]
[[checks.rules]]
outcome = "keep-local"
[checks.rules.when]
all = [{ field = "meaning", op = "eq", value = "obvious" }]


[[checks]]
id = "dispositions-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0148", "CODING-STANDARDS.md", "CORE-STANDARDS.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0148"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0149", "CODING-STANDARDS.md", "CORE-STANDARDS.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0149"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0150", "CODING-STANDARDS.md", "CORE-STANDARDS.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0150"}]}}]
