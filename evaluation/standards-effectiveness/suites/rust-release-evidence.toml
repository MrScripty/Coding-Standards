schema_version = 1
id = "rust-release-evidence"
owner = "profile.language.rust.release"
description = "Rust release evidence selected per declared claim and scope without an every-release command checklist."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/release-evidence-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
claim = ["accepted", "contradictory", "missing"]
scope = ["known", "unknown"]
capability = ["supported", "unsupported"]
evidence = ["complete", "incomplete"]
fallback = ["all-features", "artifact-name-agreement", "benchmark-update", "changelog-agreement", "command-success", "dependency-audit", "every-release", "metadata-agreement", "none", "tag-agreement", "warning-denial", "workspace-scope"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "claim", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "claim", op = "eq", value = "missing" }, { field = "scope", op = "eq", value = "unknown" }, { field = "evidence", op = "eq", value = "incomplete" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]

[[checks]]
id = "profile"
type = "text"
path = "profiles/languages/rust/release.md"
required = ["## Rust Release Evidence Mechanisms", "proves only its declared claim", "No fixed command set applies"]
prohibited = []

[[checks]]
id = "reference"
type = "text"
path = "reference/recipes/rust-release.md"
required = ["## Release Evidence Command Examples", "cargo clippy --workspace", "do not form an every-release checklist"]
prohibited = []

[[checks]]
id = "source-index"
type = "exact_text"
path = "languages/rust/RUST-RELEASE-STANDARDS.md"
expected = """# Rust Release Standards Migration Index

This is a non-normative migration index. Rust release policy and mechanisms
have moved to canonical owners; this file defines no release, contract,
dependency, licensing, documentation, tooling, verification, recipe, or Cargo
mechanism requirement.

- [Rust release mechanisms](../../profiles/languages/rust/release.md)
- [Rust dependency mechanisms](../../profiles/languages/rust/dependencies.md)
- [Release](../../workflows/release.md)
- [Verification](../../workflows/verification.md)
- [Tooling](../../workflows/tooling.md)
- [Dependencies](../../topics/dependencies.md)
- [Contracts](../../topics/contracts.md)
- [Licensing](../../topics/licensing.md)
- [Documentation](../../workflows/documentation.md)
- [Rust release recipes](../../reference/recipes/rust-release.md)
"""

[[checks]]
id = "disposition"
type = "text"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
required = ["STD-0820\tlanguages/rust/RUST-RELEASE-STANDARDS.md\tprofiles/languages/rust/release.md\tsplit\t"]
prohibited = []
