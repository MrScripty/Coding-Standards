expected = [
  ["1", "FRONTEND-STANDARDS.md", "profiles/applications/frontend.md", "exists", "pre-slice-review", "focused", "none"],
  ["2", "FRONTEND-STANDARDS.md", "profiles/applications/frontend.md", "exists", "pre-slice-review", "focused", "none"],
  ["3", "FRONTEND-STANDARDS.md", "profiles/applications/frontend.md", "exists", "pre-slice-review", "focused", "none"],
