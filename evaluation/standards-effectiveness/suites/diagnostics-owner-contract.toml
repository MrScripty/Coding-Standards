schema_version = 1
id = "diagnostics-owner-contract"
owner = "topic.diagnostics"
description = "Generic diagnostic projection authority selected by purpose and audience with bounded context, authorized disclosure, typed outcomes, and no logging, correlation, discard, or other fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/diagnostics/owner-contract-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
purpose = ["missing", "not-required", "selected"]
audience = ["missing", "not-required", "selected"]
outcome = ["preserved", "swallowed"]
context = ["bounded", "none", "raw"]
disclosure = ["authorized", "not-required", "unauthorized"]
capability = ["supported", "unsupported"]
fallback = ["correlation", "discard", "logging", "none"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "outcome", op = "eq", value = "swallowed" },
  { field = "context", op = "eq", value = "raw" },
  { field = "disclosure", op = "eq", value = "unauthorized" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
field = "capability"
op = "eq"
value = "unsupported"
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "purpose", op = "eq", value = "missing" },
  { field = "audience", op = "eq", value = "missing" },
]

[[checks]]
id = "owner"
type = "text"
path = "topics/diagnostics.md"
required = [
  "ID: `topic.diagnostics`",
  "## Diagnostic Authority",
  "## Diagnostic Selection",
  "## Causal Identity And Context",
  "## Lifecycle And Failure",
  "## Responsibility Boundaries",
  "## Typed Outcomes",
  "not universal requirements",
  "Diagnostics owns only the generic projection contract",
  "telemetry product, fixed application layers",
]
prohibited = []

[[checks]]
id = "reference"
type = "text"
path = "reference/recipes/diagnostics.md"
required = [
  "ID: `reference.recipes.diagnostics`",
  "This material is non-normative",
  "## Adapting A Mechanism",
]
prohibited = []

[[checks]]
id = "router"
type = "text"
path = "STANDARDS-ROUTER.md"
required = ["[Diagnostics](topics/diagnostics.md)"]
prohibited = []

[[checks]]
id = "architecture-route"
type = "text"
path = "ARCHITECTURE-PATTERNS.md"
required = ["[Diagnostics](topics/diagnostics.md)"]
prohibited = []

[[checks]]
id = "exact-disposition"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition"]
order = "lexical"
expected = [["STD-0089", "ARCHITECTURE-PATTERNS.md", "topics/diagnostics.md", "index"]]
[checks.projections.where]
field = "id"
op = "eq"
value = "STD-0089"
