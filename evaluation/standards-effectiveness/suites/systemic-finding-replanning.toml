schema_version = 1
id = "systemic-finding-replanning"
owner = "workflow.planning"
description = "Repeated invariant failures require a bounded canonical owner and reachable consumer population, class-level alternatives, evidence-backed dispositions, and a stopping condition."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/planning/systemic-finding-replan-decisions.tsv"
expected_column = "expected"
default = "continue"
[checks.domains]
case = ["*"]
finding = ["isolated", "repeated", "unknown"]
invariant_family = ["inventoried", "missing", "not-applicable", "unknown"]
canonical_owner = ["identified", "not-applicable", "unknown"]
reachable_population = ["complete", "not-applicable", "unknown"]
new_fact = ["consumer", "implementation-file", "none", "promise", "risk", "semantic-owner", "unknown"]
population_action = ["expand", "not-applicable", "retain", "unknown"]
authority_projection = ["complete", "incomplete"]
repair = ["class-fix", "delete", "local-patch", "smaller-interface", "substitute-proof", "unknown"]
composition = ["compared", "missing", "not-applicable", "unknown"]
expected = ["continue", "replan", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "finding", op = "eq", value = "unknown" },
  { all = [
    { field = "finding", op = "eq", value = "repeated" },
    { any = [
      { field = "canonical_owner", op = "eq", value = "unknown" },
      { field = "reachable_population", op = "eq", value = "unknown" },
      { field = "new_fact", op = "eq", value = "unknown" },
      { field = "population_action", op = "eq", value = "unknown" },
      { field = "repair", op = "eq", value = "unknown" },
      { field = "composition", op = "eq", value = "unknown" },
    ] },
  ] },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { all = [
    { field = "finding", op = "eq", value = "repeated" },
    { field = "invariant_family", op = "eq", value = "missing" },
  ] },
  { all = [
    { field = "finding", op = "eq", value = "repeated" },
    { field = "repair", op = "eq", value = "local-patch" },
  ] },
  { all = [
    { field = "finding", op = "eq", value = "repeated" },
    { field = "composition", op = "eq", value = "missing" },
  ] },
  { field = "authority_projection", op = "eq", value = "incomplete" },
  { all = [
    { field = "finding", op = "eq", value = "repeated" },
    { all = [
      { field = "new_fact", op = "in", values = ["semantic-owner", "consumer", "risk", "promise"] },
      { field = "population_action", op = "ne", value = "expand" },
    ] },
  ] },
  { all = [
    { field = "finding", op = "eq", value = "repeated" },
    { all = [
      { field = "new_fact", op = "in", values = ["none", "implementation-file"] },
      { field = "population_action", op = "ne", value = "retain" },
    ] },
  ] },
]
[[checks.rules]]
outcome = "replan"
[checks.rules.when]
all = [
  { field = "finding", op = "eq", value = "repeated" },
  { field = "invariant_family", op = "eq", value = "inventoried" },
  { field = "canonical_owner", op = "eq", value = "identified" },
  { field = "reachable_population", op = "eq", value = "complete" },
  { field = "authority_projection", op = "eq", value = "complete" },
  { field = "repair", op = "in", values = ["class-fix", "delete", "smaller-interface", "substitute-proof"] },
  { field = "composition", op = "eq", value = "compared" },
]

[[checks]]
id = "planning-policy"
type = "text"
path = "workflows/planning.md"
required = ["## Systemic-Finding Re-Planning", "invariant family and canonical owner", "reachable consumer", "consider deletion, consolidation, a smaller Interface", "compare the repaired composition with the original objective", "implementation file inside an already bounded owner", "Stop when the canonical owner"]
prohibited = []

[[checks]]
id = "planning-prompt"
type = "text"
path = "prompts/planning.md"
required = [
  "repeated invariant failure",
  "Identify the canonical owner and bound the authorities",
  "Inspect sibling operations only when they share that authority",
  "Expand only for a new semantic owner",
  "bounded population has evidence-backed dispositions",
]
prohibited = []

[[checks]]
id = "implementation-prompt"
type = "text"
path = "prompts/implement-plan.md"
required = [
  "Stop and re-plan",
  "repeated invariant failure",
  "Bound the canonical owner",
  "another file inside an already bounded owner",
]
prohibited = []

[[checks]]
id = "template-projection"
type = "text"
path = "templates/PLAN-TEMPLATE.md"
required = [
  "## Systemic Finding Audit",
  "Invariant family and canonical owner",
  "Bounded authority, representation, and reachable consumer population",
  "Consumer dispositions",
  "Evidence-backed stopping condition",
  "Repaired-composition comparison",
]
prohibited = []

[[checks]]
id = "negative-fixture-preconditions"
type = "text"
path = "evaluation/standards-effectiveness/fixtures/planning/systemic-finding-missing-audit.md"
required = ["# Plan: Systemic Finding Without Audit", "**Plan status:** `Blocked`", "## Objective Acceptance", "## Milestones", "## Re-Plan Triggers", "## Final Acceptance", "Sibling consumers not yet inventoried", "Canonical owner and reachable consumer population not yet bounded", "smaller-Interface, proof-substitution, and composition alternatives"]
prohibited = ["## Systemic Finding Audit"]

[[checks]]
id = "retained-plan-structure-consumer"
type = "text"
path = "evaluation/standards-effectiveness/check-plan-structure.sh"
required = ["#!/usr/bin/env bash", "set -euo pipefail"]
prohibited = []

[[checks]]
id = "retained-plan-fixture-consumer"
type = "text"
path = "evaluation/standards-effectiveness/verify-plan-fixtures.sh"
required = ["#!/usr/bin/env bash", "set -euo pipefail"]
prohibited = []

[[checks]]
id = "registered-consumers"
type = "path_state"
present = [
  "docs/plans/standards-engine-standards-recovery/issues.md",
  "prompts/full-codebase-standards-refactor.md",
]
