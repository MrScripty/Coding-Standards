schema_version = 1
id = "persistence-durable-mutation"
owner = "profile.boundary.persistence"
description = "Durable mutation publication from authoritative invariants and store capability with no partial-state or mechanism fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/persistence/durable-mutation-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
durable_scope = ["not-required", "selected"]
invariant = ["missing", "not-required", "selected"]
source = ["known", "missing", "not-required"]
destination = ["known", "missing", "not-required"]
capability = ["missing", "not-required", "supported", "unsupported"]
staging = ["authoritative", "isolated", "not-required"]
publication = ["complete", "not-required", "partial", "unknown"]
proof = ["debug-only", "incomplete", "missing", "not-required", "production"]
fallback = ["append-only", "fixed-phases", "interleaved", "none", "placeholder", "undo"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "staging", op = "eq", value = "authoritative" }, { field = "publication", op = "eq", value = "partial" }, { field = "proof", op = "in", values = ["debug-only", "incomplete"] }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
all = [{ field = "durable_scope", op = "eq", value = "selected" }, { any = [{ field = "invariant", op = "eq", value = "missing" }, { field = "source", op = "eq", value = "missing" }, { field = "destination", op = "eq", value = "missing" }, { field = "capability", op = "eq", value = "missing" }, { field = "publication", op = "eq", value = "unknown" }, { field = "proof", op = "eq", value = "missing" }] }]

[[checks]]
id = "disposition-lineage"
type = "keyed_relation"
[checks.keys]
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
columns = ["ids"]
order = "source"
where = { all = [{ field = "baseline_order", op = "eq", value = "32" }, { field = "child_order", op = "eq", value = "2" }] }
split = { field = "ids", delimiter = "," }
[checks.expected]
path = "evaluation/standards-effectiveness/milestone-7-row-32-owner-validation.tsv"
header = ["id", "owner", "disposition", "rationale"]
key = "id"
values = ["owner", "disposition"]
[checks.observed]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
key = "id"
values = ["target", "disposition"]
