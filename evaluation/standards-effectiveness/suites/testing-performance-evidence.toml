schema_version = 1
id = "testing-performance-evidence"
owner = "topic.performance"
description = "Performance-test evidence from authoritative budgets, representative workloads and environments, applicable baselines, reliable measurements, and owned budgets without weaker substitutes."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/performance/testing-evidence-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
authority = ["contradictory", "owned"]
workload = ["contradictory", "isolated", "representative"]
environment = ["missing", "representative", "unsupported"]
baseline = ["applicable", "missing"]
measurement = ["missing", "reliable"]
budget = ["comparison", "missing", "owned"]
substitute = ["fixed-threshold", "harness-success", "microbenchmark", "nearby-device", "none", "single-sample"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "substitute", op = "ne", value = "none" },
  { field = "authority", op = "eq", value = "contradictory" },
  { field = "workload", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "environment", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "environment", op = "eq", value = "missing" },
  { field = "baseline", op = "eq", value = "missing" },
  { field = "measurement", op = "eq", value = "missing" },
  { field = "budget", op = "eq", value = "missing" },
]

[[checks]]
id = "canonical-policy"
type = "text"
path = "topics/performance.md"
required = ["## Performance Test Evidence", "An ecosystem harness may improve", "A performance budget names its authority", "not copy a duration, percentage, sample count", "successful harness execution as the required result"]
prohibited = []

[[checks]]
id = "testing-route-and-legacy"
type = "text"
path = "TESTING-STANDARDS.md"
required = ["topics/performance.md"]
prohibited = ["expect(duration).toBeLessThan(100)", "Use the ecosystem's benchmark harness"]

[[checks]]
id = "dispositions"
type = "text"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
required = [
  "STD-0642\tTESTING-STANDARDS.md\ttopics/performance.md\tindex\treplace the performance testing parent with a non-normative route to canonical Performance test evidence",
  "STD-0643\tTESTING-STANDARDS.md\ttopics/performance.md\trefine\tselect benchmark harness workload environment and measurement capability from the owned claim without ecosystem-harness critical-path or successful-execution defaults",
  "STD-0644\tTESTING-STANDARDS.md\ttopics/performance.md\trefine\trequire authoritative budget workload metric environment variability baseline and tradeoff evidence without fixed duration percentage sample machine cadence tool or weaker-measurement substitution",
]
prohibited = []

[[checks]]
id = "row-18-route"
type = "text"
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
required = ["18\t6\tSTD-0642,STD-0643,STD-0644\tTESTING-STANDARDS.md\ttopics/performance.md\texists\tpre-slice-review\tfocused"]
prohibited = []
