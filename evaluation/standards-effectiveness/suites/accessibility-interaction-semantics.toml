schema_version = 1
id = "accessibility-interaction-semantics"
owner = "topics/accessibility.md"
description = "Interaction meaning and outcome decisions from selected purpose, role, capability, modality, state, and feedback facts without mechanism fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/accessibility/interaction-semantics-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
purpose = ["contradictory", "declared", "missing"]
role = ["action", "contradictory", "custom", "missing", "navigation"]
capability = ["missing", "supported", "unsupported"]
modalities = ["keyboard", "missing", "multiple", "selected"]
state = ["complete", "missing"]
feedback = ["complete", "missing"]
fallback = ["html", "keyboard-only", "none", "role-only", "visual-match"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "purpose", op = "eq", value = "contradictory" },
  { field = "role", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
field = "capability"
op = "eq"
value = "unsupported"
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "purpose", op = "eq", value = "missing" },
  { field = "role", op = "eq", value = "missing" },
  { field = "capability", op = "eq", value = "missing" },
  { field = "modalities", op = "eq", value = "missing" },
  { field = "state", op = "eq", value = "missing" },
  { field = "feedback", op = "eq", value = "missing" },
]

[[checks]]
id = "canonical-owner"
type = "text"
path = "topics/accessibility.md"
required = ["## Semantic Meaning And Role", "## Action And Navigation Outcomes", "## Custom Interaction Outcomes", "preferred only on that evidence", "not prove another modality"]
prohibited = []

[[checks]]
id = "web-reference"
type = "text"
path = "reference/recipes/accessibility.md"
required = ["## Web Interaction Mechanisms", "<button type=\"button\"", "<a href=\"/settings\">", "role=\"button\""]
prohibited = []

[[checks]]
id = "legacy-index-closure"
type = "markdown_section_text"
path = "ACCESSIBILITY-STANDARDS.md"
heading = "## Interaction Semantics (Migrated)"
required = ["[Accessibility](topics/accessibility.md)", "[Accessibility Recipes](reference/recipes/accessibility.md)"]
prohibited = ["<button", "role=\"button\""]

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition"]
order = "source"
expected = [
  ["STD-0008", "ACCESSIBILITY-STANDARDS.md", "topics/accessibility.md", "split"],
  ["STD-0009", "ACCESSIBILITY-STANDARDS.md", "topics/accessibility.md", "split"],
  ["STD-0010", "ACCESSIBILITY-STANDARDS.md", "topics/accessibility.md", "split"],
  ["STD-0011", "ACCESSIBILITY-STANDARDS.md", "topics/accessibility.md", "split"],
  ["STD-0012", "ACCESSIBILITY-STANDARDS.md", "topics/accessibility.md", "split"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0008", "STD-0009", "STD-0010", "STD-0011", "STD-0012"]
