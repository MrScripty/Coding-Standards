schema_version = 1
id = "source-package-preparation"
owner = "verification-engine.migration-source-closure"
description = "Normalized source-package preparation authority with derived source identity and typed verifier subjects."

[[checks]]
id = "preparation-table"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-source-package-preparation.tsv"
header = ["manifest_order", "source", "verifier_subjects"]
non_empty = ["manifest_order", "source", "verifier_subjects"]
unique = [["manifest_order"], ["source"]]

[[checks]]
id = "final-source-membership"
type = "inclusion"
[checks.members]
path = "evaluation/standards-effectiveness/milestone-7-source-package-preparation.tsv"
header = ["manifest_order", "source", "verifier_subjects"]
columns = ["manifest_order", "source"]
order = "source"
[checks.container]
path = "evaluation/standards-effectiveness/milestone-7-final-source-closure.tsv"
header = ["order", "source", "canonical_owner", "current_shape", "treatment", "retention_evidence", "risk", "concurrency", "gate"]
columns = ["order", "source"]
order = "source"

[[checks]]
id = "verifier-subjects"
type = "repository_subjects"
[checks.subjects]
path = "evaluation/standards-effectiveness/milestone-7-source-package-preparation.tsv"
header = ["manifest_order", "source", "verifier_subjects"]
columns = ["verifier_subjects"]
order = "source"
split = { field = "verifier_subjects", delimiter = "," }

[[checks]]
id = "preparation-policy"
type = "text"
path = "evaluation/standards-effectiveness/milestone-7-source-index-verifier-replan.md"
required = ["## Concurrent Preparation And Serial Acceptance", "Preparation order and acceptance order are separate contracts.", "Workers cannot edit shared acceptance state.", "A prepared package is not accepted evidence.", "one complete-suite run may accept", "non-overlapping former", "Architecture remains excluded from preparation wave `p1`"]
prohibited = []
