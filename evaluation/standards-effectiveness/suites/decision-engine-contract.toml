schema_version = 1
id = "decision-engine-contract"
owner = "verification-engine.decision"
description = "Canonical decision-table evaluation with finite domains, typed outcomes, and no separate observed-result compatibility input."

[[checks]]
id = "decision-contract"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/decision-table/valid-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
contract = ["selected", "missing", "unsupported"]
fallback = ["none", "default", "alternate"]
expected = ["allow", "typed-invalid", "typed-unsupported", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
field = "fallback"
op = "ne"
value = "none"
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
field = "contract"
op = "eq"
value = "unsupported"
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
field = "contract"
op = "eq"
value = "missing"
