schema_version = 1
id = "rust-binding-runtime"
owner = "profile.language.rust.language-bindings"
description = "Composition-owned Rust binding runtime capability, host-handle lifetime, fresh request state, and lifecycle-tracked work with typed no-fallback outcomes."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/binding-runtime-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
runtime_owner = ["composition", "binding", "request", "missing"]
runtime_capability = ["shared-injected", "call-injected", "unavailable"]
handle_owner = ["declared", "missing", "not-required"]
request_state = ["current-only", "retained-input", "retained-cancellation", "retained-result", "not-required"]
execution = ["scoped-await", "tracked-submit", "sync-drive", "create-runtime", "detached", "not-required"]
task_owner = ["lifecycle", "scope", "missing", "not-required"]
fallback = ["none", "embedded-runtime", "alternate-runtime", "block", "carry-forward", "detach", "alternate-binding"]
expected = ["allow", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "runtime_owner", op = "in", values = ["binding", "request"] },
  { field = "handle_owner", op = "eq", value = "missing" },
  { field = "request_state", op = "in", values = ["retained-input", "retained-cancellation", "retained-result"] },
  { field = "execution", op = "in", values = ["sync-drive", "create-runtime", "detached"] },
  { all = [
    { field = "execution", op = "eq", value = "tracked-submit" },
    { field = "task_owner", op = "ne", value = "lifecycle" },
  ] },
  { all = [
    { field = "execution", op = "eq", value = "scoped-await" },
    { field = "task_owner", op = "ne", value = "scope" },
  ] },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "runtime_owner", op = "eq", value = "missing" },
  { field = "runtime_capability", op = "eq", value = "unavailable" },
]

[[checks]]
id = "source-identities"
type = "table"
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "path", "level", "target_role", "disposition", "heading"]
order = "source"
expected = [
  ["STD-0798", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "2", "language-profile", "split", "Memory Ownership Model"],
  ["STD-0799", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "3", "language-profile", "split", "Rules"],
  ["STD-0800", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "2", "language-profile", "split", "Async Bridging"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0798", "STD-0799", "STD-0800"]

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [
  ["STD-0798", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "profiles/languages/rust/language-bindings.md", "refine", "separate host handle lifetime from runtime lifecycle ownership"],
  ["STD-0799", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "profiles/languages/rust/language-bindings.md", "refine", "consume injected lifecycle capability instead of embedding an owned runtime"],
  ["STD-0800", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "profiles/languages/rust/language-bindings.md", "refine", "adapt host async calls without alternate runtime or synchronous-drive fallback"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0798", "STD-0799", "STD-0800"]

[[checks]]
id = "metadata-closure"
type = "metadata_graph"
paths = ["CORE-STANDARDS.md", "workflows/verification.md", "topics/contracts.md", "topics/security.md", "topics/concurrency.md", "profiles/boundaries/interop.md", "profiles/boundaries/language-bindings.md", "profiles/languages/rust/README.md", "profiles/languages/rust/async.md", "profiles/languages/rust/language-bindings.md"]

[[checks]]
id = "profile-policy"
type = "text"
path = "profiles/languages/rust/language-bindings.md"
required = [
  "## Handle And Runtime Adaptation",
  "Distinguish a host-visible handle from runtime and task lifecycle.",
  "application's composition owner",
  "across calls or workflow runs without making",
  "Each call creates fresh input, cancellation, result, and failure state.",
  "persistence or keep-alive request",
  "owner before submission",
  "does not synchronously drive",
  "typed `unsupported` or `unavailable`",
  "async.md",
  "## Verification",
  "## No Fallback",
]
prohibited = []

