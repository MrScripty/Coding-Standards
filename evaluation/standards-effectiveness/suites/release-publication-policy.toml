schema_version = 1
id = "release-publication-policy"
owner = "workflow.release"
description = "Provider-neutral publication presentation from an accepted handoff without hosted-service or product-specific defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/release/publication-decisions.tsv"
expected_column = "expected_publication"
default = "no"
[checks.domains]
case = ["*"]
accepted_handoff = ["yes", "no"]
explicit_destination = ["yes", "no"]
channel_projection = ["yes", "no"]
release_notes = ["yes", "no"]
artifact_presentation = ["yes", "no"]
expected_publication = ["yes", "no"]
[[checks.rules]]
outcome = "yes"
[checks.rules.when]
all = [
  { field = "accepted_handoff", op = "eq", value = "yes" },
  { field = "explicit_destination", op = "eq", value = "yes" },
  { field = "channel_projection", op = "eq", value = "yes" },
  { field = "release_notes", op = "eq", value = "yes" },
  { field = "artifact_presentation", op = "eq", value = "yes" },
]

[[checks]]
id = "section-inventory"
type = "table"
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
order = "source"
expected = [
  ["STD-0566", "RELEASE-STANDARDS.md", "455", "2", "workflow", "split", "GitHub Releases"],
  ["STD-0567", "RELEASE-STANDARDS.md", "457", "3", "workflow", "split", "Draft-Then-Publish"],
  ["STD-0568", "RELEASE-STANDARDS.md", "466", "3", "workflow", "split", "Pre-Release Flag"],
  ["STD-0569", "RELEASE-STANDARDS.md", "472", "3", "workflow", "split", "Release Notes"],
  ["STD-0570", "RELEASE-STANDARDS.md", "481", "3", "workflow", "split", "Asset Organization"],
  ["STD-0571", "RELEASE-STANDARDS.md", "487", "2", "workflow", "split", "Downloads"],
  ["STD-0572", "RELEASE-STANDARDS.md", "489", "3", "workflow", "split", "Binaries"],
  ["STD-0573", "RELEASE-STANDARDS.md", "494", "3", "workflow", "split", "Shared Libraries"],
  ["STD-0574", "RELEASE-STANDARDS.md", "498", "3", "workflow", "split", "Checksums"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0566", "STD-0567", "STD-0568", "STD-0569", "STD-0570", "STD-0571", "STD-0572", "STD-0573", "STD-0574"]

[[checks]]
id = "dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [
  ["STD-0566", "RELEASE-STANDARDS.md", "workflows/release.md", "move", "provider-neutral publication presentation"],
  ["STD-0567", "RELEASE-STANDARDS.md", "workflows/release.md", "merge", "destination-owned review and visibility states"],
  ["STD-0568", "RELEASE-STANDARDS.md", "workflows/release.md", "merge", "canonical prerelease and channel projection"],
  ["STD-0569", "RELEASE-STANDARDS.md", "workflows/release.md", "move", "accepted release-note composition"],
  ["STD-0570", "RELEASE-STANDARDS.md", "workflows/release.md", "move", "artifact-plan presentation"],
  ["STD-0571", "RELEASE-STANDARDS.md", "workflows/release.md", "merge", "consumer artifact discovery"],
  ["STD-0572", "RELEASE-STANDARDS.md", "none", "remove", "product-specific binary download examples"],
  ["STD-0573", "RELEASE-STANDARDS.md", "none", "remove", "incomplete shared-library download example"],
  ["STD-0574", "RELEASE-STANDARDS.md", "workflows/release.md", "merge", "selected integrity metadata presentation"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0566", "STD-0567", "STD-0568", "STD-0569", "STD-0570", "STD-0571", "STD-0572", "STD-0573", "STD-0574"]

[[checks]]
id = "metadata-closure"
type = "metadata_graph"
paths = ["CORE-STANDARDS.md", "workflows/verification.md", "topics/contracts.md", "workflows/release.md", "topics/contracts/schemas.md", "topics/contracts/protocols.md", "topics/contracts/evolution.md", "workflows/verification/oracles.md", "workflows/verification/platforms.md", "workflows/release/operations.md", "workflows/verification/gui.md", "topics/code-design.md"]
