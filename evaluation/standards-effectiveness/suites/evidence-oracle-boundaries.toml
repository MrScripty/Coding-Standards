schema_version = 1
id = "evidence-oracle-boundaries"
owner = "workflow.verification"
description = "Acceptance evidence distinguishes deciding oracles, freshness, local agreement, external conformance, mutation sensitivity, and isolated negative failures."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/verification/evidence-oracle-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
claim = ["missing", "named"]
oracle = ["generated-output", "independent", "local-implementation", "missing"]
authority_mutation = ["detected", "ignored", "not-applicable"]
negative_preconditions = ["satisfied", "unrelated-failure"]
local_agreement = ["no", "yes"]
external_contract = ["none", "selected"]
expected = ["allow", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "claim", op = "eq", value = "missing" },
  { field = "oracle", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "oracle", op = "eq", value = "generated-output" },
  { field = "oracle", op = "eq", value = "local-implementation" },
  { field = "authority_mutation", op = "eq", value = "ignored" },
  { field = "negative_preconditions", op = "eq", value = "unrelated-failure" },
]

[[checks]]
id = "registered-consumers"
type = "path_state"
present = [
