schema_version = 1
id = "rust-binding-annotation-placement"
owner = "profile.language.rust.language-bindings"
description = "Mechanism- and ownership-selected Rust binding annotation placement without proc-macro, definition-file, framework, or target-language defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/binding-annotation-placement-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
mechanism = ["declared", "missing", "schema"]
placement = ["adapter", "core", "definition-file-default", "proc-macro-default", "separate-definition"]
core_contract = ["changed", "unchanged"]
framework_coupling = ["absent", "present"]
fallback = ["alternate-framework", "none"]
expected = ["allow", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "placement", op = "in", values = ["proc-macro-default", "definition-file-default"] },
  { all = [
    { field = "placement", op = "eq", value = "core" },
    { any = [
      { field = "core_contract", op = "ne", value = "unchanged" },
      { field = "framework_coupling", op = "ne", value = "absent" },
    ] },
  ] },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
field = "mechanism"
op = "eq"
value = "missing"

[[checks]]
id = "exact-disposition"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition"]
order = "source"
expected = [["STD-0784", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "profiles/languages/rust/language-bindings.md", "refine"]]
[checks.projections.where]
field = "id"
op = "eq"
value = "STD-0784"
