schema_version = 1
id = "contract-invariants"
owner = "topic.contracts"
description = "Owned invariant contracts, classified failure consequences, selected outcomes, and evidence without hidden caller, partial outcome, build-mode, diagnostic-only, or weaker-invariant fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/contracts/invariant-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
owner = ["clear", "unknown"]
contract = ["complete", "unsupported", "violated"]
caller_fact = ["establishable", "hidden", "not-required"]
outcomes = ["complete", "partial"]
enforcement = ["missing", "selected"]
evidence = ["missing", "selected"]
capability = ["available", "unavailable"]
failure_source = ["adversarial-input", "arbitrary-input", "not-applicable", "operational", "programming-defect", "unknown"]
consequence = ["authoritative-corruption", "contained", "external-effect", "none", "public-escape", "unknown"]
outcome_contract = ["immediate-permitted", "none", "recovery-required", "typed-required", "unknown"]
selected_outcome = ["diagnostic-only", "immediate-failure", "logging-only", "none", "recovery", "trace-and-fail", "typed-failure", "unknown"]
fallback = ["debug-only", "none", "silent-corruption", "unchecked-state", "weaker-invariant"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "caller_fact", op = "eq", value = "hidden" },
  { field = "outcomes", op = "eq", value = "partial" },
  { all = [
    { field = "outcome_contract", op = "eq", value = "typed-required" },
    { field = "selected_outcome", op = "ne", value = "typed-failure" },
  ] },
  { all = [
    { field = "outcome_contract", op = "eq", value = "recovery-required" },
    { field = "selected_outcome", op = "ne", value = "recovery" },
  ] },
  { all = [
    { field = "outcome_contract", op = "eq", value = "immediate-permitted" },
    { field = "selected_outcome", op = "in", values = ["diagnostic-only", "logging-only", "none"] },
  ] },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
all = [{ field = "contract", op = "eq", value = "violated" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "contract", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "owner", op = "eq", value = "unknown" },
  { field = "capability", op = "eq", value = "unavailable" },
  { field = "enforcement", op = "eq", value = "missing" },
  { field = "evidence", op = "eq", value = "missing" },
  { field = "failure_source", op = "eq", value = "unknown" },
  { field = "consequence", op = "eq", value = "unknown" },
  { field = "outcome_contract", op = "eq", value = "unknown" },
  { field = "selected_outcome", op = "eq", value = "unknown" },
]


[[checks]]
id = "dispositions-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0167", "CODING-STANDARDS.md", "CODING-STANDARDS.md", "index"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0167"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0168", "CODING-STANDARDS.md", "topics/contracts.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0168"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0169", "CODING-STANDARDS.md", "topics/contracts.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0169"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0170", "CODING-STANDARDS.md", "topics/contracts.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0170"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0171", "CODING-STANDARDS.md", "topics/contracts.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0171"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0172", "CODING-STANDARDS.md", "topics/contracts.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0172"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0173", "CODING-STANDARDS.md", "workflows/verification.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0173"}]}}]
