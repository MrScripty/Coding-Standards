schema_version = 1
id = "rust-dependency-feature-mechanisms"
owner = "profile.language.rust.dependencies"
description = "Cargo manifest dependency-feature mechanisms selected from accepted dependency contracts."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/dependency-feature-mechanism-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
dependencies = ["accepted", "contradictory", "missing"]
consumer = ["known", "unknown"]
resolver = ["known", "unknown"]
target = ["known", "unknown"]
mechanism = ["dep-forward", "dependency-features", "item-cfg", "optional-dependency", "target-dependency"]
capability = ["supported", "unsupported"]
fallback = ["cfg", "dep-syntax", "dependency-category", "full-features", "minimal-features", "none"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "dependencies", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "dependencies", op = "eq", value = "missing" }, { field = "consumer", op = "eq", value = "unknown" }, { field = "resolver", op = "eq", value = "unknown" }, { field = "target", op = "eq", value = "unknown" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]


[[checks]]
id = "disposition-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0738", "languages/rust/RUST-DEPENDENCY-STANDARDS.md", "profiles/languages/rust/dependencies.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0738"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0739", "languages/rust/RUST-DEPENDENCY-STANDARDS.md", "reference/recipes/rust-dependencies.md", "move"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0739"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0740", "languages/rust/RUST-DEPENDENCY-STANDARDS.md", "reference/recipes/rust-dependencies.md", "move"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0740"}]}}]
