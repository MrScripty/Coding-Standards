schema_version = 1
id = "tooling-lint-policy"
owner = "workflow.tooling"
description = "Lint policy and orchestration without warning, autofix, scope, or CI defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/tooling/lint-policy-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
facts = ["complete", "contradictory"]
authority = ["explicit", "missing"]
capability = ["supported", "unsupported"]
scope = ["complete", "missing"]
fallback = ["autofix", "changed-files", "ci", "fail-warnings", "none", "tiers"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "facts", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "authority", op = "eq", value = "missing" }, { field = "scope", op = "eq", value = "missing" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]

[[checks]]
id = "workflow"
type = "text"
path = "workflows/tooling.md"
required = ["## Lint Policy And Orchestration", "existing debt", "Do not default to failing every warning", "unless Verification selected", "typed `invalid`", "typed `unavailable`", "typed `unsupported`"]
prohibited = []
[[checks]]
id = "former-source"
type = "text"
path = "TOOLING-STANDARDS.md"
required = []
prohibited = ["1. **Fail on warnings**"]
[[checks]]
id = "disposition"
type = "text"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
required = ["STD-0674\tTOOLING-STANDARDS.md\tworkflows/tooling.md\trefine\t", "STD-0675\tTOOLING-STANDARDS.md\tworkflows/tooling.md\trefine\t"]
prohibited = []
