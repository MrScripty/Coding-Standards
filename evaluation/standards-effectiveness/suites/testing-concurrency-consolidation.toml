schema_version = 1
id = "testing-concurrency-consolidation"
owner = "topic.concurrency"
description = "Verification-resource ownership, coordination, cleanup, and lifecycle evidence without serialization, ambient identity, weakened parallelism, or weaker-evidence fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/concurrency/verification-resource-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
overlap = ["none", "possible"]
resource_owner = ["ambient", "exclusive", "missing", "not-required", "shared", "unavailable"]
coordination = ["explicit", "implicit", "missing", "not-required"]
cleanup = ["complete", "missing"]
lifecycle_evidence = ["complete", "missing", "not-applicable"]
substitute = ["ambient", "happy-path", "none", "serialization", "smoke", "weaken-parallelism"]
expected = ["allow", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
all = [{ field = "resource_owner", op = "eq", value = "unavailable" }]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "resource_owner", op = "in", values = ["ambient", "missing"] },
  { field = "coordination", op = "in", values = ["implicit", "missing"] },
  { field = "cleanup", op = "eq", value = "missing" },
  { field = "lifecycle_evidence", op = "eq", value = "missing" },
  { field = "substitute", op = "ne", value = "none" },
]


[[checks]]
id = "dispositions-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0611", "TESTING-STANDARDS.md", "topics/concurrency.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0611"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0639", "TESTING-STANDARDS.md", "topics/concurrency.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0639"}]}}]
