schema_version = 1
id = "development-proportionality"
owner = "workflow.development-proportionality"
description = "Checks resolvable Markdown links, fact-driven routing outcomes. Does not certify prose quality, consumer compliance, or unexecuted runtime behavior."

[[checks]]
id = "routing-closure"
type = "metadata_route"
path = "evaluation/standards-effectiveness/fixtures/development/routing-decisions.tsv"
header = ["case", "uncertainty_reduction", "planning", "facts", "expected_development", "expected_planning", "expected_route"]
expectations_path = "evaluation/standards-effectiveness/fixtures/development/routing-routes.tsv"
route_column = "expected_route"
resolved = "route"
unresolved = "unresolved"
base_modules = ["router"]
selections = [{ column = "expected_development", excluded = "exclude", module = "workflow.development-proportionality", selected = "select" }, { column = "expected_planning", excluded = "exclude", module = "workflow.planning", selected = "select" }]

[[checks]]
id = "local-links"
type = "markdown_links"
paths = ["STANDARDS-ROUTER.md", "workflows/development-proportionality.md", "workflows/planning.md"]
