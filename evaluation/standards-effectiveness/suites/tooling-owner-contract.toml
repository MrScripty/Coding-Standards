schema_version = 1
id = "tooling-owner-contract"
owner = "workflow.tooling"
description = "Tooling ownership, scope, scheduling, orchestration, and typed outcomes without product or execution defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/tooling/owner-contract-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
facts = ["complete", "contradictory"]
authority = ["explicit", "missing"]
capability = ["supported", "unsupported"]
scope = ["complete", "missing"]
schedule = ["complete", "missing"]
fallback = ["conventional-tool", "none", "pre-commit", "staged-files", "successful-noop", "weaker-check"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "facts", op = "eq", value = "contradictory" }, { field = "authority", op = "eq", value = "missing" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "scope", op = "eq", value = "missing" }, { field = "schedule", op = "eq", value = "missing" }]

[[checks]]
id = "workflow"
type = "text"
path = "workflows/tooling.md"
required = ["ID: `workflow.tooling`", "Tooling Authority", "Hook Selection And Configuration", "Scheduling And Cost", "Editor And File Configuration", "Lint Policy And Orchestration", "Formatting Policy And Orchestration", "Persisted Artifact Checks", "typed `invalid`", "typed `unavailable`", "typed `unsupported`", "successful no-op", "Do not default to a hook product"]
prohibited = []

[[checks]]
id = "dispositions"
type = "text"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
required = ["STD-0654\tTOOLING-STANDARDS.md\tworkflows/tooling.md\trefine\t", "STD-0655\tTOOLING-STANDARDS.md\tworkflows/tooling.md\trefine\t", "STD-0660\tTOOLING-STANDARDS.md\tworkflows/tooling.md\trefine\t", "STD-0662\tTOOLING-STANDARDS.md\tworkflows/tooling.md\trefine\t", "STD-0664\tTOOLING-STANDARDS.md\tworkflows/tooling.md\trefine\t", "STD-0665\tTOOLING-STANDARDS.md\tworkflows/tooling.md\trefine\t", "STD-0666\tTOOLING-STANDARDS.md\tworkflows/tooling.md\trefine\t", "STD-0673\tTOOLING-STANDARDS.md\tworkflows/tooling.md\trefine\t", "STD-0674\tTOOLING-STANDARDS.md\tworkflows/tooling.md\trefine\t", "STD-0675\tTOOLING-STANDARDS.md\tworkflows/tooling.md\trefine\t", "STD-0681\tTOOLING-STANDARDS.md\tworkflows/tooling.md\trefine\t", "STD-0682\tTOOLING-STANDARDS.md\tworkflows/tooling.md\tsplit\t", "STD-0683\tTOOLING-STANDARDS.md\tworkflows/tooling.md\trefine\t", "STD-0686\tTOOLING-STANDARDS.md\tworkflows/tooling.md\tsplit\t"]
prohibited = []

