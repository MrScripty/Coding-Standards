schema_version = 1
id = "testing-data-lifecycle"
owner = "workflow.verification"
description = "Test-data authority, identity, construction, isolation, and lifecycle without factory-default or serial-execution fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/verification/test-data-lifecycle-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
authority = ["contradictory", "missing", "owned"]
identity = ["contradictory", "distinct", "missing", "stable"]
construction = ["builder", "direct", "external", "factory", "fixture", "seeded-store"]
mutation = ["immutable", "mutable"]
isolation = ["lease", "namespace", "none", "shared", "transaction", "unsupported"]
lifecycle = ["complete", "contradictory", "missing"]
substitute = ["factory-default", "none", "serial-execution"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "substitute", op = "ne", value = "none" },
  { field = "authority", op = "eq", value = "contradictory" },
  { field = "identity", op = "eq", value = "contradictory" },
  { field = "lifecycle", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "isolation", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "authority", op = "eq", value = "missing" },
  { field = "identity", op = "eq", value = "missing" },
  { field = "lifecycle", op = "eq", value = "missing" },
]

[[checks]]
id = "owner"
type = "text"
path = "workflows/verification.md"
required = ["## Test Data Authority And Lifecycle", "none is a default hierarchy", "lifetime independently", "carries no originating check input", "passing retries"]
prohibited = []

[[checks]]
id = "legacy-routes"
type = "text"
path = "TESTING-STANDARDS.md"
required = ["| Acceptance claims, evidence kinds, environments, test design, placement, coverage, test data, async evidence, supporting gates, and diagnosis | [Verification](workflows/verification.md) |"]
prohibited = ["// GOOD: Factory with defaults", "// GOOD: Fresh state per test"]

[[checks]]
id = "dispositions"
type = "text"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
required = [
  "STD-0632\tTESTING-STANDARDS.md\tworkflows/verification.md\tindex\treplace test-data management parent with a non-normative route to canonical data authority identity isolation construction and lifecycle",
  "STD-0633\tTESTING-STANDARDS.md\tworkflows/verification.md\trefine\tselect factories builders direct construction generators snapshots seeded stores or external fixtures from the owned data contract without mechanism defaults",
  "STD-0634\tTESTING-STANDARDS.md\tworkflows/verification.md\trefine\tselect immutable sharing scoped mutation synchronization reset cleanup and identity from lifecycle and concurrency facts without fresh-state serial-execution or ordering defaults",
]
prohibited = []
