schema_version = 1
id = "testing-data-lifecycle"
owner = "workflow.verification"
description = "Test-data authority, identity, construction, isolation, and lifecycle without factory-default or serial-execution fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/verification/test-data-lifecycle-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
authority = ["contradictory", "missing", "owned"]
identity = ["contradictory", "distinct", "missing", "stable"]
construction = ["builder", "direct", "external", "factory", "fixture", "seeded-store"]
mutation = ["immutable", "mutable"]
isolation = ["lease", "namespace", "none", "shared", "transaction", "unsupported"]
lifecycle = ["complete", "contradictory", "missing"]
substitute = ["factory-default", "none", "serial-execution"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "substitute", op = "ne", value = "none" },
  { field = "authority", op = "eq", value = "contradictory" },
  { field = "identity", op = "eq", value = "contradictory" },
  { field = "lifecycle", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "isolation", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "authority", op = "eq", value = "missing" },
  { field = "identity", op = "eq", value = "missing" },
  { field = "lifecycle", op = "eq", value = "missing" },
]


[[checks]]
id = "dispositions-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0632", "TESTING-STANDARDS.md", "workflows/verification.md", "index"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0632"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0633", "TESTING-STANDARDS.md", "workflows/verification.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0633"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0634", "TESTING-STANDARDS.md", "workflows/verification.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0634"}]}}]
