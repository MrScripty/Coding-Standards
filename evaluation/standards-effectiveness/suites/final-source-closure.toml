schema_version = 1
id = "final-source-closure"
owner = "migration.parent-plan"
description = "Final former-entrypoint closure derived from canonical corpus, ownership, disposition, and no-fallback policy evidence."

[[checks]]
id = "final-source-manifest"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-final-source-closure.tsv"
header = ["order", "source", "canonical_owner", "current_shape", "treatment", "retention_evidence", "risk", "concurrency", "gate"]
non_empty = ["order", "source", "canonical_owner", "current_shape", "treatment", "retention_evidence", "risk", "concurrency", "gate"]
unique = [["order"], ["source"]]
[checks.domains]
current_shape = ["concise", "expanded"]
treatment = ["delete", "retain-index", "rewrite-index"]
retention_evidence = ["frozen-stable-entrypoint"]
risk = ["consolidation", "mechanical"]
concurrency = ["isolated-draft"]
gate = ["full-suite"]

[[checks]]
id = "corpus-membership"
type = "relation"
mode = "set"
[checks.left]
path = "evaluation/standards-effectiveness/milestone-7-final-source-closure.tsv"
header = ["order", "source", "canonical_owner", "current_shape", "treatment", "retention_evidence", "risk", "concurrency", "gate"]
columns = ["source"]
order = "source"
[checks.right]
path = "evaluation/standards-effectiveness/corpus.tsv"
header = ["path", "kind", "normative", "target_role", "preliminary_disposition", "baseline_source"]
columns = ["path"]
order = "source"
[checks.right.where]
field = "kind"
op = "in"
values = ["profile", "standard"]

[[checks]]
id = "owner-map-agreement"
type = "keyed_relation"
[checks.keys]
path = "evaluation/standards-effectiveness/milestone-7-final-source-closure.tsv"
header = ["order", "source", "canonical_owner", "current_shape", "treatment", "retention_evidence", "risk", "concurrency", "gate"]
columns = ["source"]
order = "source"
[checks.expected]
path = "evaluation/standards-effectiveness/milestone-7-final-source-closure.tsv"
header = ["order", "source", "canonical_owner", "current_shape", "treatment", "retention_evidence", "risk", "concurrency", "gate"]
key = "source"
values = ["canonical_owner"]
[checks.observed]
path = "evaluation/standards-effectiveness/owner-map.tsv"
header = ["current_path", "future_owner", "disposition"]
key = "current_path"
values = ["future_owner"]

[[checks]]
id = "disposition-coverage"
type = "key_coverage"
[checks.keys]
path = "evaluation/standards-effectiveness/milestone-7-final-source-closure.tsv"
header = ["order", "source", "canonical_owner", "current_shape", "treatment", "retention_evidence", "risk", "concurrency", "gate"]
columns = ["source"]
order = "source"
[checks.records]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
columns = ["source"]
order = "source"
