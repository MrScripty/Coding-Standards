schema_version = 1
id = "architecture-composition-root-pattern"
owner = "reference.patterns.architecture"
description = "Contract-selected composition-root illustration with typed no-fallback outcomes and exact legacy lineage."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/architecture/composition-root-decisions.tsv"
expected_column = "expected"
default = "illustrate"
[checks.domains]
case = ["*"]
responsibilities = ["contradictory", "missing", "multiple", "one"]
contracts = ["complete", "missing"]
lifecycle = ["complete", "missing"]
mechanisms = ["supported", "unsupported"]
fallback = ["ambient-global", "feature-self-wire", "none"]
expected = ["illustrate", "keep-together", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "responsibilities", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "responsibilities", op = "eq", value = "missing" },
  { field = "contracts", op = "eq", value = "missing" },
  { field = "lifecycle", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
field = "mechanisms"
op = "eq"
value = "unsupported"
[[checks.rules]]
outcome = "keep-together"
[checks.rules.when]
field = "responsibilities"
op = "eq"
value = "one"

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id"]
order = "source"
expected = [["STD-0069"], ["STD-0070"], ["STD-0071"], ["STD-0072"], ["STD-0073"]]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0069", "STD-0070", "STD-0071", "STD-0072", "STD-0073"]

[[checks]]
id = "owner-lineage"
type = "keyed_relation"
[checks.keys]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
columns = ["id"]
order = "source"
where = { field = "id", op = "in", values = ["STD-0069", "STD-0070", "STD-0071", "STD-0072", "STD-0073"] }
[checks.expected]
path = "evaluation/standards-effectiveness/milestone-7-row-37-owner-validation.tsv"
header = ["id", "canonical_owner", "disposition", "reference_treatment", "rationale"]
key = "id"
values = ["canonical_owner", "disposition"]
[checks.observed]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
key = "id"
values = ["target", "disposition"]
