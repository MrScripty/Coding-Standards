schema_version = 1
id = "contract-boundary-proof"
owner = "topic.contracts"
description = "Inbound, outbound, and trusted-internal boundary proof without transport, parser, body, or validation fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/contracts/boundary-proof-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
direction = ["inbound", "internal", "outbound"]
boundary = ["new", "same"]
input = ["produced", "unknown", "validated"]
proof = ["complete", "failed", "missing", "retained"]
outcome = ["error", "not-required", "success", "unsupported"]
capability = ["available", "unavailable"]
fallback = ["alternate-parser", "default-body", "none", "original-input", "reinterpret-success", "revalidate", "transport-success"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
all = [
  { field = "direction", op = "eq", value = "internal" },
  { any = [
    { field = "boundary", op = "ne", value = "same" },
    { field = "input", op = "ne", value = "validated" },
    { field = "proof", op = "ne", value = "retained" },
    { field = "fallback", op = "ne", value = "none" },
  ] },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
all = [
  { field = "direction", op = "in", values = ["inbound", "outbound"] },
  { field = "capability", op = "eq", value = "unavailable" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [
  { field = "direction", op = "in", values = ["inbound", "outbound"] },
  { field = "outcome", op = "eq", value = "unsupported" },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
all = [
  { field = "direction", op = "in", values = ["inbound", "outbound"] },
  { any = [
    { field = "proof", op = "ne", value = "complete" },
    { field = "fallback", op = "ne", value = "none" },
  ] },
]


[[checks]]
id = "dispositions-and-plan-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0155", "CODING-STANDARDS.md", "topics/contracts.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0155"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0156", "CODING-STANDARDS.md", "topics/contracts.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0156"}]}}]
