schema_version = 1
id = "verification-quality-gates"
owner = "workflow.verification"
description = "Claim-matched quality gates without catalog or execution-location defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/verification/quality-gate-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
claim = ["complete", "contradictory", "missing"]
authority = ["explicit", "missing"]
environment = ["available", "missing", "unsupported"]
scope = ["complete", "missing"]
fallback = ["ci", "gate-list", "local-success", "none", "weaker-check"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "claim", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "claim", op = "eq", value = "missing" }, { field = "authority", op = "eq", value = "missing" }, { field = "environment", op = "eq", value = "missing" }, { field = "scope", op = "eq", value = "missing" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "environment", op = "eq", value = "unsupported" }]

[[checks]]
id = "workflow"
type = "text"
path = "workflows/verification.md"
required = ["## Quality Gates And Execution Location", "no catalog", "Execution location does not create", "prove only their selected scope", "`invalid`", "`unavailable`", "`unsupported`"]
prohibited = []
[[checks]]
id = "former-source"
type = "text"
path = "TOOLING-STANDARDS.md"
required = []
prohibited = ["| Gate | What it catches | Non-negotiable? |"]
[[checks]]
id = "disposition"
type = "text"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
required = ["STD-0688\tTOOLING-STANDARDS.md\tworkflows/verification.md\trefine\t", "STD-0695\tTOOLING-STANDARDS.md\tworkflows/verification.md\trefine\t"]
prohibited = []
