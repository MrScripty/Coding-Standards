schema_version = 1
id = "acceptance-claims"
owner = "workflow.verification"
description = "Canonical acceptance-claim identity, execution-mode, and complete evidence-set decisions without a serialized claim grammar."

[[checks]]
id = "permanent-evidence-admission"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/verification/evidence-necessity-and-risk-decisions.tsv"
expected_column = "expected"
default = "admit"
[checks.domains]
case = ["*"]
review_scope = ["ordinary-regression", "substantial-machinery"]
mechanism = ["contract-test", "hash", "runtime-validation", "test", "trace"]
reachability = ["none", "reachable", "unknown"]
consequence = ["immaterial", "material", "unknown"]
oracle = ["adequate", "missing"]
proof_boundary = ["existing", "new", "unknown"]
existing_evidence = ["absent", "overlaps", "subsumes"]
alternative = ["adequate-construction", "adequate-interface", "adequate-normal-failure", "adequate-static", "adequate-trace", "adequate-type", "insufficient", "unknown"]
marginal_value = ["independent", "none", "unknown"]
lifecycle_cost = ["disproportionate", "proportionate", "unknown"]
identity_purpose = ["exact-contract", "incidental", "not-applicable", "semantic"]
retention = ["missing", "trigger"]
expected = ["admit", "no-permanent-evidence", "typed-unavailable"]
[[checks.rules]]
outcome = "admit"
[checks.rules.when]
all = [
  { field = "review_scope", op = "eq", value = "ordinary-regression" },
  { field = "marginal_value", op = "ne", value = "none" },
  { field = "lifecycle_cost", op = "ne", value = "disproportionate" },
  { field = "reachability", op = "eq", value = "reachable" },
  { field = "consequence", op = "eq", value = "material" },
  { field = "oracle", op = "eq", value = "adequate" },
  { field = "existing_evidence", op = "eq", value = "absent" },
  { field = "alternative", op = "eq", value = "insufficient" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "reachability", op = "eq", value = "unknown" },
  { field = "consequence", op = "eq", value = "unknown" },
  { field = "oracle", op = "eq", value = "missing" },
  { field = "proof_boundary", op = "eq", value = "unknown" },
  { field = "alternative", op = "eq", value = "unknown" },
  { field = "marginal_value", op = "eq", value = "unknown" },
  { field = "lifecycle_cost", op = "eq", value = "unknown" },
  { field = "retention", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "no-permanent-evidence"
[checks.rules.when]
any = [
  { field = "reachability", op = "eq", value = "none" },
  { field = "consequence", op = "eq", value = "immaterial" },
  { field = "existing_evidence", op = "eq", value = "subsumes" },
  { field = "alternative", op = "in", values = ["adequate-construction", "adequate-interface", "adequate-normal-failure", "adequate-static", "adequate-trace", "adequate-type"] },
  { field = "marginal_value", op = "eq", value = "none" },
  { field = "lifecycle_cost", op = "eq", value = "disproportionate" },
  { all = [
    { field = "mechanism", op = "eq", value = "hash" },
    { field = "identity_purpose", op = "in", values = ["incidental", "semantic"] },
  ] },
]

[[checks]]
id = "claim-satisfaction"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/verification/acceptance-claim-decisions.tsv"
expected_column = "expected"
default = "satisfied"
[checks.domains]
case = ["*"]
identity = ["different-environment", "different-kind", "same"]
required_mode = ["automated", "either", "manual"]
evidence_mode = ["automated", "manual"]
required_set = ["complete", "incomplete"]
expected = ["satisfied", "unsatisfied"]
[[checks.rules]]
outcome = "unsatisfied"
[checks.rules.when]
any = [
  { field = "identity", op = "ne", value = "same" },
  { field = "required_set", op = "eq", value = "incomplete" },
  { all = [
    { field = "required_mode", op = "eq", value = "automated" },
    { field = "evidence_mode", op = "eq", value = "manual" },
  ] },
  { all = [
    { field = "required_mode", op = "eq", value = "manual" },
    { field = "evidence_mode", op = "eq", value = "automated" },
  ] },
]
