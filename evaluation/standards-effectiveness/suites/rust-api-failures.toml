schema_version = 1
id = "rust-api-failures"
owner = "profile.language.rust.api"
description = "Rust failure-expression mechanisms selected by Contracts and Resilience."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/api-failure-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
contract = ["accepted", "contradictory", "missing"]
resilience = ["accepted", "contradictory", "missing", "not-applicable"]
outcome = ["absent", "asserted", "failed", "impossible", "recoverable", "terminal", "value"]
mechanism = ["assert", "error-type", "expect", "option", "panic", "question-mark", "result", "unreachable", "unwrap"]
capability = ["supported", "unsupported"]
fallback = ["add-context", "erase-failure", "error-crate", "infallible-claim", "none", "path-label", "preference", "test-location"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "contract", op = "eq", value = "contradictory" }, { field = "resilience", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "contract", op = "eq", value = "missing" }, { field = "resilience", op = "eq", value = "missing" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]

[[checks]]
id = "profile"
type = "text"
path = "profiles/languages/rust/api.md"
required = ["## Failure Expression Mechanisms", "After Contracts selects expected absence, invariant, validation", "after Resilience selects every applicable", "express those decisions with supported Rust mechanisms. The Rust profile does", "not infer whether a condition is absent, failed, invalid, impossible", "not replace a missing proof, recovery decision, or typed outcome", "These are language mechanisms, not situation defaults"]
prohibited = []
[[checks]]
id = "former-source"
type = "text"
path = "languages/rust/RUST-API-STANDARDS.md"
required = ["[Contracts](../../topics/contracts.md)", "[Resilience](../../topics/resilience.md)"]
prohibited = ["| Situation | Use |", "Allowed exceptions:", "Prefer `expect("]
[[checks]]
id = "disposition"
type = "text"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
required = ["STD-0711\tlanguages/rust/RUST-API-STANDARDS.md\tprofiles/languages/rust/api.md\tsplit\t", "STD-0712\tlanguages/rust/RUST-API-STANDARDS.md\tprofiles/languages/rust/api.md\tsplit\t"]
prohibited = []
