schema_version = 1
id = "native-artifact-loading"
owner = "topic.cross-platform"
description = "Contract-selected native artifact linking and loading with typed outcomes and no guessed identity or alternate-mechanism fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/cross-platform/native-artifact-loading-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
artifact_contract = ["declared", "missing", "contradictory"]
target = ["supported", "unsupported", "unknown"]
identity = ["exact", "missing", "ambiguous"]
delivery = ["linked", "packaged", "system", "provisioned", "embedded", "unknown"]
mechanism = ["static-link", "dynamic-load", "package-resolver", "os-loader", "provided-handle", "embedded-resource", "unknown"]
capability = ["available", "unavailable"]
evidence = ["matched", "missing"]
fallback = ["none", "mandatory-strategy", "guessed-name", "ambient-search", "alternate-loader", "alternate-artifact", "embedded-copy", "default-success"]
expected = ["allow", "typed-invalid", "typed-unsupported", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "artifact_contract", op = "eq", value = "contradictory" },
  { field = "identity", op = "eq", value = "ambiguous" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "target", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "artifact_contract", op = "eq", value = "missing" },
  { field = "target", op = "eq", value = "unknown" },
  { field = "identity", op = "eq", value = "missing" },
  { field = "delivery", op = "eq", value = "unknown" },
  { field = "mechanism", op = "eq", value = "unknown" },
  { field = "capability", op = "eq", value = "unavailable" },
  { field = "evidence", op = "eq", value = "missing" },
]

[[checks]]
id = "cross-platform-owner"
type = "text"
path = "topics/cross-platform.md"
required = [
  "## Native Artifact Loading",
  "artifact identity or immutable revision",
  "target, architecture, ABI",
  "delivery authority and location contract",
  "Select static linking, dynamic loading",
  "package resolver or operating-system search path",
  "ambient discovery is not artifact identity",
  "Shipped artifact identity",
  "Return `invalid`",
  "`unsupported`",
  "`unavailable`",
  "### No Fallback",
  "Do not mandate Strategy/Factory",
  "try another loader or artifact",
]
prohibited = []

[[checks]]
id = "dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [
  ["STD-0294", "CROSS-PLATFORM-STANDARDS.md", "topics/cross-platform.md", "refine", "define native artifact loading from target artifact deployment and consumer contracts"],
  ["STD-0295", "CROSS-PLATFORM-STANDARDS.md", "topics/cross-platform.md", "refine", "select the declared loading mechanism without Strategy or alternate-loader fallback"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0294", "STD-0295"]

[[checks]]
id = "removed-authority"
type = "text"
path = "evaluation/standards-effectiveness/README.md"
required = ["registered `native-artifact-loading` suite"]
prohibited = ["verify-native-artifact-loading.sh", "native-artifact-loading-*.tsv"]
