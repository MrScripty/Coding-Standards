schema_version = 1
id = "milestone-7-row-37-decomposition"
owner = "migration.parent-plan"
description = "Row 37 Architecture reference closure with historical owner state and P30 membership evidence."

[[checks]]
id = "decomposition"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
[[checks.projections]]
columns = ["child_order", "source", "owner", "owner_state", "activation", "checkpoint", "owner_transition"]
order = "source"
expected = [
  ["1", "ARCHITECTURE-PATTERNS.md", "topics/architecture.md", "exists", "owner-review", "focused", "none"],
  ["2", "ARCHITECTURE-PATTERNS.md", "topics/resilience.md", "exists", "pre-slice-review", "focused", "none"],
  ["3", "ARCHITECTURE-PATTERNS.md", "profiles/applications/frontend.md", "exists", "pre-slice-review", "focused", "none"],
  ["4", "ARCHITECTURE-PATTERNS.md", "topics/architecture.md", "exists", "final-closure", "focused", "none"],
]
[checks.projections.where]
field = "baseline_order"
op = "eq"
value = "37"

[[checks]]
id = "identities"
type = "relation"
mode = "set"
[checks.left]
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
columns = ["ids"]
order = "source"
where = { field = "baseline_order", op = "eq", value = "37" }
split = { field = "ids", delimiter = "," }
[checks.right]
path = "evaluation/standards-effectiveness/milestone-7-row-37-owner-validation.tsv"
header = ["id", "canonical_owner", "disposition", "reference_treatment", "rationale"]
columns = ["id"]
order = "source"

[[checks]]
id = "owner-validation"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-row-37-owner-validation.tsv"
header = ["id", "canonical_owner", "disposition", "reference_treatment", "rationale"]
non_empty = ["id", "canonical_owner", "disposition", "reference_treatment", "rationale"]
unique = [["id"]]
[checks.domains]
canonical_owner = ["topics/architecture.md", "reference/patterns/architecture.md", "topics/resilience.md", "profiles/applications/frontend.md", "reference/recipes/frontend.md", "workflows/verification.md"]
disposition = ["index", "split", "move", "merge-duplicate"]

[[checks]]
id = "disposition-lineage"
type = "inclusion"
[checks.members]
path = "evaluation/standards-effectiveness/milestone-7-row-37-owner-validation.tsv"
header = ["id", "canonical_owner", "disposition", "reference_treatment", "rationale"]
columns = ["id", "canonical_owner", "disposition"]
order = "source"
[checks.container]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
columns = ["id", "target", "disposition"]
order = "source"
where = { field = "source", op = "eq", value = "ARCHITECTURE-PATTERNS.md" }

[[checks]]
id = "report"
type = "text"
path = "evaluation/standards-effectiveness/milestone-7-row-37-decomposition.md"
required = ["## Owner Contract", "independent owner review", "## Exact Ownership", "`37.1`", "`37.2`", "`37.3`", "`37.4`", "## Reference Selection", "view-model class and directory tree are removed", "## Bounded Write Sets", "## Verification Gates", "P30 closes only", "## Typed Outcomes And No Fallback", "## Re-plan Triggers"]
prohibited = []

[[checks]]
id = "historical-train"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-train.tsv"
header = ["order", "wave", "start_id", "end_id", "source", "owner", "owner_state", "activation", "checkpoint"]
[[checks.projections]]
columns = ["wave", "start_id", "end_id", "source", "owner", "owner_state", "activation", "checkpoint"]
order = "source"
expected = [["reference-index-closure", "STD-0069", "STD-0087", "ARCHITECTURE-PATTERNS.md", "reference/patterns/architecture.md", "missing", "owner-review", "focused"]]
[checks.projections.where]
field = "order"
op = "eq"
value = "37"

[[checks]]
id = "p30-membership"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-accelerated-packages.tsv"
header = ["train_order", "package_id", "risk_class", "owner", "owner_action", "verification_family", "draft_mode", "integration_gate", "semantic_outcome", "prerequisites"]
[[checks.projections]]
columns = ["train_order", "package_id", "risk_class", "owner", "owner_action", "verification_family", "draft_mode", "integration_gate", "semantic_outcome", "prerequisites"]
order = "source"
expected = [
  ["36", "P30", "new-owner-design", "reference/patterns/architecture.md", "create-before-populate", "owner-contract", "isolated-draft", "full-suite", "architecture-pattern-reference-extraction", "core,workflow.documentation"],
  ["37", "P30", "new-owner-design", "reference/patterns/architecture.md", "create-before-populate", "owner-contract", "isolated-draft", "full-suite", "architecture-pattern-reference-extraction", "core,workflow.documentation"],
]
[checks.projections.where]
field = "package_id"
op = "eq"
value = "P30"
