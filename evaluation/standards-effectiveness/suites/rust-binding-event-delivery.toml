schema_version = 1
id = "rust-binding-event-delivery"
owner = "profile.language.rust.language-bindings"
description = "Contract-selected Rust host event delivery with governed capacity, current-event isolation, and typed terminal outcomes."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/binding-event-delivery-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
contract = ["selected", "missing", "contradictory"]
mode = ["push", "pull", "stream", "unsupported"]
authority = ["selected", "missing", "wrong"]
capacity = ["governed", "unbounded"]
overflow = ["selected", "silent"]
ordering = ["selected", "contradictory"]
thread = ["valid", "wrong"]
input_state = ["current", "carried"]
cancellation = ["owned", "lost"]
shutdown = ["owned", "unresolved"]
capability = ["available", "unavailable"]
evidence = ["native-host", "native-only", "missing"]
delivery = ["success", "failure"]
fallback = ["none", "push-to-pull", "pull-to-push", "alternate-runtime", "detached-work", "default-success"]
expected = ["allow", "preserve-failure", "typed-invalid", "typed-unsupported", "typed-unavailable", "typed-incomplete"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "contract", op = "eq", value = "contradictory" },
  { field = "authority", op = "eq", value = "wrong" },
  { field = "capacity", op = "eq", value = "unbounded" },
  { field = "overflow", op = "eq", value = "silent" },
  { field = "ordering", op = "eq", value = "contradictory" },
  { field = "thread", op = "eq", value = "wrong" },
  { field = "input_state", op = "eq", value = "carried" },
  { field = "cancellation", op = "eq", value = "lost" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
field = "mode"
op = "eq"
value = "unsupported"
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "contract", op = "eq", value = "missing" },
  { field = "authority", op = "eq", value = "missing" },
  { field = "capability", op = "eq", value = "unavailable" },
  { field = "evidence", op = "ne", value = "native-host" },
]
[[checks.rules]]
outcome = "typed-incomplete"
[checks.rules.when]
field = "shutdown"
op = "eq"
value = "unresolved"
[[checks.rules]]
outcome = "preserve-failure"
[checks.rules.when]
field = "delivery"
op = "eq"
value = "failure"

[[checks]]
id = "source-membership"
type = "table"
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
non_empty = ["id", "path"]
unique = [["id"]]
[checks.domains]
path = ["languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md"]
[checks.members]
path = "evaluation/standards-effectiveness/fixtures/rust/binding-event-delivery-members.tsv"
header = ["id"]
columns = ["id"]
order = "source"
key = "id"

[[checks]]
id = "exact-disposition"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[checks.domains]
source = ["languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md"]
target = ["profiles/languages/rust/language-bindings.md"]
disposition = ["refine"]
[checks.members]
path = "evaluation/standards-effectiveness/fixtures/rust/binding-event-delivery-members.tsv"
header = ["id"]
columns = ["id"]
order = "source"
key = "id"

[[checks]]
id = "metadata-closure"
type = "metadata_graph"
paths = ["CORE-STANDARDS.md", "workflows/verification.md", "topics/concurrency.md", "topics/contracts.md", "topics/security.md", "profiles/boundaries/interop.md", "profiles/boundaries/language-bindings.md", "profiles/languages/rust/README.md", "profiles/languages/rust/language-bindings.md"]

[[checks]]
id = "profile-policy"
type = "text"
path = "profiles/languages/rust/language-bindings.md"
required = ["## Host Event Delivery", "push, pull, stream, or another declared delivery mode", "Push and pull are peer contract choices", "does not authorize carrying an earlier event", "Do not retain events", "without a bound or discard them silently", "outside synchronization guards", "Concurrency work ownership", "Interop event-registration contract", "Preserve provider and host delivery failures", "Return `invalid`", "`unsupported`", "`unavailable`", "selected typed incomplete outcome", "Do not substitute push for pull or pull for push", "report default success"]
prohibited = []

[[checks]]
id = "legacy-index"
type = "markdown_section_text"
path = "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md"
heading = "## Host-Language Callbacks and Event Delivery"
required = ["profiles/languages/rust/language-bindings.md#host-event-delivery"]
prohibited = ["Prefer push-based delivery", "Use pull-based delivery as a fallback", "BufferedEventSink", "BeamEventSink", "drain_events", "events may lag", "```"]

[[checks]]
id = "legacy-structure"
type = "text"
path = "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md"
required = ["### Callback-Based Task Execution"]
prohibited = []

[[checks]]
id = "finding-closure"
