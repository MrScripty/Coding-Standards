schema_version = 1
id = "architecture-durable-workflow-pattern"
owner = "reference.patterns.architecture"
description = "Contract-selected durable-workflow illustration with typed no-fallback outcomes and exact legacy lineage."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/architecture/durable-workflow-decisions.tsv"
expected_column = "expected"
default = "illustrate"
[checks.domains]
case = ["*"]
authority = ["complete", "contradictory", "missing"]
contracts = ["complete", "missing"]
durability = ["missing", "not-required", "required", "unsupported"]
replay = ["complete", "missing", "none"]
ordering = ["complete", "missing"]
fallback = ["event-sourcing", "fixed-components", "in-memory", "none"]
expected = ["illustrate", "omit-durable", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "authority", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "authority", op = "eq", value = "missing" },
  { field = "contracts", op = "eq", value = "missing" },
  { field = "durability", op = "eq", value = "missing" },
  { field = "replay", op = "eq", value = "missing" },
  { field = "ordering", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
field = "durability"
op = "eq"
value = "unsupported"
[[checks.rules]]
outcome = "omit-durable"
[checks.rules.when]
field = "durability"
op = "eq"
value = "not-required"

[[checks]]
id = "reference-projection"
type = "text"
path = "reference/patterns/architecture.md"
required = [
  "## Conditional Durable Workflow Map",
  "After canonical owners select a workflow",
  "This map does not require commands, events, event sourcing",
  "can omit the durable",
  "than selecting the illustrated mechanism",
]
prohibited = []

[[checks]]
id = "legacy-routes"
type = "text"
path = "ARCHITECTURE-PATTERNS.md"
required = [
  "[Architecture](topics/architecture.md#data-and-state-authority)",
  "[Invariant Contracts](topics/contracts.md#invariant-contracts)",
  "[Persistence contract](profiles/boundaries/persistence.md#durable-mutation-contract)",
  "[Resilience](topics/resilience.md#replay-and-resumption-evidence)",
  "[Conditional Durable Workflow Map](reference/patterns/architecture.md#conditional-durable-workflow-map)",
]
prohibited = []

[[checks]]
id = "legacy-fixed-defaults"
type = "text"
path = "ARCHITECTURE-PATTERNS.md"
required = []
prohibited = [
  "append canonical event(s)",
  "Use stable command identifiers",
  "Persist canonical events or equivalent durable state transitions",
  "Build read models/projections",
  "### Typical Components",
  "require tests for replay/bootstrap",
]
match_case = "insensitive"

[[checks]]
id = "reference-fixed-defaults"
type = "text"
path = "reference/patterns/architecture.md"
required = []
prohibited = [
  "append canonical event(s)",
  "Use stable command identifiers",
  "Persist canonical events or equivalent durable state transitions",
  "Build read models/projections",
  "### Typical Components",
  "require tests for replay/bootstrap",
]
match_case = "insensitive"

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id"]
order = "source"
expected = [
  ["STD-0074"],
  ["STD-0075"],
  ["STD-0076"],
  ["STD-0077"],
  ["STD-0078"],
  ["STD-0079"],
  ["STD-0080"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0074", "STD-0075", "STD-0076", "STD-0077", "STD-0078", "STD-0079", "STD-0080"]

[[checks]]
id = "owner-lineage"
type = "keyed_relation"
[checks.keys]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
columns = ["id"]
order = "source"
where = { field = "id", op = "in", values = ["STD-0074", "STD-0075", "STD-0076", "STD-0077", "STD-0078", "STD-0079", "STD-0080"] }
[checks.expected]
path = "evaluation/standards-effectiveness/milestone-7-row-37-owner-validation.tsv"
header = ["id", "canonical_owner", "disposition", "reference_treatment", "rationale"]
key = "id"
values = ["canonical_owner", "disposition"]
[checks.observed]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
key = "id"
values = ["target", "disposition"]
