schema_version = 1
id = "rust-release-package-metadata"
owner = "profile.language.rust.release"
description = "Accepted Cargo release metadata mechanisms without package-field defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/release-package-metadata-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
contracts = ["accepted", "contradictory", "missing"]
release_unit = ["known", "unknown"]
channel = ["known", "unknown"]
metadata = ["selected"]
capability = ["supported", "unsupported"]
evidence = ["complete", "incomplete"]
fallback = ["crate-product-identity", "fixed-edition", "fixed-license", "fixed-rust-version", "none", "readme-default", "registry-success", "repository-default", "required-fields", "taxonomy-default"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "contracts", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "contracts", op = "eq", value = "missing" }, { field = "release_unit", op = "eq", value = "unknown" }, { field = "channel", op = "eq", value = "unknown" }, { field = "evidence", op = "eq", value = "incomplete" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]


[[checks]]
id = "disposition-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0813", "languages/rust/RUST-RELEASE-STANDARDS.md", "profiles/languages/rust/release.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0813"}]}}]
