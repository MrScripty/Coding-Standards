schema_version = 1
id = "frontend-typescript-tooling"
owner = "profile.language.typescript"
description = "TypeScript frontend tooling selection with explicit project, runtime, purpose, compatibility, and evidence."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/frontend/typescript-tooling-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
scope = ["selected", "unselected"]
project = ["missing", "present"]
runtime = ["automatic", "classic", "missing", "none"]
rule = ["contradictory", "missing", "selected"]
purpose = ["applicable", "inapplicable", "missing"]
compatibility = ["missing", "supported", "unsupported"]
evidence = ["complete", "missing"]
fallback = ["compiler-pass", "copied-config", "disable-both", "frontend-owner", "none", "parser", "plugin", "preset", "react-version", "severity"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "rule", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "compatibility", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
all = [{ field = "scope", op = "eq", value = "selected" }, { any = [{ field = "project", op = "eq", value = "missing" }, { field = "runtime", op = "eq", value = "missing" }, { field = "rule", op = "eq", value = "missing" }, { field = "purpose", op = "eq", value = "missing" }, { field = "evidence", op = "eq", value = "missing" }] }]

[[checks]]
id = "disposition-lineage"
type = "keyed_relation"
[checks.keys]
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
columns = ["ids"]
order = "source"
where = { all = [{ field = "baseline_order", op = "eq", value = "34" }, { field = "child_order", op = "eq", value = "4" }] }
split = { field = "ids", delimiter = "," }
[checks.expected]
path = "evaluation/standards-effectiveness/milestone-7-row-34-owner-validation.tsv"
header = ["id", "owner", "disposition", "rationale"]
key = "id"
values = ["owner", "disposition"]
[checks.observed]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
key = "id"
values = ["target", "disposition"]
