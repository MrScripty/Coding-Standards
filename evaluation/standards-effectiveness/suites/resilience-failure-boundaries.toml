schema_version = 1
id = "resilience-failure-boundaries"
owner = "topic.resilience"
description = "Failure representation and diagnostics at the narrowest owning boundary without exception, catch-all, duplicate, swallow, default, mandatory-trace, or context-free wrapping fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/resilience/failure-boundary-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
classification = ["contradictory", "declared"]
owner = ["clear", "missing"]
cause = ["missing", "preserved"]
context = ["complete", "missing"]
fallback = ["catch-all", "default", "duplicate", "exception", "none", "swallow", "trace-all", "wrap"]
expected = ["allow", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "classification", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "owner", op = "eq", value = "missing" },
  { field = "cause", op = "eq", value = "missing" },
  { field = "context", op = "eq", value = "missing" },
]


[[checks]]
id = "dispositions-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0151", "CODING-STANDARDS.md", "CODING-STANDARDS.md", "index"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0151"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0152", "CODING-STANDARDS.md", "topics/resilience.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0152"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0153", "CODING-STANDARDS.md", "topics/resilience.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0153"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0154", "CODING-STANDARDS.md", "topics/resilience.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0154"}]}}]
