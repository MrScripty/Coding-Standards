schema_version = 1
id = "router-legacy-route-closure"
owner = "STANDARDS-ROUTER.md"
description = "Router legacy-entrypoint exclusion derived from canonical replacement and final-source evidence."

[[checks]]
id = "replacement-table"
type = "table"
path = "evaluation/standards-effectiveness/fixtures/router/legacy-route-replacements.tsv"
header = ["concern", "legacy_route", "canonical_owner", "expected"]
non_empty = ["concern", "legacy_route", "canonical_owner", "expected"]
unique = [["concern"], ["legacy_route"]]
[checks.domains]
expected = ["canonical-only"]

[[checks]]
id = "router-links"
type = "markdown_links"
paths = ["STANDARDS-ROUTER.md"]

[[checks]]
id = "replacement-route-absence"
type = "table_text_absence"
path = "STANDARDS-ROUTER.md"
[checks.literals]
path = "evaluation/standards-effectiveness/fixtures/router/legacy-route-replacements.tsv"
header = ["concern", "legacy_route", "canonical_owner", "expected"]
columns = ["legacy_route"]
order = "source"

[[checks]]
id = "final-source-absence"
type = "table_text_absence"
path = "STANDARDS-ROUTER.md"
[checks.literals]
path = "evaluation/standards-effectiveness/milestone-7-final-source-closure.tsv"
header = ["order", "source", "canonical_owner", "current_shape", "treatment", "retention_evidence", "risk", "concurrency", "gate"]
columns = ["source"]
order = "source"

[[checks]]
id = "router-policy"
type = "text"
path = "STANDARDS-ROUTER.md"
required = [
  "Select a canonical topic only when its observable condition is present",
  "## Legacy Entry Points",
  "Canonical modules own all normative rules.",
  "non-normative navigation only",
  "It does not establish",
  "applicability, preserve an older rule, or provide fallback authority.",
  "return an Invalid Routing diagnostic",
  "instead of selecting a legacy entrypoint",
]
prohibited = [
  "until migration",
  "Existing files retain authority only for rules not yet moved",
]

[[checks]]
id = "parent-plan-state"
type = "text"
path = "plans/standards-library-effectiveness-restructure-plan.md"
required = ["`7.4c2` (`Accepted`)"]
prohibited = []
