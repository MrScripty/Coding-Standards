schema_version = 1
id = "policy-semantic-impact"
owner = "workflow.planning"
description = "Checks declared policy-consumer graph integrity. Does not certify prose quality, consumer compliance, or unexecuted runtime behavior."

[[checks]]
id = "current-structure"
type = "policy_impact"
source_registry = "evaluation/standards-effectiveness/edge-source-registry.toml"

[[checks]]
id = "negative-fixtures"
type = "policy_impact"
cases = [{ expected = ["POLICY_IMPACT.DUPLICATE_EDGE"], id = "duplicate-edge", manifest = "evaluation/standards-effectiveness/fixtures/policy-impact/duplicate-edge.toml" }, { expected = ["POLICY_IMPACT.UNKNOWN_OWNER"], id = "unknown-owner", manifest = "evaluation/standards-effectiveness/fixtures/policy-impact/unknown-owner.toml" }, { expected = ["POLICY_IMPACT.UNKNOWN_CONSUMER"], id = "unknown-consumer", manifest = "evaluation/standards-effectiveness/fixtures/policy-impact/unknown-consumer.toml" }, { expected = ["POLICY_IMPACT.APPLICABILITY"], id = "missing-applicability", manifest = "evaluation/standards-effectiveness/fixtures/policy-impact/missing-applicability.toml" }, { expected = ["POLICY_IMPACT.RELATION"], id = "malformed-relation", manifest = "evaluation/standards-effectiveness/fixtures/policy-impact/malformed-relation.toml" }, { expected = ["PATH.OUTSIDE_REPOSITORY"], id = "path-escape", manifest = "evaluation/standards-effectiveness/fixtures/policy-impact/path-escape.toml" }, { expected = ["INPUT.UNAVAILABLE"], id = "missing-file", manifest = "evaluation/standards-effectiveness/fixtures/policy-impact/missing-file.toml" }]
