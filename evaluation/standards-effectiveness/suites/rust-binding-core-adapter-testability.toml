schema_version = 1
id = "rust-binding-core-adapter-testability"
owner = "profile.language.rust.language-bindings"
description = "Independent framework-free core and real native/host adapter evidence without framework, native-only, skipped-core, alternate, or default-success fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/binding-core-adapter-testability-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
boundary = ["contradictory", "missing", "selected"]
core_evidence = ["failed", "framework-free", "missing"]
adapter_required = ["no", "yes"]
adapter_evidence = ["failed", "missing", "native-host", "native-only", "not-required"]
capability = ["available", "not-required", "unavailable"]
fallback = ["alternate-framework", "default-success", "native-only", "nif-only", "none", "skip-core"]
expected = ["allow", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "boundary", op = "eq", value = "contradictory" },
  { field = "core_evidence", op = "eq", value = "failed" },
  { field = "adapter_evidence", op = "in", values = ["failed", "native-only"] },
  { all = [
    { field = "adapter_required", op = "eq", value = "no" },
    { field = "adapter_evidence", op = "ne", value = "not-required" },
  ] },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "boundary", op = "eq", value = "missing" },
  { field = "core_evidence", op = "eq", value = "missing" },
  { field = "capability", op = "eq", value = "unavailable" },
  { all = [
    { field = "adapter_required", op = "eq", value = "yes" },
    { field = "adapter_evidence", op = "eq", value = "missing" },
  ] },
]

[[checks]]
id = "section-inventory"
type = "table"
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
order = "source"
expected = [["STD-0804", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "745", "3", "language-profile", "split", "NIF Pure-Logic Separation"]]
[checks.projections.where]
field = "id"
op = "eq"
value = "STD-0804"

[[checks]]
id = "exact-disposition"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [["STD-0804", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "profiles/languages/rust/language-bindings.md", "refine", "require independent framework-free core and real adapter-host evidence"]]
[checks.projections.where]
field = "id"
op = "eq"
value = "STD-0804"
