schema_version = 1
id = "contract-planning-boundary"
owner = "topic.contracts"
description = "Fact-driven contract planning with bounded implementation freezes and typed diagnostics instead of compatibility fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/contracts/planning-boundary-decisions.tsv"
expected_column = "expected"
default = "typed-invalid"
[checks.domains]
case = ["*"]
facts = ["complete", "missing"]
class = ["generated", "internal-coordinated", "persisted", "public-versioned", "distributed-independent"]
deployment = ["atomic", "independent"]
concurrent_dependency = ["active", "complete"]
request = ["select", "permanent-freeze", "append-only", "additive-safe", "example-authority", "compatibility-shim"]
expected = ["freeze-temporary", "migrate", "negotiate", "regenerate", "replace", "typed-invalid", "typed-unavailable", "version"]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
field = "facts"
op = "eq"
value = "missing"
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
field = "request"
op = "ne"
value = "select"
[[checks.rules]]
outcome = "freeze-temporary"
[checks.rules.when]
field = "concurrent_dependency"
op = "eq"
value = "active"
[[checks.rules]]
outcome = "replace"
[checks.rules.when]
all = [
  { field = "class", op = "eq", value = "internal-coordinated" },
  { field = "deployment", op = "eq", value = "atomic" },
]
[[checks.rules]]
outcome = "migrate"
[checks.rules.when]
field = "class"
op = "eq"
value = "persisted"
[[checks.rules]]
outcome = "version"
[checks.rules.when]
field = "class"
op = "eq"
value = "public-versioned"
[[checks.rules]]
outcome = "negotiate"
[checks.rules.when]
all = [
  { field = "class", op = "eq", value = "distributed-independent" },
  { field = "deployment", op = "eq", value = "independent" },
]
[[checks.rules]]
outcome = "regenerate"
[checks.rules.when]
field = "class"
op = "eq"
value = "generated"

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
[[checks.projections]]
columns = ["id", "source", "target", "disposition"]
order = "source"
expected = [
  ["STD-0046", "ARCHITECTURE-PATTERNS.md", "topics/contracts.md", "index"],
  ["STD-0047", "ARCHITECTURE-PATTERNS.md", "topics/contracts.md", "index"],
  ["STD-0048", "ARCHITECTURE-PATTERNS.md", "topics/contracts.md", "index"],
  ["STD-0049", "ARCHITECTURE-PATTERNS.md", "topics/contracts.md", "index"],
  ["STD-0050", "ARCHITECTURE-PATTERNS.md", "topics/contracts.md", "index"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0046", "STD-0047", "STD-0048", "STD-0049", "STD-0050"]
