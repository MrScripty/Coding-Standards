schema_version = 1
id = "commit-consolidation-dispositions"
owner = "workflow.commit"
description = "Commit authority, branch lifecycle, exact dispositions, target validity, legacy routes, and reference ownership."

[[checks]]
id = "commit-authority-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/commit/authority.tsv"
expected_column = "expected"
default = "rewrite-linear"
[checks.domains]
case = ["*"]
event = ["commit", "history-maintenance", "milestone", "pre-push", "pr"]
history = ["shared", "unshared"]
authority = ["no", "yes"]
recoverable = ["no", "yes"]
topology = ["linear", "merge"]
expected = ["history-review", "refuse-shared", "refuse-unauthorized", "refuse-unrecoverable", "rewrite-linear", "rewrite-merge", "staged-review"]
[[checks.rules]]
outcome = "staged-review"
[checks.rules.when]
all = [{ field = "event", op = "eq", value = "commit" }]
[[checks.rules]]
outcome = "history-review"
[checks.rules.when]
all = [{ field = "event", op = "ne", value = "history-maintenance" }]
[[checks.rules]]
outcome = "refuse-unauthorized"
[checks.rules.when]
all = [{ field = "authority", op = "eq", value = "no" }]
[[checks.rules]]
outcome = "refuse-shared"
[checks.rules.when]
all = [{ field = "history", op = "eq", value = "shared" }]
[[checks.rules]]
outcome = "refuse-unrecoverable"
[checks.rules.when]
all = [{ field = "recoverable", op = "eq", value = "no" }]
[[checks.rules]]
outcome = "rewrite-merge"
[checks.rules.when]
all = [{ field = "topology", op = "eq", value = "merge" }]

[[checks]]
id = "hook-bypass-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/commit/hook-bypass.tsv"
expected_column = "expected"
default = "allow-bypass"
[checks.domains]
case = ["*"]
authority = ["explicit", "missing"]
scope = ["complete", "missing"]
reason = ["missing", "recorded"]
unmet_checks = ["missing", "recorded"]
compensation = ["complete", "missing"]
follow_up = ["missing", "required"]
fallback = ["emergency", "later-repair", "no-verify", "none"]
expected = ["allow-bypass", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "authority", op = "eq", value = "missing" },
  { field = "fallback", op = "ne", value = "none" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "scope", op = "eq", value = "missing" },
  { field = "reason", op = "eq", value = "missing" },
  { field = "unmet_checks", op = "eq", value = "missing" },
  { field = "compensation", op = "eq", value = "missing" },
  { field = "follow_up", op = "eq", value = "missing" },
]

[[checks]]
id = "branch-lifecycle-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/commit/branch-lifecycle.tsv"
input_columns = ["context", "isolation", "proposal", "replacement_state", "target", "visibility", "topology", "terminal", "long_lived_contract", "ownership", "worktree", "cleanup_basis", "head_reachability", "commit_disposition", "discard_authority", "mapping", "prepared_in_worktree"]
[checks.domains]
case = ["*"]
context = ["complete", "contradictory", "missing"]
isolation = ["material", "none"]
proposal = ["complete", "concurrent", "none", "selective"]
replacement_state = ["created", "not-applicable", "not-created"]
target = ["advanced", "current-descendant", "independent", "not-applicable"]
visibility = ["long-lived", "not-applicable", "private", "shared"]
topology = ["durable", "linear", "not-applicable"]
terminal = ["abandoned", "integrated", "pending", "rejected", "retained", "superseded"]
long_lived_contract = ["complete", "incomplete", "not-applicable"]
ownership = ["owned", "unknown"]
worktree = ["clean", "dirty", "locked", "none", "stale-registration", "unique"]
cleanup_basis = ["age", "count", "evidence-only", "force", "none", "terminal"]
head_reachability = ["not-applicable", "registration-only", "retained-ref", "unknown"]
commit_disposition = ["archived", "discard-authorized", "missing", "not-applicable", "retained"]
discard_authority = ["explicit", "missing", "not-applicable"]
mapping = ["complete", "missing", "not-applicable"]
prepared_in_worktree = ["no", "yes"]
expected_isolation = ["direct", "isolated", "typed-invalid", "typed-unavailable"]
expected_integration = ["cherry-pick", "fast-forward", "merge", "not-applicable", "rebase-verify-fast-forward", "refuse-shared-rebase", "serial-integration", "typed-invalid", "typed-unavailable"]
expected_terminal = ["abandoned", "integrated", "pending", "rejected", "retained", "superseded", "typed-invalid", "typed-unavailable"]
expected_lineage = ["mapping-required", "not-required", "record-source-to-accepted", "typed-invalid", "typed-unavailable"]
expected_cleanup = ["discard-authorized", "none", "pruned-archived-registration", "pruned-reachable-registration", "refuse-cleanup", "removed-archived-worktree", "removed-reachable-worktree", "retained-protected-worktree", "retire-redundant-ref", "typed-invalid", "typed-unavailable"]

[[checks.outputs]]
column = "expected_isolation"
default = "isolated"
[[checks.outputs.rules]]
outcome = "typed-invalid"
[checks.outputs.rules.when]
all = [{ field = "context", op = "eq", value = "contradictory" }]
[[checks.outputs.rules]]
outcome = "typed-unavailable"
[checks.outputs.rules.when]
all = [{ field = "context", op = "eq", value = "missing" }]
[[checks.outputs.rules]]
outcome = "direct"
[checks.outputs.rules.when]
all = [{ field = "isolation", op = "eq", value = "none" }]

[[checks.outputs]]
column = "expected_integration"
default = "typed-unavailable"
[[checks.outputs.rules]]
outcome = "typed-invalid"
[checks.outputs.rules.when]
all = [{ field = "context", op = "eq", value = "contradictory" }]
[[checks.outputs.rules]]
outcome = "typed-unavailable"
[checks.outputs.rules.when]
any = [
  { field = "context", op = "eq", value = "missing" },
]
[[checks.outputs.rules]]
outcome = "refuse-shared-rebase"
[checks.outputs.rules.when]
all = [{ field = "proposal", op = "eq", value = "complete" }, { field = "target", op = "eq", value = "advanced" }, { field = "visibility", op = "eq", value = "shared" }]
[[checks.outputs.rules]]
outcome = "serial-integration"
[checks.outputs.rules.when]
all = [{ field = "proposal", op = "eq", value = "concurrent" }]
[[checks.outputs.rules]]
outcome = "merge"
[checks.outputs.rules.when]
all = [{ field = "topology", op = "eq", value = "durable" }, { field = "proposal", op = "eq", value = "complete" }]
[[checks.outputs.rules]]
outcome = "cherry-pick"
[checks.outputs.rules.when]
all = [{ field = "proposal", op = "eq", value = "selective" }, { field = "replacement_state", op = "eq", value = "not-created" }]
[[checks.outputs.rules]]
outcome = "rebase-verify-fast-forward"
[checks.outputs.rules.when]
all = [{ field = "proposal", op = "eq", value = "complete" }, { field = "target", op = "eq", value = "advanced" }, { field = "visibility", op = "eq", value = "private" }]
[[checks.outputs.rules]]
outcome = "fast-forward"
[checks.outputs.rules.when]
all = [{ field = "proposal", op = "eq", value = "complete" }, { field = "target", op = "eq", value = "current-descendant" }]
[[checks.outputs.rules]]
outcome = "not-applicable"
[checks.outputs.rules.when]
any = [{ field = "proposal", op = "eq", value = "none" }, { field = "replacement_state", op = "eq", value = "created" }]

[[checks.outputs]]
column = "expected_terminal"
default = "pending"
[[checks.outputs.rules]]
outcome = "typed-invalid"
[checks.outputs.rules.when]
all = [{ field = "context", op = "eq", value = "contradictory" }]
[[checks.outputs.rules]]
outcome = "typed-unavailable"
[checks.outputs.rules.when]
any = [
  { field = "context", op = "eq", value = "missing" },
  { all = [{ field = "terminal", op = "eq", value = "retained" }, { field = "long_lived_contract", op = "eq", value = "incomplete" }] },
  { all = [{ field = "replacement_state", op = "eq", value = "created" }, { field = "mapping", op = "eq", value = "missing" }] },
]
[[checks.outputs.rules]]
outcome = "integrated"
[checks.outputs.rules.when]
all = [{ field = "terminal", op = "eq", value = "integrated" }]
[[checks.outputs.rules]]
outcome = "rejected"
[checks.outputs.rules.when]
all = [{ field = "terminal", op = "eq", value = "rejected" }]
[[checks.outputs.rules]]
outcome = "abandoned"
[checks.outputs.rules.when]
all = [{ field = "terminal", op = "eq", value = "abandoned" }]
[[checks.outputs.rules]]
outcome = "superseded"
[checks.outputs.rules.when]
all = [{ field = "terminal", op = "eq", value = "superseded" }]
[[checks.outputs.rules]]
outcome = "retained"
[checks.outputs.rules.when]
all = [{ field = "terminal", op = "eq", value = "retained" }]

[[checks.outputs]]
column = "expected_lineage"
default = "not-required"
[[checks.outputs.rules]]
outcome = "typed-invalid"
[checks.outputs.rules.when]
all = [{ field = "context", op = "eq", value = "contradictory" }]
[[checks.outputs.rules]]
outcome = "typed-unavailable"
[checks.outputs.rules.when]
all = [{ field = "context", op = "eq", value = "missing" }]
[[checks.outputs.rules]]
outcome = "mapping-required"
[checks.outputs.rules.when]
all = [{ field = "replacement_state", op = "eq", value = "created" }, { field = "mapping", op = "eq", value = "missing" }]
[[checks.outputs.rules]]
outcome = "record-source-to-accepted"
[checks.outputs.rules.when]
all = [{ field = "replacement_state", op = "eq", value = "created" }, { field = "mapping", op = "eq", value = "complete" }]

[[checks.outputs]]
column = "expected_cleanup"
default = "none"
[[checks.outputs.rules]]
outcome = "typed-invalid"
[checks.outputs.rules.when]
any = [
  { field = "context", op = "eq", value = "contradictory" },
  { all = [{ field = "commit_disposition", op = "eq", value = "discard-authorized" }, { field = "discard_authority", op = "ne", value = "explicit" }] },
  { all = [{ field = "discard_authority", op = "eq", value = "explicit" }, { field = "commit_disposition", op = "ne", value = "discard-authorized" }] },
]
[[checks.outputs.rules]]
outcome = "typed-unavailable"
[checks.outputs.rules.when]
all = [{ field = "context", op = "eq", value = "missing" }]
[[checks.outputs.rules]]
outcome = "discard-authorized"
[checks.outputs.rules.when]
all = [{ field = "terminal", op = "in", values = ["abandoned", "rejected"] }, { field = "worktree", op = "eq", value = "unique" }, { field = "commit_disposition", op = "eq", value = "discard-authorized" }, { field = "discard_authority", op = "eq", value = "explicit" }, { field = "ownership", op = "eq", value = "owned" }]
[[checks.outputs.rules]]
outcome = "refuse-cleanup"
[checks.outputs.rules.when]
any = [
  { field = "ownership", op = "eq", value = "unknown" },
  { field = "cleanup_basis", op = "in", values = ["age", "count", "force"] },
  { all = [{ field = "visibility", op = "eq", value = "long-lived" }, { field = "long_lived_contract", op = "eq", value = "incomplete" }] },
  { all = [{ field = "replacement_state", op = "eq", value = "created" }, { field = "mapping", op = "eq", value = "missing" }] },
  { all = [{ field = "cleanup_basis", op = "eq", value = "evidence-only" }, { field = "mapping", op = "eq", value = "missing" }] },
  { all = [{ field = "worktree", op = "in", values = ["clean", "stale-registration"] }, { field = "cleanup_basis", op = "eq", value = "terminal" }, { field = "head_reachability", op = "eq", value = "unknown" }] },
  { all = [{ field = "worktree", op = "in", values = ["clean", "stale-registration"] }, { field = "cleanup_basis", op = "eq", value = "terminal" }, { field = "head_reachability", op = "eq", value = "registration-only" }, { field = "commit_disposition", op = "in", values = ["missing", "retained"] }] },
  { all = [{ field = "worktree", op = "in", values = ["clean", "stale-registration"] }, { field = "cleanup_basis", op = "eq", value = "terminal" }, { field = "head_reachability", op = "eq", value = "retained-ref" }, { field = "commit_disposition", op = "in", values = ["archived", "missing"] }] },
]
[[checks.outputs.rules]]
outcome = "retained-protected-worktree"
[checks.outputs.rules.when]
all = [{ field = "worktree", op = "in", values = ["dirty", "locked", "unique"] }]
[[checks.outputs.rules]]
outcome = "pruned-reachable-registration"
[checks.outputs.rules.when]
all = [{ field = "worktree", op = "eq", value = "stale-registration" }, { field = "cleanup_basis", op = "eq", value = "terminal" }, { field = "head_reachability", op = "eq", value = "retained-ref" }, { field = "commit_disposition", op = "eq", value = "retained" }]
[[checks.outputs.rules]]
outcome = "pruned-archived-registration"
[checks.outputs.rules.when]
all = [{ field = "worktree", op = "eq", value = "stale-registration" }, { field = "cleanup_basis", op = "eq", value = "terminal" }, { field = "head_reachability", op = "eq", value = "registration-only" }, { field = "commit_disposition", op = "eq", value = "archived" }]
[[checks.outputs.rules]]
outcome = "removed-reachable-worktree"
[checks.outputs.rules.when]
all = [{ field = "worktree", op = "eq", value = "clean" }, { field = "terminal", op = "eq", value = "integrated" }, { field = "cleanup_basis", op = "eq", value = "terminal" }, { field = "head_reachability", op = "eq", value = "retained-ref" }, { field = "commit_disposition", op = "eq", value = "retained" }]
[[checks.outputs.rules]]
outcome = "removed-archived-worktree"
[checks.outputs.rules.when]
all = [{ field = "worktree", op = "eq", value = "clean" }, { field = "terminal", op = "eq", value = "integrated" }, { field = "cleanup_basis", op = "eq", value = "terminal" }, { field = "head_reachability", op = "eq", value = "registration-only" }, { field = "commit_disposition", op = "eq", value = "archived" }]
[[checks.outputs.rules]]
outcome = "retire-redundant-ref"
[checks.outputs.rules.when]
all = [{ field = "cleanup_basis", op = "eq", value = "evidence-only" }, { field = "mapping", op = "eq", value = "complete" }]

[[checks]]
id = "task-worktree-terminal-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/commit/task-worktree-terminal.tsv"
expected_column = "expected"
default = "typed-unavailable"
[checks.domains]
case = ["*"]
task_created = ["no", "yes"]
terminal_record = ["complete", "missing", "not-applicable"]
registry_state = ["absent", "not-applicable", "present"]
retention_contract = ["complete", "missing", "not-applicable"]
ownership = ["not-applicable", "owned", "unknown"]
head_reachability = ["not-applicable", "registration-only", "retained-ref", "unknown"]
commit_disposition = ["archived", "discard-authorized", "missing", "not-applicable", "retained"]
discard_authority = ["explicit", "missing", "not-applicable"]
expected = ["accepted-discard-authorized", "accepted-removed-archived", "accepted-removed-reachable", "accepted-retained", "not-applicable", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { all = [{ field = "task_created", op = "eq", value = "yes" }, { field = "ownership", op = "eq", value = "unknown" }] },
  { all = [{ field = "head_reachability", op = "eq", value = "retained-ref" }, { field = "commit_disposition", op = "eq", value = "archived" }] },
  { all = [{ field = "commit_disposition", op = "eq", value = "discard-authorized" }, { field = "discard_authority", op = "ne", value = "explicit" }] },
  { all = [{ field = "discard_authority", op = "eq", value = "explicit" }, { field = "commit_disposition", op = "ne", value = "discard-authorized" }] },
  { all = [{ field = "commit_disposition", op = "eq", value = "discard-authorized" }, { field = "registry_state", op = "ne", value = "absent" }] },
]
[[checks.rules]]
outcome = "not-applicable"
[checks.rules.when]
all = [{ field = "task_created", op = "eq", value = "no" }]
[[checks.rules]]
outcome = "accepted-removed-reachable"
[checks.rules.when]
all = [{ field = "task_created", op = "eq", value = "yes" }, { field = "terminal_record", op = "eq", value = "complete" }, { field = "registry_state", op = "eq", value = "absent" }, { field = "ownership", op = "eq", value = "owned" }, { field = "head_reachability", op = "eq", value = "retained-ref" }, { field = "commit_disposition", op = "eq", value = "retained" }]
[[checks.rules]]
outcome = "accepted-removed-archived"
[checks.rules.when]
all = [{ field = "task_created", op = "eq", value = "yes" }, { field = "terminal_record", op = "eq", value = "complete" }, { field = "registry_state", op = "eq", value = "absent" }, { field = "ownership", op = "eq", value = "owned" }, { field = "head_reachability", op = "eq", value = "registration-only" }, { field = "commit_disposition", op = "eq", value = "archived" }]
[[checks.rules]]
outcome = "accepted-discard-authorized"
[checks.rules.when]
all = [{ field = "task_created", op = "eq", value = "yes" }, { field = "terminal_record", op = "eq", value = "complete" }, { field = "registry_state", op = "eq", value = "absent" }, { field = "ownership", op = "eq", value = "owned" }, { field = "head_reachability", op = "eq", value = "registration-only" }, { field = "commit_disposition", op = "eq", value = "discard-authorized" }, { field = "discard_authority", op = "eq", value = "explicit" }]
[[checks.rules]]
outcome = "accepted-retained"
[checks.rules.when]
all = [{ field = "task_created", op = "eq", value = "yes" }, { field = "terminal_record", op = "eq", value = "complete" }, { field = "registry_state", op = "eq", value = "present" }, { field = "retention_contract", op = "eq", value = "complete" }, { field = "ownership", op = "eq", value = "owned" }, { field = "head_reachability", op = "ne", value = "unknown" }, { field = "commit_disposition", op = "eq", value = "retained" }]

[[checks]]
id = "commit-identifier-coverage"
type = "relation"
mode = "set"
[checks.left]
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
columns = ["id"]
order = "source"
where = { field = "path", op = "eq", value = "COMMIT-STANDARDS.md" }
[checks.right]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
columns = ["id"]
order = "source"
where = { field = "source", op = "eq", value = "COMMIT-STANDARDS.md" }

[[checks]]
id = "commit-row-policy"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
[[checks.projections]]
columns = ["id", "disposition"]
order = "source"
expected = []
where = { all = [
  { field = "source", op = "eq", value = "COMMIT-STANDARDS.md" },
  { field = "disposition", op = "not_in", values = ["move", "reference", "remove", "index"] },
] }
[[checks.projections]]
columns = ["id", "rationale"]
order = "source"
expected = []
where = { all = [
  { field = "source", op = "eq", value = "COMMIT-STANDARDS.md" },
  { field = "rationale", op = "eq", value = "" },
] }
[[checks.projections]]
columns = ["id", "target"]
order = "source"
expected = []
where = { all = [
  { field = "source", op = "eq", value = "COMMIT-STANDARDS.md" },
  { field = "disposition", op = "eq", value = "remove" },
  { field = "target", op = "ne", value = "none" },
] }

[[checks]]
id = "commit-target-files"
type = "repository_paths"
[checks.paths]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
columns = ["target"]
order = "source"
where = { all = [
  { field = "source", op = "eq", value = "COMMIT-STANDARDS.md" },
  { field = "disposition", op = "ne", value = "remove" },
] }

[[checks]]
id = "commit-index-structure"
type = "markdown_structure"
path = "COMMIT-STANDARDS.md"
headings = ["# Commit Standards Legacy Index", "## Canonical Commit Routes"]
maximum_lines = 20

[[checks]]
id = "commit-owner-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
[[checks.projections]]
columns = ["id", "source", "target", "disposition"]
order = "source"
expected = [
  ["STD-0663", "TOOLING-STANDARDS.md", "workflows/commit.md", "refine"],
  ["STD-0703", "TOOLING-STANDARDS.md", "workflows/commit.md", "refine"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0663", "STD-0703"]
