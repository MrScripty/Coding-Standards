schema_version = 1
id = "commit-consolidation-dispositions"
owner = "workflow.commit"
description = "Commit authority, branch lifecycle, exact dispositions, target validity, legacy routes, and reference ownership."

[[checks]]
id = "commit-authority-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/commit/authority.tsv"
expected_column = "expected"
default = "rewrite-linear"
[checks.domains]
case = ["*"]
event = ["commit", "history-maintenance", "milestone", "pre-push", "pr"]
history = ["shared", "unshared"]
authority = ["no", "yes"]
recoverable = ["no", "yes"]
topology = ["linear", "merge"]
expected = ["history-review", "refuse-shared", "refuse-unauthorized", "refuse-unrecoverable", "rewrite-linear", "rewrite-merge", "staged-review"]
[[checks.rules]]
outcome = "staged-review"
[checks.rules.when]
all = [{ field = "event", op = "eq", value = "commit" }]
[[checks.rules]]
outcome = "history-review"
[checks.rules.when]
all = [{ field = "event", op = "ne", value = "history-maintenance" }]
[[checks.rules]]
outcome = "refuse-unauthorized"
[checks.rules.when]
all = [{ field = "authority", op = "eq", value = "no" }]
[[checks.rules]]
outcome = "refuse-shared"
[checks.rules.when]
all = [{ field = "history", op = "eq", value = "shared" }]
[[checks.rules]]
outcome = "refuse-unrecoverable"
[checks.rules.when]
all = [{ field = "recoverable", op = "eq", value = "no" }]
[[checks.rules]]
outcome = "rewrite-merge"
[checks.rules.when]
all = [{ field = "topology", op = "eq", value = "merge" }]

[[checks]]
id = "hook-bypass-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/commit/hook-bypass.tsv"
expected_column = "expected"
default = "allow-bypass"
[checks.domains]
case = ["*"]
authority = ["explicit", "missing"]
scope = ["complete", "missing"]
reason = ["missing", "recorded"]
unmet_checks = ["missing", "recorded"]
compensation = ["complete", "missing"]
follow_up = ["missing", "required"]
fallback = ["emergency", "later-repair", "no-verify", "none"]
expected = ["allow-bypass", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "authority", op = "eq", value = "missing" },
  { field = "fallback", op = "ne", value = "none" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "scope", op = "eq", value = "missing" },
  { field = "reason", op = "eq", value = "missing" },
  { field = "unmet_checks", op = "eq", value = "missing" },
  { field = "compensation", op = "eq", value = "missing" },
  { field = "follow_up", op = "eq", value = "missing" },
]

[[checks]]
id = "branch-lifecycle-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/commit/branch-lifecycle.tsv"
expected_column = "expected"
default = "refuse-cleanup"
[checks.domains]
case = ["*"]
isolation = ["material", "none"]
proposal = ["complete", "concurrent", "none", "selective"]
target = ["advanced", "current-descendant", "independent", "not-applicable"]
visibility = ["long-lived", "not-applicable", "private", "shared"]
topology = ["durable", "linear", "not-applicable"]
terminal = ["abandoned", "integrated", "pending", "rejected", "retained", "superseded"]
ownership = ["owned", "unknown"]
worktree = ["clean", "dirty", "locked", "none", "stale-registration", "unique"]
cleanup_basis = ["age", "count", "evidence-only", "force", "none", "terminal"]
mapping = ["complete", "missing", "not-applicable"]
expected = ["cherry-pick-lineage", "direct-serial", "fast-forward", "mapping-required", "merge", "prune-stale-registration", "rebase-verify-fast-forward", "refuse-cleanup", "remove-clean-worktree", "retain-long-lived", "retain-protected-worktree", "retire-redundant-evidence", "serial-integration", "terminal-classified"]
[[checks.rules]]
outcome = "refuse-cleanup"
[checks.rules.when]
any = [
  { field = "ownership", op = "eq", value = "unknown" },
  { field = "cleanup_basis", op = "in", values = ["age", "count", "force"] },
]
[[checks.rules]]
outcome = "retain-protected-worktree"
[checks.rules.when]
all = [{ field = "worktree", op = "in", values = ["dirty", "locked", "unique"] }]
[[checks.rules]]
outcome = "mapping-required"
[checks.rules.when]
all = [
  { field = "proposal", op = "eq", value = "selective" },
  { field = "mapping", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "prune-stale-registration"
[checks.rules.when]
all = [{ field = "worktree", op = "eq", value = "stale-registration" }]
[[checks.rules]]
outcome = "remove-clean-worktree"
[checks.rules.when]
all = [
  { field = "worktree", op = "eq", value = "clean" },
  { field = "terminal", op = "eq", value = "integrated" },
  { field = "cleanup_basis", op = "eq", value = "terminal" },
]
[[checks.rules]]
outcome = "retain-long-lived"
[checks.rules.when]
all = [{ field = "terminal", op = "eq", value = "retained" }]
[[checks.rules]]
outcome = "terminal-classified"
[checks.rules.when]
all = [{ field = "terminal", op = "in", values = ["abandoned", "rejected", "superseded"] }]
[[checks.rules]]
outcome = "retire-redundant-evidence"
[checks.rules.when]
all = [
  { field = "cleanup_basis", op = "eq", value = "evidence-only" },
  { field = "mapping", op = "eq", value = "complete" },
]
[[checks.rules]]
outcome = "cherry-pick-lineage"
[checks.rules.when]
all = [
  { field = "proposal", op = "eq", value = "selective" },
  { field = "mapping", op = "eq", value = "complete" },
]
[[checks.rules]]
outcome = "serial-integration"
[checks.rules.when]
all = [{ field = "proposal", op = "eq", value = "concurrent" }]
[[checks.rules]]
outcome = "merge"
[checks.rules.when]
all = [{ field = "topology", op = "eq", value = "durable" }]
[[checks.rules]]
outcome = "rebase-verify-fast-forward"
[checks.rules.when]
all = [
  { field = "proposal", op = "eq", value = "complete" },
  { field = "target", op = "eq", value = "advanced" },
  { field = "visibility", op = "eq", value = "private" },
]
[[checks.rules]]
outcome = "fast-forward"
[checks.rules.when]
all = [
  { field = "proposal", op = "eq", value = "complete" },
  { field = "target", op = "eq", value = "current-descendant" },
]
[[checks.rules]]
outcome = "direct-serial"
[checks.rules.when]
all = [{ field = "isolation", op = "eq", value = "none" }]

[[checks]]
id = "commit-identifier-coverage"
type = "relation"
mode = "set"
[checks.left]
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
columns = ["id"]
order = "source"
where = { field = "path", op = "eq", value = "COMMIT-STANDARDS.md" }
[checks.right]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
columns = ["id"]
order = "source"
where = { field = "source", op = "eq", value = "COMMIT-STANDARDS.md" }

[[checks]]
id = "commit-row-policy"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
[[checks.projections]]
columns = ["id", "disposition"]
order = "source"
expected = []
where = { all = [
  { field = "source", op = "eq", value = "COMMIT-STANDARDS.md" },
  { field = "disposition", op = "not_in", values = ["move", "reference", "remove", "index"] },
] }
[[checks.projections]]
columns = ["id", "rationale"]
order = "source"
expected = []
where = { all = [
  { field = "source", op = "eq", value = "COMMIT-STANDARDS.md" },
  { field = "rationale", op = "eq", value = "" },
] }
[[checks.projections]]
columns = ["id", "target"]
order = "source"
expected = []
where = { all = [
  { field = "source", op = "eq", value = "COMMIT-STANDARDS.md" },
  { field = "disposition", op = "eq", value = "remove" },
  { field = "target", op = "ne", value = "none" },
] }

[[checks]]
id = "commit-target-files"
type = "repository_paths"
[checks.paths]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
columns = ["target"]
order = "source"
where = { all = [
  { field = "source", op = "eq", value = "COMMIT-STANDARDS.md" },
  { field = "disposition", op = "ne", value = "remove" },
] }

[[checks]]
id = "commit-index-structure"
type = "markdown_structure"
path = "COMMIT-STANDARDS.md"
headings = ["# Commit Standards Legacy Index", "## Canonical Commit Routes"]
maximum_lines = 20

[[checks]]
id = "commit-index-routes"
type = "text"
path = "COMMIT-STANDARDS.md"
required = ["workflows/commit.md", "reference/recipes/commits.md"]
prohibited = ["Mandatory History Cleanup Before Commit", "must rewrite unpushed history", "mandatory cleanup rule", "Rewriting unpushed merge commits is allowed", "Drop regression commits and fixup fixes", "@{u}", "git commit --no-verify", "When absolutely necessary"]

[[checks]]
id = "router-commit-route"
type = "text"
path = "STANDARDS-ROUTER.md"
required = ["workflows/commit.md", "branch/worktree isolation", "terminal lifecycle"]
prohibited = []

[[checks]]
id = "tooling-commit-route"
type = "text"
path = "TOOLING-STANDARDS.md"
required = ["workflows/commit.md"]
prohibited = ["Mandatory History Cleanup Before Commit", "must rewrite unpushed history", "mandatory cleanup rule", "Rewriting unpushed merge commits is allowed", "Drop regression commits and fixup fixes", "@{u}", "git commit --no-verify", "When absolutely necessary"]

[[checks]]
id = "implementation-commit-route"
type = "text"
path = "workflows/implementation.md"
required = ["(commit.md)", "branch and worktree applicability", "integration mechanism", "terminal lifecycle"]
prohibited = ["Mandatory History Cleanup Before Commit", "must rewrite unpushed history", "mandatory cleanup rule", "Rewriting unpushed merge commits is allowed", "Drop regression commits and fixup fixes", "@{u}", "git commit --no-verify", "When absolutely necessary"]

[[checks]]
id = "lefthook-legacy-closure"
type = "text"
path = "templates/lefthook.yml"
required = []
prohibited = ["Mandatory History Cleanup Before Commit", "must rewrite unpushed history", "mandatory cleanup rule", "Rewriting unpushed merge commits is allowed", "Drop regression commits and fixup fixes", "@{u}", "git commit --no-verify", "When absolutely necessary"]

[[checks]]
id = "hook-bypass-owner"
type = "text"
path = "workflows/commit.md"
required = ["## Hook Bypass Authority", "does not waive", "does not grant authority by itself", "Do not default to a bypass command", "leave the hook enabled"]
prohibited = []

[[checks]]
id = "commit-owner-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
[[checks.projections]]
columns = ["id", "source", "target", "disposition"]
order = "source"
expected = [
  ["STD-0663", "TOOLING-STANDARDS.md", "workflows/commit.md", "refine"],
  ["STD-0703", "TOOLING-STANDARDS.md", "workflows/commit.md", "refine"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0663", "STD-0703"]

[[checks]]
id = "commit-recipe-reference-metadata"
type = "text"
path = "reference/recipes/commits.md"
required = ["- Role: `reference`", "- Level: `REFERENCE`", "git merge --ff-only", "do not authorize rewriting or cleanup"]
prohibited = []

[[checks]]
id = "commit-lifecycle-owner"
type = "text"
path = "workflows/commit.md"
required = ["## Branch And Worktree Applicability", "## Integration Mechanism Selection", "## Cherry-Pick And Replacement Lineage", "## Terminal Branch Lifecycle", "## Worktree Lifecycle And Cleanup Authority", "Do not cherry-pick merely because", "never independently authorize deletion"]
prohibited = ["always create a branch", "always cherry-pick", "Force-remove dirty worktrees"]

[[checks]]
id = "planning-isolation-projection"
type = "text"
path = "workflows/planning.md"
required = ["## Repository Isolation In Written Plans", "does not require a branch or worktree by default", "predeclared terminal cleanup"]
prohibited = ["Every plan requires a branch"]

[[checks]]
id = "concurrent-isolation-projection"
type = "text"
path = "profiles/workflows/concurrent-plan-integration.md"
required = ["Do not require a branch or", "least history-transforming", "do not confer ownership", "Fresh admission is the"]
prohibited = ["cherry-pick integration is required"]

[[checks]]
id = "branch-lifecycle-planning-prompt"
type = "text"
path = "prompts/planning.md"
required = ["branch or worktree facts", "does not require a", "branch by itself"]
prohibited = ["branch for every"]

[[checks]]
id = "branch-lifecycle-implementation-prompt"
type = "text"
path = "prompts/implement-plan.md"
required = ["branch or worktree facts", "not cherry-pick by default"]
prohibited = ["always cherry-pick"]

[[checks]]
id = "branch-lifecycle-plan-template"
type = "text"
path = "templates/PLAN-TEMPLATE.md"
required = ["material repository isolation", "expected terminal disposition", "do not require a branch merely", "plan exists."]
prohibited = ["branch for every"]
