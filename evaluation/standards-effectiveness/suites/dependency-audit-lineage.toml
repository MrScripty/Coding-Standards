schema_version = 1
id = "dependency-audit-lineage"
owner = "topics.dependencies"
description = "Dependency audit scope, evidence, ownership, automation, bootstrap, and lineage without defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/dependencies/audit-lineage-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
scope = ["missing", "risk-derived"]
evidence = ["claim-matched", "missing", "tool-only"]
finding_owner = ["canonical", "unknown"]
automation = ["declared", "manual", "undeclared"]
bootstrap = ["ambient", "explicit", "implicit", "missing", "not-needed"]
fallback = ["ambient-tool", "audit-tool-default", "default-success", "implicit-install", "none", "schedule-default", "severity-default", "tool-proof"]
expected = ["allow", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
all = [{ field = "fallback", op = "ne", value = "none" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "scope", op = "eq", value = "missing" }, { field = "evidence", op = "eq", value = "missing" }, { field = "finding_owner", op = "eq", value = "unknown" }, { field = "bootstrap", op = "eq", value = "missing" }]

[[checks]]
id = "owner"
type = "text"
path = "topics/dependencies.md"
required = ["## Audit And Review", "## Automation And Bootstrap", "Derive audit scope and cadence", "prove only their declared detection contracts", "Tools required to execute dependency checks are dependencies themselves", "Do not install audit tools implicitly"]
prohibited = []

[[checks]]
id = "former-source"
type = "text"
path = "TOOLING-STANDARDS.md"
required = ["[Dependencies](topics/dependencies.md#audit-and-review)", "This heading indexes the non-normative", "legacy setup and package-script examples", "heading defines no required tool set"]
prohibited = ["[DEPENDENCY-STANDARDS.md](DEPENDENCY-STANDARDS.md)"]

[[checks]]
id = "dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition"]
order = "source"
expected = [
  ["STD-0699", "TOOLING-STANDARDS.md", "topics/dependencies.md", "refine"],
  ["STD-0700", "TOOLING-STANDARDS.md", "topics/dependencies.md", "index"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0699", "STD-0700"]

[[checks]]
id = "accepted-plan-state"
type = "text"
path = "plans/standards-library-effectiveness-restructure-plan.md"
required = ["`7.4b9r` (`Accepted`)"]
prohibited = []
