schema_version = 1
id = "testing-acceptance-paths"
owner = "workflow.verification"
description = "Acceptance-path evidence through owned observable boundaries without suite-label, lower-fidelity, partial-path, build, simulation, or checklist fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/verification/acceptance-path-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
authority = ["contradictory", "owned"]
path = ["integration", "system", "unsupported", "user-workflow"]
boundaries = ["complete", "contradictory", "minimal-complete", "missing"]
environment = ["missing", "representative", "required-real"]
result = ["missing", "observed"]
substitute = ["build-success", "checklist", "lower-fidelity", "none", "partial-path", "realistic-simulation", "suite-label"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "substitute", op = "ne", value = "none" },
  { field = "authority", op = "eq", value = "contradictory" },
  { field = "boundaries", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "path", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "boundaries", op = "eq", value = "missing" },
  { field = "environment", op = "eq", value = "missing" },
  { field = "result", op = "eq", value = "missing" },
]

[[checks]]
id = "owner"
type = "text"
path = "workflows/verification.md"
required = ["## Acceptance Paths And Boundaries", "name the observable start", "Repository suite labels such as unit", "one path claim plus separate contract", "This sequencing is a planning mechanism", "partial traversal, checklist completion"]
prohibited = []

[[checks]]
id = "legacy-routes"
type = "text"
path = "TESTING-STANDARDS.md"
required = [
  "| Acceptance claims, evidence kinds, environments, test design, placement, coverage, test data, async evidence, supporting gates, and diagnosis | [Verification](workflows/verification.md) |",
  "| Concurrent test resources and asynchronous lifecycle obligations | [Concurrency](topics/concurrency.md) |",
  "| Native and host binding evidence | [Language Bindings](profiles/boundaries/language-bindings.md) |",
  "| Replay, recovery, resumption, and idempotency evidence | [Resilience](topics/resilience.md) |",
]
prohibited = ["Test complete user workflows", "Write the vertical slice acceptance test before"]

[[checks]]
id = "dispositions"
type = "text"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
required = [
  "STD-0608\tTESTING-STANDARDS.md\tworkflows/verification.md\tindex\treplace test categories with a non-normative route to claim-selected evidence kinds paths environments and modes",
  "STD-0609\tTESTING-STANDARDS.md\tworkflows/verification.md\trefine\tselect focused evidence for local observable claims without isolation dependency or per-save duration defaults",
  "STD-0610\tTESTING-STANDARDS.md\tworkflows/verification.md\trefine\tselect integration evidence from real in-scope collaborating interfaces without mock-service or suite-label defaults",
  "STD-0612\tTESTING-STANDARDS.md\tworkflows/verification.md\trefine\tselect user-workflow system and environment evidence from the observable path without realistic-environment slower-suite or complete-workflow slogans",
  "STD-0613\tTESTING-STANDARDS.md\tworkflows/verification.md\trefine\trequire claim-selected producer-to-consumer path and separately owned contract evidence without typecheck unit partial-integration or lower-fidelity substitution",
  "STD-0614\tTESTING-STANDARDS.md\tworkflows/verification.md\trefine\tprove named boundary invariants through applicable contract and path claims without universal invariant lists coverage substitution or one-place documentation defaults",
  "STD-0615\tTESTING-STANDARDS.md\tworkflows/verification.md\trefine\tstart with the smallest useful objective path and broaden from risk and consumers without test-first one-full-path horizontal-scaling or vertical-slice-template defaults",
]
prohibited = []
