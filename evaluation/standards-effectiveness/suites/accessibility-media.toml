schema_version = 1
id = "accessibility-media"
owner = "topic.accessibility"
description = "Accessibility media meaning and equivalent outcomes without inferred fallback authority."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/accessibility/media-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
meaning = ["material", "missing", "none"]
classification = ["contradictory", "decorative", "functional", "informative", "missing"]
equivalent = ["complete", "filename", "missing", "not-required"]
context = ["complete", "visual-only"]
state = ["complete", "updated"]
capability = ["missing", "supported", "unsupported"]
fallback = ["empty-alt", "filename", "library-default", "none", "visual-context"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "classification", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "meaning", op = "eq", value = "missing" }, { field = "classification", op = "eq", value = "missing" }, { field = "equivalent", op = "eq", value = "missing" }, { field = "context", op = "eq", value = "missing" }, { field = "state", op = "eq", value = "missing" }, { field = "capability", op = "eq", value = "missing" }]

[[checks]]
id = "canonical-owner"
type = "text"
path = "topics/accessibility.md"
required = ["## Media Meaning And Classification", "## Equivalent Media Outcomes", "filename", "library convention"]
prohibited = []

[[checks]]
id = "reference"
type = "text"
path = "reference/recipes/accessibility.md"
required = ["## Web Image And Icon Mechanisms", "alt=\"\"", "alt=\"Error\"", "aria-hidden=\"true\""]
prohibited = []

[[checks]]
id = "legacy-index-purity"
type = "text"
path = "ACCESSIBILITY-STANDARDS.md"
required = ["## Media Semantics (Migrated)"]
prohibited = ["<img"]

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id"]
order = "source"
expected = [["STD-0020"], ["STD-0021"], ["STD-0022"]]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0020", "STD-0021", "STD-0022"]
