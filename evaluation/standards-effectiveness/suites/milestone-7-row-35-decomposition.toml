schema_version = 1
id = "milestone-7-row-35-decomposition"
owner = "migration.parent-plan"
description = "Accepted row-35 root-index lifecycle evidence with derived dependency and caller membership and no nested checker execution."

[[checks]]
id = "execution-decomposition"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
[[checks.projections]]
columns = ["child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "owner_transition"]
order = "source"
expected = [
  ["1", "STD-0001,STD-0002,STD-0003", "README.md", "STANDARDS-ROUTER.md", "exists", "pre-slice-review", "focused", "none"],
  ["2", "STD-0004,STD-0005,STD-0006", "README.md", "STANDARDS-ROUTER.md", "exists", "pre-slice-review", "focused", "none"],
]
[checks.projections.where]
field = "baseline_order"
op = "eq"
value = "35"
[[checks.projections]]
columns = ["ids"]
order = "lexical"
expected = [["STD-0001"], ["STD-0002"], ["STD-0003"], ["STD-0004"], ["STD-0005"], ["STD-0006"]]
[checks.projections.where]
field = "baseline_order"
op = "eq"
value = "35"
[checks.projections.split]
field = "ids"
delimiter = ","

[[checks]]
id = "owner-validation"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-row-35-owner-validation.tsv"
header = ["id", "owner", "disposition", "rationale"]
non_empty = ["id", "owner", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "owner", "disposition"]
order = "source"
expected = [
  ["STD-0001", "STANDARDS-ROUTER.md", "index"],
  ["STD-0002", "STANDARDS-ROUTER.md", "split"],
  ["STD-0003", "STANDARDS-ROUTER.md", "index"],
  ["STD-0004", "STANDARDS-ROUTER.md", "index"],
  ["STD-0005", "STANDARDS-ROUTER.md", "index"],
  ["STD-0006", "LICENSE", "index"],
]

[[checks]]
id = "decomposition-report"
type = "text"
path = "docs/plans/standards-library-effectiveness/reports/milestone-7-row-35-decomposition.md"
required = [
  "## Owner Contract",
  "sole authority",
  "## Exact Ownership",
  "`35.1`",
  "`35.2`",
  "## Bounded Write Sets",
  "## Typed Outcomes And No Fallback",
  "## Re-plan Triggers",
]
prohibited = []

[[checks]]
id = "execution-train"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-train.tsv"
header = ["order", "wave", "start_id", "end_id", "source", "owner", "owner_state", "activation", "checkpoint"]
[[checks.projections]]
columns = ["owner", "owner_state", "activation"]
order = "source"
expected = [["STANDARDS-ROUTER.md", "exists", "final-closure"]]
[checks.projections.where]
field = "order"
op = "eq"
value = "35"

[[checks]]
id = "accelerated-package-gate"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-accelerated-packages.tsv"
header = ["train_order", "package_id", "risk_class", "owner", "owner_action", "verification_family", "draft_mode", "integration_gate", "semantic_outcome", "prerequisites"]
[[checks.projections]]
columns = ["integration_gate"]
order = "source"
expected = [["full-suite"]]
[checks.projections.where]
field = "train_order"
op = "eq"
value = "35"
