schema_version = 1
id = "milestone-7-row-30-decomposition"
owner = "migration.parent-plan"
description = "Accepted Row 30 two-child Contracts decomposition with exact ownership, typed outcomes, plan lineage, and disposition coverage."

[[checks]]
id = "execution-decomposition"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
non_empty = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
unique = [["baseline_order", "child_order"]]
[[checks.projections]]
columns = ["ids"]
order = "lexical"
expected = [
  ["STD-0055"], ["STD-0056"], ["STD-0057"], ["STD-0058"],
  ["STD-0059"], ["STD-0060"], ["STD-0061"], ["STD-0062"],
]
[checks.projections.where]
field = "baseline_order"
op = "eq"
value = "30"
[checks.projections.split]
field = "ids"
delimiter = ","
[[checks.projections]]
columns = ["child_order"]
order = "source"
expected = [["1"], ["2"]]
[checks.projections.where]
field = "baseline_order"
op = "eq"
value = "30"

[[checks]]
id = "owner-validation"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-row-30-owner-validation.tsv"
header = ["id", "owner", "disposition", "rationale"]
non_empty = ["id", "owner", "disposition", "rationale"]
unique = [["id"]]
[checks.domains]
owner = ["topics/contracts.md"]
disposition = ["index", "refine"]
[[checks.projections]]
columns = ["id"]
order = "source"
expected = [
  ["STD-0055"], ["STD-0056"], ["STD-0057"], ["STD-0058"],
  ["STD-0059"], ["STD-0060"], ["STD-0061"], ["STD-0062"],
]
[[checks.projections]]
columns = ["disposition"]
order = "lexical"
expected = [["index"], ["index"], ["index"], ["refine"], ["refine"], ["refine"], ["refine"], ["refine"]]

[[checks]]
id = "decomposition-report"
type = "text"
path = "evaluation/standards-effectiveness/milestone-7-row-30-decomposition.md"
required = [
  "## Owner Contract",
  "sole normative owner",
  "## Exact Ownership",
  "`STD-0055` and `STD-0056`",
  "`30.1`",
  "`30.2`",
  "## Typed Outcomes And No Fallback",
  "## Re-plan Triggers",
]
prohibited = []

[[checks]]
id = "execution-train-owner"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-train.tsv"
header = ["order", "wave", "start_id", "end_id", "source", "owner", "owner_state", "activation", "checkpoint"]
non_empty = ["order", "wave", "start_id", "end_id", "source", "owner", "owner_state", "activation", "checkpoint"]
unique = [["order"]]
[[checks.projections]]
columns = ["owner"]
order = "source"
expected = [["topics/contracts.md"]]
[checks.projections.where]
field = "order"
op = "eq"
value = "30"

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id"]
order = "source"
expected = [
  ["STD-0055"], ["STD-0056"], ["STD-0057"], ["STD-0058"],
  ["STD-0059"], ["STD-0060"], ["STD-0061"], ["STD-0062"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0055", "STD-0056", "STD-0057", "STD-0058", "STD-0059", "STD-0060", "STD-0061", "STD-0062"]
