schema_version = 1
id = "cross-language-contract"
owner = "topic.contracts"
description = "Contract-class selection, canonical schema authority, coordinated consumer evidence, and typed no-fallback outcomes."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/contracts/cross-language-contract-decisions.tsv"
expected_column = "expected"
default = "typed-invalid"
[checks.domains]
case = ["*"]
contract_class = ["internal-coordinated", "persisted", "public-versioned", "distributed-independent", "generated"]
authority = ["selected", "missing", "ambiguous"]
deployment = ["atomic", "independent"]
producer_update = ["complete", "incomplete"]
consumer_update = ["complete", "incomplete"]
version = ["supported", "unsupported", "not-applicable"]
evidence = ["matched", "missing"]
fallback = ["none", "guess-schema", "old-shape", "dual-shape", "default"]
expected = ["allow", "typed-invalid", "typed-unsupported", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
field = "fallback"
op = "ne"
value = "none"
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
field = "authority"
op = "in"
values = ["missing", "ambiguous"]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
field = "version"
op = "eq"
value = "unsupported"
[[checks.rules]]
outcome = "allow"
[checks.rules.when]
all = [
  { field = "contract_class", op = "eq", value = "internal-coordinated" },
  { field = "authority", op = "eq", value = "selected" },
  { field = "deployment", op = "eq", value = "atomic" },
  { field = "producer_update", op = "eq", value = "complete" },
  { field = "consumer_update", op = "eq", value = "complete" },
  { field = "version", op = "eq", value = "not-applicable" },
  { field = "evidence", op = "eq", value = "matched" },
]
[[checks.rules]]
outcome = "allow"
[checks.rules.when]
all = [
  { field = "contract_class", op = "eq", value = "generated" },
  { field = "authority", op = "eq", value = "selected" },
  { field = "deployment", op = "eq", value = "atomic" },
  { field = "producer_update", op = "eq", value = "complete" },
  { field = "consumer_update", op = "eq", value = "complete" },
  { field = "version", op = "eq", value = "not-applicable" },
  { field = "evidence", op = "eq", value = "matched" },
]
[[checks.rules]]
outcome = "allow"
[checks.rules.when]
all = [
  { field = "contract_class", op = "eq", value = "persisted" },
  { field = "authority", op = "eq", value = "selected" },
  { field = "deployment", op = "eq", value = "independent" },
  { field = "producer_update", op = "eq", value = "complete" },
  { field = "consumer_update", op = "eq", value = "complete" },
  { field = "version", op = "eq", value = "supported" },
  { field = "evidence", op = "eq", value = "matched" },
]
[[checks.rules]]
outcome = "allow"
[checks.rules.when]
all = [
  { field = "contract_class", op = "eq", value = "public-versioned" },
  { field = "authority", op = "eq", value = "selected" },
  { field = "deployment", op = "eq", value = "independent" },
  { field = "producer_update", op = "eq", value = "complete" },
  { field = "consumer_update", op = "eq", value = "complete" },
  { field = "version", op = "eq", value = "supported" },
  { field = "evidence", op = "eq", value = "matched" },
]
[[checks.rules]]
outcome = "allow"
[checks.rules.when]
all = [
  { field = "contract_class", op = "eq", value = "distributed-independent" },
  { field = "authority", op = "eq", value = "selected" },
  { field = "deployment", op = "eq", value = "independent" },
  { field = "producer_update", op = "eq", value = "complete" },
  { field = "consumer_update", op = "eq", value = "complete" },
  { field = "version", op = "eq", value = "supported" },
  { field = "evidence", op = "eq", value = "matched" },
]

[[checks]]
id = "source-identities"
type = "table"
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
order = "source"
expected = [
  ["STD-0474", "INTEROP-STANDARDS.md", "109", "2", "topic", "refine", "Cross-Language Contract Maintenance"],
  ["STD-0475", "INTEROP-STANDARDS.md", "114", "3", "topic", "refine", "Rules"],
  ["STD-0477", "INTEROP-STANDARDS.md", "136", "2", "topic", "refine", "Serialization Format Alignment"],
  ["STD-0481", "INTEROP-STANDARDS.md", "160", "3", "topic", "refine", "Rules"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0474", "STD-0475", "STD-0477", "STD-0481"]

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [
  ["STD-0474", "INTEROP-STANDARDS.md", "topics/contracts.md", "refine", "select cross-language evolution from the applicable contract classes and deployment facts"],
  ["STD-0475", "INTEROP-STANDARDS.md", "topics/contracts.md", "refine", "require coordinated or independently deployed consumer updates without compatibility guessing"],
  ["STD-0477", "INTEROP-STANDARDS.md", "topics/contracts.md", "refine", "assign one canonical wire or schema authority instead of inferring representation"],
  ["STD-0481", "INTEROP-STANDARDS.md", "topics/contracts.md", "refine", "require contract-matched producer and consumer evidence with typed outcomes"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0474", "STD-0475", "STD-0477", "STD-0481"]

[[checks]]
id = "metadata-closure"
type = "metadata_graph"
paths = ["CORE-STANDARDS.md", "workflows/verification.md", "topics/contracts.md", "topics/contracts/schemas.md", "topics/contracts/protocols.md", "topics/contracts/evolution.md", "workflows/verification/oracles.md", "workflows/verification/platforms.md", "workflows/verification/gui.md", "topics/code-design.md"]

