schema_version = 1
id = "godot-owner-contract"
owner = "profile.framework.godot"
description = "Godot engine affinity, dispatch, completion, and point-of-use object lifetime without off-thread or validity fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/godot/owner-contract-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
affinity = ["main", "missing", "worker"]
dispatch = ["deferred", "direct", "dispatcher"]
completion = ["detached", "observed"]
lifetime = ["checked", "invalid", "missing", "owned", "referenced", "revalidated", "stale"]
check_timing = ["at-use", "before-await"]
evidence = ["complete", "missing", "unsupported"]
fallback = ["alternate-dispatch", "default-success", "none"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "completion", op = "eq", value = "detached" },
  { field = "lifetime", op = "eq", value = "invalid" },
  { field = "lifetime", op = "eq", value = "stale" },
  { field = "check_timing", op = "eq", value = "before-await" },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
all = [
  { field = "affinity", op = "eq", value = "worker" },
  { field = "dispatch", op = "eq", value = "direct" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "affinity", op = "eq", value = "missing" },
  { field = "lifetime", op = "eq", value = "missing" },
  { field = "evidence", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "evidence", op = "eq", value = "unsupported" }]

[[checks]]
id = "canonical-owner-projection"
type = "text"
path = "profiles/frameworks/godot.md"
required = [
  "ID: `profile.framework.godot`",
  "Specializes: `topic.concurrency`",
  "Establish Engine Affinity",
  "Prove Object Lifetime At Use",
  "`CallDeferred`",
  "`GodotObject.IsInstanceValid`",
  "check-to-use gap",
  "typed `invalid`, `unsupported`, or `unavailable`",
  "Do not continue with off-thread engine access",
]
prohibited = []

[[checks]]
id = "router-projection"
type = "text"
path = "STANDARDS-ROUTER.md"
required = ["Godot object, node, scene-tree, signal, resource, thread-affinity, deferred-dispatch, or object-lifetime mechanism changes"]
prohibited = []

[[checks]]
id = "legacy-projection"
type = "text"
path = "CONCURRENCY-STANDARDS.md"
required = ["## Godot Framework Index", "[Godot Framework Profile](profiles/frameworks/godot.md)"]
prohibited = [
  "## Godot Thread Safety",
  "### Main Thread Rule",
  "### `IsInstanceValid` Before Use",
  "Use `CallDeferred`",
  "Always check `GodotObject.IsInstanceValid(node)`",
]

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [
  ["STD-0277", "CONCURRENCY-STANDARDS.md", "CONCURRENCY-STANDARDS.md", "index", "convert the Godot thread-safety parent heading into a non-normative route to the canonical Godot framework profile"],
  ["STD-0278", "CONCURRENCY-STANDARDS.md", "profiles/frameworks/godot.md", "refine", "select Godot engine affinity and observable dispatch from the operation contract rather than requiring one main-thread mechanism"],
  ["STD-0279", "CONCURRENCY-STANDARDS.md", "profiles/frameworks/godot.md", "refine", "replace validity-check-only guidance with point-of-use object lifetime and identity proof across async and deferred boundaries"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0277", "STD-0278", "STD-0279"]

[[checks]]
id = "execution-overlay"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
[[checks.projections]]
columns = ["ids", "owner", "owner_state", "activation"]
order = "source"
expected = [["STD-0277,STD-0278,STD-0279", "profiles/frameworks/godot.md", "exists", "pre-slice-review"]]
[checks.projections.where]
all = [
  { field = "baseline_order", op = "eq", value = "13" },
  { field = "child_order", op = "eq", value = "4" },
]

[[checks]]
id = "documentation-projection"
type = "text"
path = "evaluation/standards-effectiveness/README.md"
required = ["the registered `godot-owner-contract` suite establish the Godot framework profile"]
prohibited = ["`verify-godot-owner-contract.sh` establish the Godot framework profile"]
