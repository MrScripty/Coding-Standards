schema_version = 1
id = "implementation-disabled-lifecycle"
owner = "workflow.implementation"
description = "Disabled, removed, and incomplete behavior lifecycle with complete surfaces and typed outcomes without production stubs, dummy data, silent no-ops, or substitute behavior."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/implementation/disabled-lifecycle-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
state = ["disabled", "incomplete", "invalid", "removed", "unsupported"]
owner = ["known", "missing"]
surfaces = ["complete", "missing"]
tracking = ["available", "missing", "not-required"]
exit_criteria = ["complete", "missing"]
review = ["available", "missing", "not-required"]
production_stub = ["dummy", "false-success", "no-op", "none", "registered", "substitute", "test-only"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
all = [
  { field = "production_stub", op = "ne", value = "none" },
  { field = "production_stub", op = "ne", value = "test-only" },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
all = [{ field = "state", op = "eq", value = "invalid" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "state", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "owner", op = "eq", value = "missing" },
  { field = "surfaces", op = "eq", value = "missing" },
  { field = "tracking", op = "eq", value = "missing" },
  { field = "exit_criteria", op = "eq", value = "missing" },
  { field = "review", op = "eq", value = "missing" },
]

[[checks]]
id = "owner"
type = "text"
path = "workflows/implementation.md"
required = ["## Disabled And Incomplete Behavior", "remove deliberately unsupported capability", "keep incomplete implementation unreachable", "must agree with the selected lifecycle state", "silent no-op", "typed `unavailable`, `unsupported`, or `invalid`"]
prohibited = []

[[checks]]
id = "legacy-and-route"
type = "text"
path = "CODING-STANDARDS.md"
required = ["workflows/implementation.md#disabled-and-incomplete-behavior"]
prohibited = ["Status: DISABLED", "GOOD: Do not register the route"]

[[checks]]
id = "dispositions"
type = "text"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
required = [
  "STD-0174\tCODING-STANDARDS.md\tCODING-STANDARDS.md\tindex\treplace the disabled-features parent with a non-normative route to canonical Implementation lifecycle authority",
  "STD-0175\tCODING-STANDARDS.md\tworkflows/implementation.md\trefine\trecord owner surfaces reason tracking re-enable or removal conditions and review trigger without a copied documentation template",
  "STD-0176\tCODING-STANDARDS.md\tworkflows/implementation.md\trefine\tkeep advertised registered and configured surfaces consistent with selected lifecycle state without one configuration-location prescription",
  "STD-0177\tCODING-STANDARDS.md\tworkflows/implementation.md\trefine\tkeep incomplete behavior unreachable from production and return typed outcomes without registered stubs dummy data silent no-ops or substitute fallback",
]
prohibited = []

[[checks]]
id = "accepted-plan"
type = "text"
path = "plans/standards-library-effectiveness-restructure-plan.md"
required = ["`7.4b8bl` (`Accepted`)", "`7.4b9s` (`Accepted`)"]
prohibited = []
