schema_version = 1
id = "implementation-disabled-lifecycle"
owner = "workflow.implementation"
description = "Disabled, removed, and incomplete behavior lifecycle with complete surfaces and typed outcomes without production stubs, dummy data, silent no-ops, or substitute behavior."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/implementation/disabled-lifecycle-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
state = ["disabled", "incomplete", "invalid", "removed", "unsupported"]
owner = ["known", "missing"]
surfaces = ["complete", "missing"]
tracking = ["available", "missing", "not-required"]
exit_criteria = ["complete", "missing"]
review = ["available", "missing", "not-required"]
production_stub = ["dummy", "false-success", "no-op", "none", "registered", "substitute", "test-only"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
all = [
  { field = "production_stub", op = "ne", value = "none" },
  { field = "production_stub", op = "ne", value = "test-only" },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
all = [{ field = "state", op = "eq", value = "invalid" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "state", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "owner", op = "eq", value = "missing" },
  { field = "surfaces", op = "eq", value = "missing" },
  { field = "tracking", op = "eq", value = "missing" },
  { field = "exit_criteria", op = "eq", value = "missing" },
  { field = "review", op = "eq", value = "missing" },
]


[[checks]]
id = "dispositions-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0174", "CODING-STANDARDS.md", "CODING-STANDARDS.md", "index"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0174"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0175", "CODING-STANDARDS.md", "workflows/implementation.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0175"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0176", "CODING-STANDARDS.md", "workflows/implementation.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0176"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0177", "CODING-STANDARDS.md", "workflows/implementation.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0177"}]}}]
