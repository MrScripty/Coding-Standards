schema_version = 1
id = "language-binding-boundary"
owner = "profile.boundary.language-bindings"
description = "Declared language-binding representation, typed conversion outcomes, exact source lineage, canonical routing, and no representation fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/language-bindings/representation-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
mechanism = ["framework", "serialized", "c-abi", "opaque", "generated", "unknown", "unavailable"]
representation = ["declared", "undeclared", "incompatible"]
schema = ["valid", "invalid", "unavailable", "not-required"]
conversion = ["valid", "rejected", "not-checked"]
generated_logic = ["absent", "present"]
expected = ["allow", "typed-invalid", "typed-unsupported", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
any = [
  { field = "mechanism", op = "eq", value = "unknown" },
  { field = "representation", op = "eq", value = "incompatible" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "mechanism", op = "eq", value = "unavailable" },
  { field = "schema", op = "eq", value = "unavailable" },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "representation", op = "ne", value = "declared" },
  { field = "schema", op = "eq", value = "invalid" },
  { field = "conversion", op = "ne", value = "valid" },
  { field = "generated_logic", op = "eq", value = "present" },
]

[[checks]]
id = "source-identities"
type = "table"
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "path", "level", "target_role", "disposition", "heading"]
order = "source"
expected = [
  ["STD-0483", "LANGUAGE-BINDINGS-STANDARDS.md", "1", "boundary-profile", "refine", "Language Bindings Standards"],
  ["STD-0484", "LANGUAGE-BINDINGS-STANDARDS.md", "2", "boundary-profile", "refine", "Core Principles"],
  ["STD-0485", "LANGUAGE-BINDINGS-STANDARDS.md", "2", "boundary-profile", "refine", "Layer Model"],
  ["STD-0486", "LANGUAGE-BINDINGS-STANDARDS.md", "2", "boundary-profile", "refine", "Language-Specific Extensions"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0483", "STD-0484", "STD-0485", "STD-0486"]

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [
  ["STD-0483", "LANGUAGE-BINDINGS-STANDARDS.md", "profiles/boundaries/language-bindings.md", "move", "establish the generic language-binding owner"],
  ["STD-0484", "LANGUAGE-BINDINGS-STANDARDS.md", "profiles/boundaries/language-bindings.md", "refine", "separate binding transport from ABI representation"],
  ["STD-0485", "LANGUAGE-BINDINGS-STANDARDS.md", "profiles/boundaries/language-bindings.md", "move", "preserve the thin adapter layer contract"],
  ["STD-0486", "LANGUAGE-BINDINGS-STANDARDS.md", "profiles/boundaries/language-bindings.md", "merge", "route concrete mechanisms to language specializations"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0483", "STD-0484", "STD-0485", "STD-0486"]

[[checks]]
id = "metadata-closure"
type = "metadata_graph"
paths = ["CORE-STANDARDS.md", "workflows/verification.md", "topics/contracts.md", "topics/security.md", "profiles/boundaries/interop.md", "profiles/boundaries/language-bindings.md", "topics/contracts/schemas.md", "topics/contracts/protocols.md", "topics/contracts/evolution.md", "workflows/verification/oracles.md", "workflows/verification/platforms.md", "workflows/verification/gui.md", "topics/code-design.md"]

[[checks]]
id = "canonical-profile"
type = "text"
path = "profiles/boundaries/language-bindings.md"
required = [
  "## Declare The Boundary Mechanism",
  "binding-framework lifting",
  "Stable ABI value",
  "Opaque handle",
  "Generated host wrapper",
  "Framework support does not imply stable memory layout",
  "Return:",
  "`invalid`",
  "`unsupported`",
  "`unavailable`",
  "## No Fallback",
  "Framework support does not imply",
  "reinterpret",
  "lossy or schema-free",
]
prohibited = []

[[checks]]
id = "router-route"
type = "text"
path = "STANDARDS-ROUTER.md"
required = ["profiles/boundaries/language-bindings.md"]
prohibited = []

[[checks]]
id = "legacy-route"
type = "text"
path = "LANGUAGE-BINDINGS-STANDARDS.md"
required = ["profiles/boundaries/language-bindings.md"]
prohibited = [
  "\n## ",
  "```",
  "FFI-safe DTOs",
  "Multiple binding frameworks",
  "Language-Specific Extensions",
]

[[checks]]
id = "documentation-projection"
type = "text"
path = "evaluation/standards-effectiveness/verification-guide.md"
required = ["registered `language-binding-boundary` suite"]
prohibited = ["verify-language-binding-boundary.sh"]
