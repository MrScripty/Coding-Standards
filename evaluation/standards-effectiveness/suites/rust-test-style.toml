schema_version = 1
id = "rust-test-style"
owner = "workflow.verification"
description = "Contract-selected test design, data, placement, naming, discovery, context, evidence, and Rust examples."

[[checks]]
id = "test-style-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/test-style-decisions.tsv"
expected_column = "expected"
default = "allow"

[checks.domains]
case = ["*"]
claim = ["accepted", "missing", "contradictory"]
ownership = ["known", "missing"]
discovery = ["known", "missing"]
context = ["known", "missing"]
fallback = ["none", "naming-template", "colocation", "tests-directory", "benches-directory", "builder", "fixture-helper", "issue", "invariant", "production-symptom", "documentation"]
expected = ["allow", "typed-invalid", "typed-unavailable"]

[[checks.rules]]
outcome = "typed-invalid"

[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "claim", op = "eq", value = "contradictory" },
]

[[checks.rules]]
outcome = "typed-unavailable"

[checks.rules.when]
any = [
  { field = "claim", op = "eq", value = "missing" },
  { field = "ownership", op = "eq", value = "missing" },
  { field = "discovery", op = "eq", value = "missing" },
  { field = "context", op = "eq", value = "missing" },
]


[[checks]]
id = "exact-disposition-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0839", "languages/rust/RUST-TOOLING-STANDARDS.md", "workflows/verification.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0839"}]}}]
