schema_version = 1
id = "architecture-data-authority-pattern"
owner = "reference.patterns.architecture"
description = "Contract-selected data-authority illustration with typed no-location-fallback outcomes and exact legacy lineage."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/architecture/data-authority-pattern-decisions.tsv"
expected_column = "expected"
default = "illustrate-confirmed"
[checks.domains]
case = ["*"]
authority = ["contradictory", "frontend", "missing", "server"]
projection = ["complete", "missing", "optimistic"]
synchronization = ["complete", "missing"]
reconciliation = ["complete", "missing"]
fallback = ["backend-location", "disable-optimistic", "none"]
expected = ["illustrate-confirmed", "illustrate-optimistic", "pattern-not-applicable", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "authority", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "authority", op = "eq", value = "missing" },
  { field = "projection", op = "eq", value = "missing" },
  { field = "synchronization", op = "eq", value = "missing" },
  { field = "reconciliation", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "pattern-not-applicable"
[checks.rules.when]
field = "authority"
op = "ne"
value = "server"
[[checks.rules]]
outcome = "illustrate-optimistic"
[checks.rules.when]
field = "projection"
op = "eq"
value = "optimistic"

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id"]
order = "source"
expected = [["STD-0040"], ["STD-0041"], ["STD-0042"], ["STD-0043"], ["STD-0044"], ["STD-0045"]]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0040", "STD-0041", "STD-0042", "STD-0043", "STD-0044", "STD-0045"]

[[checks]]
id = "owner-lineage"
type = "keyed_relation"
[checks.keys]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
columns = ["id"]
order = "source"
where = { field = "id", op = "in", values = ["STD-0040", "STD-0041", "STD-0042", "STD-0043", "STD-0044", "STD-0045"] }
[checks.expected]
path = "evaluation/standards-effectiveness/milestone-7-row-36-owner-validation.tsv"
header = ["id", "canonical_owner", "disposition", "reference_treatment", "rationale"]
key = "id"
values = ["canonical_owner", "disposition"]
[checks.observed]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
key = "id"
values = ["target", "disposition"]
