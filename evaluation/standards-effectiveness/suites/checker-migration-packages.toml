schema_version = 1
id = "checker-migration-packages"
owner = "verification-engine.migration-packages"
description = "Reviewed migration-package authority without graph-derived semantic defaults or unbounded write sets."

[[checks]]
id = "admitted-packages"
type = "table"
path = "evaluation/standards-effectiveness/checker-migration-packages.tsv"
header = ["train_order", "package_id", "components", "owner", "risk", "semantic_outcome", "write_set", "prerequisites", "verification", "state"]
row_count = 1
non_empty = ["train_order", "package_id", "components", "owner", "risk", "semantic_outcome", "write_set", "prerequisites", "verification", "state"]
unique = [["train_order"], ["package_id"], ["components"]]

[checks.domains]
risk = ["mechanical", "consolidation", "refinement", "safety-critical", "new-owner-design"]
