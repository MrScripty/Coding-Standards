schema_version = 1
id = "checker-migration-packages"
owner = "verification-engine.migration-packages"
description = "Structurally valid reviewed migration-package authority without copied package rows, graph-derived semantic defaults, or unbounded write sets."

[[checks]]
id = "admitted-packages"
type = "table"
path = "evaluation/standards-effectiveness/checker-migration-packages.tsv"
header = ["train_order", "package_id", "subject", "owner", "risk", "semantic_outcome", "write_set", "prerequisites", "verification", "state"]
non_empty = ["train_order", "package_id", "subject", "owner", "risk", "semantic_outcome", "write_set", "prerequisites", "verification", "state"]
unique = [["train_order"], ["package_id"], ["subject"]]

[checks.domains]
risk = ["mechanical", "consolidation", "refinement", "safety-critical", "new-owner-design"]
state = ["admitted", "accepted", "blocked"]

[[checks]]
id = "migration-python-terminal-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/migration-python-dispositions.tsv"
header = ["subject_kind", "subject", "path", "disposition", "current_consumer", "post_zero_consumer", "terminal_trigger", "evidence_owner", "rationale"]
non_empty = ["subject_kind", "subject", "path", "disposition", "current_consumer", "post_zero_consumer", "terminal_trigger", "evidence_owner", "rationale"]
unique = [["subject_kind", "subject"]]

[checks.domains]
subject_kind = ["module", "launcher", "check-kind", "integration-hook", "execution-mode", "suite", "registry-entry", "test", "artifact", "generated-artifact", "documentation"]
disposition = ["retain", "replace", "delete"]
post_zero_consumer = ["none", "verification-engine.python-only-complete"]
terminal_trigger = ["zero-bash-accepted"]
evidence_owner = ["verification-engine.zero-bash-acceptance"]

[[checks]]
id = "migration-python-candidate-completeness"
type = "migration_python_dispositions"
path = "evaluation/standards-effectiveness/migration-python-dispositions.tsv"
package_path = "tools/standards_verifier/standards_verifier"
terminal_trigger = "zero-bash-accepted"
