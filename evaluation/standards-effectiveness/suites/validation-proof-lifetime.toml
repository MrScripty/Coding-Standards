schema_version = 1
id = "validation-proof-lifetime"
owner = "topic.contracts"
description = "Proof-bearing validation authority across mutation, contract changes, and trust, process, persistence, plugin, and queue boundaries."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/contracts/validation-proof-lifetime-decisions.tsv"
expected_column = "expected"
default = "typed-invalid"
[checks.domains]
case = ["*"]
representation = ["validated", "smart", "lost", "unknown"]
contract = ["current", "changed", "unsupported"]
mutation = ["none", "unchecked"]
boundary = ["same", "new"]
proof = ["retained", "missing", "invalidated", "not-applicable", "history", "stale"]
capability = ["available", "missing"]
fallback = ["none", "original-input", "history-flag", "stale-proof", "mutable-alias", "implicit-trust", "permissive-default", "weaker-decoder", "redundant-decode"]
expected = ["allow", "require-proof", "typed-invalid", "typed-unsupported", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
field = "fallback"
op = "ne"
value = "none"
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
field = "capability"
op = "eq"
value = "missing"
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
field = "contract"
op = "eq"
value = "unsupported"
[[checks.rules]]
outcome = "allow"
[checks.rules.when]
all = [
  { field = "representation", op = "in", values = ["validated", "smart"] },
  { field = "contract", op = "eq", value = "current" },
  { field = "mutation", op = "eq", value = "none" },
  { field = "boundary", op = "eq", value = "same" },
  { field = "proof", op = "eq", value = "retained" },
]
[[checks.rules]]
outcome = "require-proof"
[checks.rules.when]
any = [
  { field = "representation", op = "eq", value = "lost" },
  { field = "mutation", op = "eq", value = "unchecked" },
  { field = "contract", op = "eq", value = "changed" },
  { field = "boundary", op = "eq", value = "new" },
]

[[checks]]
id = "source-identities"
type = "table"
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "path"]
order = "source"
expected = [
  ["STD-0583", "SECURITY-STANDARDS.md"],
  ["STD-0601", "SECURITY-STANDARDS.md"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0583", "STD-0601"]

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [
  ["STD-0583", "SECURITY-STANDARDS.md", "topics/contracts.md", "refine", "define validation authority through a retained proof-bearing representation and complete applicable contract"],
  ["STD-0601", "SECURITY-STANDARDS.md", "topics/contracts.md", "refine", "require new proof after invalidation or a new applicable boundary without redundant decoding of an intact validated representation"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0583", "STD-0601"]

[[checks]]
id = "metadata-closure"
type = "metadata_graph"
paths = ["CORE-STANDARDS.md", "workflows/verification.md", "topics/contracts.md", "topics/contracts/schemas.md", "topics/contracts/protocols.md", "topics/contracts/evolution.md", "workflows/verification/oracles.md", "workflows/verification/platforms.md", "workflows/verification/gui.md", "topics/code-design.md"]

[[checks]]
id = "contract-policy"
type = "markdown_section_text"
path = "topics/contracts.md"
heading = "## Validation Proof Lifetime"
required = [
  "proof-bearing representation",
  "unchecked alias",
  "new trust, process, persistence, plugin, queue",
  "does not carry forward",
  "boolean validation flag",
  "typed `unavailable`",
  "redundant validation",
]
prohibited = []

[[checks]]
id = "legacy-route"
type = "text"
path = "SECURITY-STANDARDS.md"
required = ["topics/contracts.md#validation-proof-lifetime"]
prohibited = ["External Input", "Trust internally", "ProcessFile"]

[[checks]]
id = "finding-closure"
type = "text"
path = "docs/plans/standards-library-effectiveness/issues.md"
required = ["| F053 | Resolved in Milestone 7.4b7m |"]
prohibited = []

[[checks]]
id = "documentation-projection"
type = "text"
path = "evaluation/standards-effectiveness/verification-guide.md"
required = ["The registered `validation-proof-lifetime` suite checks retained validated"]
prohibited = ["`verify-validation-proof-lifetime.sh` check retained validated"]
