schema_version = 1
id = "typescript-async-owner-contract"
owner = "profile.language.typescript.async"
description = "TypeScript async invocation authority and completion classification without process-global, stale-result, cancellation, or success fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/typescript/async-owner-contract-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
overlap = ["yes", "no"]
authority = ["abort-signal", "missing", "not-required", "process-global", "scoped-generation", "serialized"]
cancellation = ["ignored", "not-required", "propagated"]
completion = ["cancelled", "discarded", "observed", "superseded"]
application = ["current", "stale", "suppressed"]
capability = ["missing", "supported", "unsupported"]
evidence = ["complete", "missing"]
fallback = ["alternate-mechanism", "default-success", "none"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "authority", op = "eq", value = "process-global" },
  { field = "application", op = "eq", value = "stale" },
  { field = "completion", op = "eq", value = "discarded" },
  { field = "cancellation", op = "eq", value = "ignored" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "authority", op = "eq", value = "missing" },
  { field = "capability", op = "eq", value = "missing" },
  { field = "evidence", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [
  ["STD-0275", "CONCURRENCY-STANDARDS.md", "CONCURRENCY-STANDARDS.md", "index", "convert the TypeScript concurrency parent heading into a non-normative route to the canonical TypeScript Async profile"],
  ["STD-0276", "CONCURRENCY-STANDARDS.md", "profiles/languages/typescript/async.md", "refine", "replace the global request counter and silent stale-result discard recipe with scoped invocation authority and explicit terminal classification"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0275", "STD-0276"]

[[checks]]
id = "execution-overlay"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
[[checks.projections]]
columns = ["ids", "owner", "owner_state", "activation"]
order = "source"
expected = [["STD-0275,STD-0276", "profiles/languages/typescript/async.md", "exists", "pre-slice-review"]]
[checks.projections.where]
all = [
  { field = "baseline_order", op = "eq", value = "13" },
  { field = "child_order", op = "eq", value = "3" },
]
