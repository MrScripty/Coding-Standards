schema_version = 1
id = "contract-http-adapter-proof"
owner = "topic.contracts"
description = "Protocol adapter proof with typed outcomes, bounded legacy index closure, and row-derived disposition authority."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/contracts/http-adapter-proof-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
scope = ["selected", "unselected"]
direction = ["consumer", "missing", "none", "producer", "unsupported"]
authority = ["missing", "present"]
protocol = ["missing", "supported", "unsupported"]
projection = ["missing", "selected", "unsupported"]
response = ["consistent", "contradictory", "missing", "unsupported"]
disclosure = ["missing", "safe", "unsafe"]
proof = ["complete", "incomplete", "missing"]
claim = ["false", "matched", "none"]
fallback = ["alternate-decoder", "body-only", "default-500", "duplicate-response", "generic-error", "none", "partial-response", "raw-message", "recover", "retry", "shared-type-default", "status-only", "transport-success"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "response", op = "eq", value = "contradictory" },
  { field = "disclosure", op = "eq", value = "unsafe" },
  { field = "proof", op = "eq", value = "incomplete" },
  { field = "claim", op = "eq", value = "false" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
any = [
  { field = "direction", op = "eq", value = "unsupported" },
  { field = "protocol", op = "eq", value = "unsupported" },
  { field = "projection", op = "eq", value = "unsupported" },
  { field = "response", op = "eq", value = "unsupported" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
all = [
  { field = "scope", op = "eq", value = "selected" },
  { any = [
    { field = "direction", op = "eq", value = "missing" },
    { field = "authority", op = "eq", value = "missing" },
    { field = "protocol", op = "eq", value = "missing" },
    { field = "projection", op = "eq", value = "missing" },
    { field = "response", op = "eq", value = "missing" },
    { field = "disclosure", op = "eq", value = "missing" },
    { field = "proof", op = "eq", value = "missing" },
  ] },
]

[[checks]]
id = "canonical-policy"
type = "text"
path = "topics/contracts.md"
required = [
  "## Protocol Adapter Proof",
  "producer adapter accepts an already authoritative operation outcome",
  "consumer adapter treats the received response as unknown",
  "neither status nor body alone proves the outcome",
  "application error through successful HTTP transport",
  "Adapters do not select disclosure",
  "Do not substitute a generic error",
]
prohibited = []

[[checks]]
id = "mechanism-reference"
type = "text"
path = "reference/recipes/http.md"
required = [
  "## Illustrative Producer Adapter",
  "## Illustrative Consumer Adapter",
  "## Selected HTTP Success And Error Representations",
  "Neither example is universally good or bad",
  "## Conditional Interpretation Claims",
  "claims, not automatic benefits",
]
prohibited = []

[[checks]]
id = "legacy-section"
type = "markdown_section_text"
path = "ARCHITECTURE-PATTERNS.md"
heading = "## HTTP API Error Convention"
required = [
  "[Protocol Outcome Projection]",
  "[Protocol Adapter Proof]",
  "[HTTP Projection Mechanism Recipes]",
  "This is a migration index",
]
prohibited = [
  "### Server Implementation",
  "### Client Implementation",
  "### Anti-Pattern",
  "### Benefits",
  "ApiError:",
  "Clients must check",
  "// BAD:",
  "Uniform error handling",
]

[[checks]]
id = "disposition-lineage"
type = "keyed_relation"
[checks.keys]
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
columns = ["ids"]
order = "source"
where = { all = [{ field = "baseline_order", op = "eq", value = "33" }, { field = "child_order", op = "eq", value = "2" }] }
split = { field = "ids", delimiter = "," }
[checks.expected]
path = "evaluation/standards-effectiveness/milestone-7-row-33-owner-validation.tsv"
header = ["id", "owner", "disposition", "rationale"]
key = "id"
values = ["owner", "disposition"]
[checks.observed]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
key = "id"
values = ["target", "disposition"]
