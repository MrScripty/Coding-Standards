schema_version = 1
id = "errexit-zero-accumulation"
owner = "migration.parent-plan"
description = "Errexit-safe zero accumulation in the independently owned trust-replan verifier."

[[checks]]
id = "protected-target"
type = "table"
path = "evaluation/standards-effectiveness/fixtures/planning/errexit-zero-accumulation.tsv"
header = ["checker_path", "accumulator", "addend"]
unique = [["checker_path", "accumulator", "addend"]]
[[checks.projections]]
columns = ["checker_path", "accumulator", "addend"]
order = "source"
expected = [["evaluation/standards-effectiveness/verify-milestone-7-independent-trust-replan.sh", "current_trust_total", "expected_count"]]

[[checks]]
id = "safe-mechanism"
type = "text"
path = "evaluation/standards-effectiveness/verify-milestone-7-independent-trust-replan.sh"
required = ["current_trust_total=$((current_trust_total + expected_count))"]
prohibited = ["((current_trust_total += expected_count))"]
