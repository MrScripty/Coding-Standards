schema_version = 1
id = "frontend-applicability"
owner = "profile.application.frontend"
description = "Frontend applicability from changed UI responsibility and evidence without product, directory, or host-container fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/frontend/applicability-decisions.tsv"
expected_column = "expected"
default = "apply"
[checks.domains]
case = ["*"]
ui_change = ["no", "yes"]
projection = ["contradictory", "missing", "none", "selected"]
interaction = ["none", "selected"]
state = ["missing", "none", "selected"]
evidence = ["none", "selected"]
platform = ["browser", "desktop-shell", "embedded", "native", "server", "unknown", "unsupported"]
facts = ["complete", "missing"]
fallback = ["browser-name", "copied-profile", "directory", "electron-name", "none", "owner-takeover", "tauri-name", "webview-name"]
expected = ["apply", "not-applicable", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "projection", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "platform", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
all = [{ field = "ui_change", op = "eq", value = "yes" }, { any = [{ field = "facts", op = "eq", value = "missing" }, { field = "projection", op = "eq", value = "missing" }, { field = "state", op = "eq", value = "missing" }] }]
[[checks.rules]]
outcome = "not-applicable"
[checks.rules.when]
all = [{ field = "ui_change", op = "eq", value = "no" }]

[[checks]]
id = "disposition-lineage"
type = "keyed_relation"
[checks.keys]
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
columns = ["ids"]
order = "source"
where = { all = [{ field = "baseline_order", op = "eq", value = "34" }, { field = "child_order", op = "eq", value = "1" }] }
split = { field = "ids", delimiter = "," }
[checks.expected]
path = "evaluation/standards-effectiveness/milestone-7-row-34-owner-validation.tsv"
header = ["id", "owner", "disposition", "rationale"]
key = "id"
values = ["owner", "disposition"]
[checks.observed]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
key = "id"
values = ["target", "disposition"]
