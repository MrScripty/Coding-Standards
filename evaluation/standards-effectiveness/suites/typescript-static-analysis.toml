schema_version = 1
id = "typescript-static-analysis"
owner = "profile.language.typescript"
description = "TypeScript static-analysis mechanisms selected from project facts and authority."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/typescript/static-analysis-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
facts = ["complete", "contradictory"]
context = ["required-contract", "new-owned-code"]
authority = ["explicit", "missing"]
capability = ["supported", "unsupported"]
boundary = ["complete", "missing"]
fallback = ["broaden-scope", "custom-rule", "eslint-9", "none", "strict-flags", "strict-preset"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ all = [{ field = "fallback", op = "ne", value = "none" }, { any = [{ field = "context", op = "eq", value = "required-contract" }, { field = "fallback", op = "ne", value = "strict-preset" }] }] }, { field = "facts", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "authority", op = "eq", value = "missing" }, { field = "boundary", op = "eq", value = "missing" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]


[[checks]]
id = "disposition-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0677", "TOOLING-STANDARDS.md", "profiles/languages/typescript.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0677"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0678", "TOOLING-STANDARDS.md", "profiles/languages/typescript.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0678"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0679", "TOOLING-STANDARDS.md", "profiles/languages/typescript.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0679"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0680", "TOOLING-STANDARDS.md", "profiles/languages/typescript.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0680"}]}}]
