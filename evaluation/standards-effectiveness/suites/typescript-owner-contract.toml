schema_version = 1
id = "typescript-owner-contract"
owner = "profile.language.typescript"
description = "TypeScript public surfaces, runtime boundaries, contract projection, and static analysis without blanket annotation, primitive, any, assertion, copied-shape, or alternate-generator fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/typescript/owner-contract-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
surface = ["boundary", "local", "public"]
authority = ["contradictory", "missing", "owned", "schema"]
runtime_input = ["not-applicable", "unsupported", "untrusted"]
projection = ["any", "assertion", "copied", "decoded", "explicit", "generated", "inferred", "missing", "primitive", "wrapper"]
evidence = ["missing", "proved"]
fallback = ["alternate-generator", "any", "assertion", "blanket-domain", "blanket-explicit", "copied-shape", "none"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "authority", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "runtime_input", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "authority", op = "eq", value = "missing" },
  { field = "projection", op = "eq", value = "missing" },
  { field = "evidence", op = "eq", value = "missing" },
]


[[checks]]
id = "dispositions-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0184", "CODING-STANDARDS.md", "CODING-STANDARDS.md", "index"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0184"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0185", "CODING-STANDARDS.md", "profiles/languages/typescript.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0185"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0186", "CODING-STANDARDS.md", "profiles/languages/typescript.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0186"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0677", "TOOLING-STANDARDS.md", "profiles/languages/typescript.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0677"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0678", "TOOLING-STANDARDS.md", "profiles/languages/typescript.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0678"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0679", "TOOLING-STANDARDS.md", "profiles/languages/typescript.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0679"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0680", "TOOLING-STANDARDS.md", "profiles/languages/typescript.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0680"}]}}]
