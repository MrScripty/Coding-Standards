schema_version = 1
id = "rust-dependency-audit-adapters"
owner = "profile.language.rust.dependencies"
description = "Supported Rust dependency-audit adapters selected by an accepted audit contract."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/dependency-audit-adapter-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
contract = ["accepted", "contradictory", "missing"]
tooling = ["accepted", "missing"]
finding_owner = ["known", "unknown"]
capability = ["supported", "unsupported"]
evidence = ["complete", "incomplete"]
fallback = ["empty-result", "nightly", "none", "product"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "contract", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "contract", op = "eq", value = "missing" }, { field = "tooling", op = "eq", value = "missing" }, { field = "finding_owner", op = "eq", value = "unknown" }, { field = "evidence", op = "eq", value = "incomplete" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]


[[checks]]
id = "disposition-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0747", "languages/rust/RUST-DEPENDENCY-STANDARDS.md", "profiles/languages/rust/dependencies.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0747"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0748", "languages/rust/RUST-DEPENDENCY-STANDARDS.md", "reference/recipes/rust-dependencies.md", "move"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0748"}]}}]
