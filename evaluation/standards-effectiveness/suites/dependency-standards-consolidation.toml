schema_version = 1
id = "dependency-standards-consolidation"
owner = "topic.dependencies"
description = "Dependency standards consolidation under canonical requirement and lifecycle authority without count, tool, resolver, or legacy fallback defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/dependencies/standards-consolidation-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
requirement = ["complete", "contradictory", "missing"]
ownership = ["contradictory", "owned", "unknown"]
candidate = ["not-applicable", "supported", "unsupported"]
compatibility = ["missing", "proved"]
footprint = ["accepted", "measured"]
audit = ["complete", "missing", "tool-only"]
automation = ["ambient", "declared", "fixed-ci", "manual"]
fallback = ["ambient-tool", "fixed-schedule", "line-count", "lockfile-default", "none", "resolver-default", "standard-library", "tool-proof", "transitive-count"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "requirement", op = "eq", value = "contradictory" },
  { field = "ownership", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "candidate", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "requirement", op = "eq", value = "missing" },
  { field = "ownership", op = "eq", value = "unknown" },
  { field = "compatibility", op = "eq", value = "missing" },
  { field = "audit", op = "eq", value = "missing" },
]

[[checks]]
id = "exact-source-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id"]
order = "source"
expected = [
  ["STD-0300"], ["STD-0301"], ["STD-0302"], ["STD-0303"], ["STD-0304"],
  ["STD-0305"], ["STD-0306"], ["STD-0307"], ["STD-0308"], ["STD-0309"],
  ["STD-0310"], ["STD-0311"], ["STD-0312"], ["STD-0313"], ["STD-0314"],
  ["STD-0315"], ["STD-0316"], ["STD-0317"], ["STD-0318"], ["STD-0319"],
  ["STD-0320"], ["STD-0321"], ["STD-0322"], ["STD-0323"], ["STD-0324"],
  ["STD-0325"], ["STD-0326"], ["STD-0327"], ["STD-0328"], ["STD-0329"],
  ["STD-0330"], ["STD-0331"], ["STD-0332"], ["STD-0333"], ["STD-0334"],
  ["STD-0335"], ["STD-0336"], ["STD-0337"], ["STD-0338"], ["STD-0339"],
  ["STD-0340"], ["STD-0341"], ["STD-0342"], ["STD-0343"], ["STD-0344"],
  ["STD-0345"], ["STD-0346"], ["STD-0347"], ["STD-0348"],
]
[checks.projections.where]
field = "source"
op = "eq"
value = "DEPENDENCY-STANDARDS.md"
