schema_version = 1
id = "verification-ownership"
owner = "workflow.verification"
description = "Checks declared Markdown destinations. Does not certify prose quality, consumer compliance, or unexecuted runtime behavior."

[[checks]]
id = "canonical-workflow-sections-destinations"
type = "markdown_targets"
path = "workflows/verification.md"
required = ["workflows/implementation.md", "workflows/verification/gui.md", "workflows/verification/oracles.md", "workflows/verification/platforms.md"]

[[checks]]
id = "testing-route-and-legacy-removal-destinations"
type = "markdown_targets"
path = "TESTING-STANDARDS.md"
required = ["STANDARDS-ROUTER.md", "profiles/applications/frontend.md", "profiles/boundaries/language-bindings.md", "topics/concurrency.md", "topics/contracts.md", "topics/performance.md", "topics/resilience.md", "workflows/verification.md"]

[[checks]]
id = "tooling-route-and-legacy-removal-destinations"
type = "markdown_targets"
path = "TOOLING-STANDARDS.md"
required = ["profiles/applications/frontend.md", "profiles/languages/typescript.md", "reference/recipes/documentation.md", "reference/recipes/implementation.md", "reference/recipes/tooling.md", "topics/dependencies.md", "workflows/commit.md", "workflows/documentation.md", "workflows/implementation.md", "workflows/tooling.md", "workflows/verification.md"]

[[checks]]
id = "launcher-route-destinations"
type = "markdown_targets"
path = "LAUNCHER-STANDARDS.md"
required = ["profiles/applications/launcher.md", "topics/dependencies.md", "topics/security.md", "workflows/release.md", "workflows/verification.md"]

[[checks]]
id = "release-route-destinations"
type = "markdown_targets"
path = "RELEASE-STANDARDS.md"
required = ["reference/recipes/releases.md", "workflows/release.md"]

[[checks]]
id = "release-workflow-boundary-destinations"
type = "markdown_targets"
path = "workflows/release.md"
required = ["STANDARDS-ROUTER.md", "reference/recipes/releases.md", "topics/contracts.md", "topics/cross-platform.md", "workflows/release/operations.md", "workflows/verification.md"]
