schema_version = 1
id = "tooling-debt-cost"
owner = "workflow.tooling"
description = "Tool-debt and automation-cost governance without snapshot, cache, or schedule defaults."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/tooling/debt-cost-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
facts = ["complete", "contradictory"]
authority = ["explicit", "missing"]
capability = ["supported", "unsupported"]
scope = ["complete", "missing"]
fallback = ["cache", "cancel", "discard", "none", "path-filter", "snapshot", "stale-state", "timeout", "total-count", "upload", "zero-debt"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "facts", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "authority", op = "eq", value = "missing" }, { field = "scope", op = "eq", value = "missing" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]


[[checks]]
id = "disposition-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0691", "TOOLING-STANDARDS.md", "workflows/tooling.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0691"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0692", "TOOLING-STANDARDS.md", "workflows/tooling.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0692"}]}}]
