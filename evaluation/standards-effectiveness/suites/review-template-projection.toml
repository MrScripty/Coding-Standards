schema_version = 1
id = "review-template-projection"
owner = "workflow.implementation"
description = "Conditional Implementation-derived review evidence projection without fixed questionnaire, checklist, or provider fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/implementation/review-template-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
summary = ["no", "yes"]
selection = ["all", "material", "none"]
verification = ["no", "yes"]
conditional = ["no", "yes"]
copied = ["no", "yes"]
checklist = ["no", "yes"]
fallback = ["complete-template", "github", "none"]
expected = ["allow", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "conditional", op = "ne", value = "yes" }, { field = "copied", op = "ne", value = "no" }, { field = "checklist", op = "ne", value = "no" }, { field = "selection", op = "eq", value = "all" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "summary", op = "ne", value = "yes" }, { field = "verification", op = "ne", value = "yes" }]

[[checks]]
id = "disposition-lineage"
type = "keyed_relation"
[checks.keys]
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
columns = ["ids"]
order = "source"
where = { field = "baseline_order", op = "eq", value = "27" }
split = { field = "ids", delimiter = "," }
[checks.expected]
path = "evaluation/standards-effectiveness/milestone-7-row-27-owner-validation.tsv"
header = ["id", "owner", "disposition", "rationale"]
key = "id"
values = ["owner", "disposition"]
[checks.observed]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
key = "id"
values = ["target", "disposition"]
