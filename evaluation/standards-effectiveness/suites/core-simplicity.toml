schema_version = 1
id = "core-simplicity"
owner = "core.simplicity-and-complection"
description = "Core simplicity definitions and Architecture-owned composed-design admission without ease, reliability, or cardinality proxies."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/core/simplicity-decisions.tsv"
expected_column = "expected"
default = "simple"
[checks.domains]
case = ["*"]
artifact_coupling = ["braided", "contained", "independent", "unknown"]
caller_knowledge = ["owned-only", "unrelated", "unknown"]
composition_root = ["bounded", "cross-owner", "not-applicable", "unknown"]
change_locality = ["forced-broad", "local", "unknown"]
interface_depth = ["deep", "not-applicable", "shallow", "unknown"]
independent_evolution = ["no", "not-applicable", "unknown", "yes"]
deletion_result = ["essential", "incidental", "not-applicable", "unknown"]
generality_basis = ["contract-or-invariant", "hypothetical-as-permanent-basis", "none", "probe-only-no-permanent-seam", "real-variants", "unknown"]
authoring_ease = ["familiar", "neutral", "unfamiliar"]
reliability_evidence = ["covered", "neutral", "uncovered"]
metric_role = ["count-as-verdict", "diagnostic-count", "none"]
expected = ["complected", "simple", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "metric_role", op = "eq", value = "count-as-verdict" },
  { field = "generality_basis", op = "eq", value = "hypothetical-as-permanent-basis" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "artifact_coupling", op = "eq", value = "unknown" },
  { field = "caller_knowledge", op = "eq", value = "unknown" },
  { field = "composition_root", op = "eq", value = "unknown" },
  { field = "change_locality", op = "eq", value = "unknown" },
  { field = "interface_depth", op = "eq", value = "unknown" },
  { field = "independent_evolution", op = "eq", value = "unknown" },
  { field = "deletion_result", op = "eq", value = "unknown" },
  { field = "generality_basis", op = "eq", value = "unknown" },
]
[[checks.rules]]
outcome = "complected"
[checks.rules.when]
any = [
  { field = "artifact_coupling", op = "eq", value = "braided" },
  { field = "caller_knowledge", op = "eq", value = "unrelated" },
  { field = "composition_root", op = "eq", value = "cross-owner" },
  { field = "change_locality", op = "eq", value = "forced-broad" },
  { field = "interface_depth", op = "eq", value = "shallow" },
  { field = "independent_evolution", op = "eq", value = "no" },
  { field = "deletion_result", op = "eq", value = "incidental" },
]

[[checks]]
id = "owner"
type = "text"
path = "CORE-STANDARDS.md"
required = [
  "### Simple, Easy, And Complection",
  "**simple** describes an artifact whose distinct concerns\nare not interleaved",
  "**Easy** describes an approach that is familiar",
  "To **compose** is only to place concerns together",
  "Simplicity evidence asks whether independent concerns can be understood and\nchanged independently",
  "Counts may locate accumulated cost but cannot decide simplicity",
]
prohibited = ["composition root", "Tests, types, schemas"]

[[checks]]
id = "architecture-owner"
type = "text"
path = "topics/architecture.md"
required = [
  "## Composed Design Admission",
  "everything callers, peer Modules, and the composition root must know",
  "representative changes and every owner each change is semantically forced",
  "A useful Module has Depth",
  "Use the deletion test",
  "A hypothetical Adapter may probe the shape of a possible Seam",
  "File, type,\nModule, dependency, or test counts are diagnostic inputs, never the verdict",
]
prohibited = []

[[checks]]
id = "workflow-projections"
type = "text"
path = "workflows/implementation.md"
required = ["## Composed-Design Fidelity", "contradicts the recorded admission", "Stop and re-plan"]
prohibited = ["another Adapter, registry, validator"]

[[checks]]
id = "planning-projection"
type = "text"
path = "workflows/planning.md"
required = ["composed-design review as `applicable` or `not-applicable`", "answer every artifact probe", "Do not inherit a prior design's composed-design review"]
prohibited = []

[[checks]]
id = "verification-projection"
type = "text"
path = "workflows/verification.md"
required = ["## Simplicity Evidence Boundary", "does not establish that the composed\nartifact is simple", "Keep that design\nevidence distinct from reliability evidence"]
prohibited = []

[[checks]]
id = "library-projection"
type = "text"
path = "profiles/applications/library.md"
required = ["## Composed-Design Projection", "caller knowledge includes every exported contract", "Keep internal and test Seams private"]
prohibited = ["A hypothetical Adapter", "materially distinct real implementations"]

[[checks]]
id = "generated-contract-projection"
type = "text"
path = "profiles/boundaries/generated-contract.md"
required = ["## Composed-Design Projection", "Generation may make authoring easy without making the produced artifact simple", "Automating their coordinated propagation does not prove\nthat they can change independently"]
prohibited = []

[[checks]]
id = "prompt-projections"
type = "text"
path = "prompts/planning.md"
required = ["Record composed-design review as `applicable` or `not-applicable`", "use the\n    Architecture admission", "Re-run the applicable admission"]
prohibited = ["caller and composition-root knowledge", "A hypothetical Adapter"]

[[checks]]
id = "implementation-prompt-projection"
type = "text"
path = "prompts/implement-plan.md"
required = ["Preserve the plan's admitted composed design", "Follow Implementation's re-plan\nrule"]
prohibited = ["representative change Locality", "Do not treat passing"]

[[checks]]
id = "full-review-prompt-projection"
type = "text"
path = "prompts/full-codebase-standards-refactor.md"
required = ["evaluate the\nproduced artifact through the Architecture admission", "record the result\nthrough Planning"]
prohibited = ["caller and composition-root", "Treat a hypothetical Adapter"]

[[checks]]
id = "template-projection"
type = "text"
path = "templates/PLAN-TEMPLATE.md"
required = ["**Applicability:** `applicable` or `not-applicable`", "Caller and composition-root knowledge", "Deletion and cumulative machinery result"]
prohibited = []

[[checks]]
id = "legacy"
type = "text"
path = "CODING-STANDARDS.md"
required = ["# Coding Standards Legacy Index"]
prohibited = ["## Simplicity Principle"]

[[checks]]
id = "dispositions"
type = "text"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
required = [
  "STD-0135\tCODING-STANDARDS.md\tCODING-STANDARDS.md\tindex\tconvert the Coding Standards title and introduction into a bounded migration index",
  "STD-0136\tCODING-STANDARDS.md\tCORE-STANDARDS.md\trefine\tdefine simplicity by entanglement ownership invariants and reasoning load rather than visible construct counts or smallest-diff fallback",
]
prohibited = []
