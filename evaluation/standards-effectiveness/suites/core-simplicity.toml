schema_version = 1
id = "core-simplicity"
owner = "core.simplicity-and-complection"
description = "Core simplicity definitions and Architecture-owned composed-design admission without ease, reliability, or cardinality proxies."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/core/simplicity-decisions.tsv"
expected_column = "expected"
default = "simple"
[checks.domains]
case = ["*"]
artifact_coupling = ["braided", "contained", "independent", "unknown"]
caller_knowledge = ["owned-only", "unrelated", "unknown"]
composition_root = ["bounded", "cross-owner", "not-applicable", "unknown"]
change_locality = ["forced-broad", "local", "unknown"]
interface_depth = ["deep", "not-applicable", "shallow", "unknown"]
independent_evolution = ["no", "not-applicable", "unknown", "yes"]
deletion_result = ["essential", "incidental", "not-applicable", "unknown"]
generality_basis = ["contract-or-invariant", "hypothetical-as-permanent-basis", "none", "probe-only-no-permanent-seam", "real-variants", "unknown"]
authoring_ease = ["familiar", "neutral", "unfamiliar"]
reliability_evidence = ["covered", "neutral", "uncovered"]
metric_role = ["count-as-verdict", "diagnostic-count", "none"]
expected = ["complected", "simple", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "metric_role", op = "eq", value = "count-as-verdict" },
  { field = "generality_basis", op = "eq", value = "hypothetical-as-permanent-basis" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "artifact_coupling", op = "eq", value = "unknown" },
  { field = "caller_knowledge", op = "eq", value = "unknown" },
  { field = "composition_root", op = "eq", value = "unknown" },
  { field = "change_locality", op = "eq", value = "unknown" },
  { field = "interface_depth", op = "eq", value = "unknown" },
  { field = "independent_evolution", op = "eq", value = "unknown" },
  { field = "deletion_result", op = "eq", value = "unknown" },
  { field = "generality_basis", op = "eq", value = "unknown" },
]
[[checks.rules]]
outcome = "complected"
[checks.rules.when]
any = [
  { field = "artifact_coupling", op = "eq", value = "braided" },
  { field = "caller_knowledge", op = "eq", value = "unrelated" },
  { field = "composition_root", op = "eq", value = "cross-owner" },
  { field = "change_locality", op = "eq", value = "forced-broad" },
  { field = "interface_depth", op = "eq", value = "shallow" },
  { field = "independent_evolution", op = "eq", value = "no" },
  { field = "deletion_result", op = "eq", value = "incidental" },
]


[[checks]]
id = "dispositions-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0135", "CODING-STANDARDS.md", "CODING-STANDARDS.md", "index"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0135"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0136", "CODING-STANDARDS.md", "CORE-STANDARDS.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0136"}]}}]
