schema_version = 1
id = "rust-no-std-closure"
owner = "profile.language.rust.cross-platform"
description = "Rust no_std capability ownership, adapter, reference, disposition, and legacy-source closure without host or feature fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/no-std-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
target = ["accepted", "contradictory", "missing"]
consumer = ["accepted", "missing"]
feature = ["accepted", "missing"]
dependency = ["accepted", "missing"]
evidence = ["accepted", "missing"]
capability = ["supported", "unsupported"]
fallback = ["compile-only", "dependency-default", "embedded", "feature-split", "host-test", "library", "nearby-target", "none", "std-default"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "target", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "target", op = "eq", value = "missing" }, { field = "consumer", op = "eq", value = "missing" }, { field = "feature", op = "eq", value = "missing" }, { field = "dependency", op = "eq", value = "missing" }, { field = "evidence", op = "eq", value = "missing" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]

[[checks]]
id = "legacy-heading-closure"
type = "markdown_heading_cardinality"
path = "languages/rust/RUST-TOOLING-STANDARDS.md"
level = 2
cardinality = "empty"

[[checks]]
id = "disposition-lineage"
type = "keyed_relation"
[checks.keys]
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
columns = ["ids"]
order = "source"
where = { all = [{ field = "baseline_order", op = "eq", value = "23" }, { field = "child_order", op = "eq", value = "12" }] }
split = { field = "ids", delimiter = "," }
[checks.expected]
path = "evaluation/standards-effectiveness/milestone-7-row-23-owner-validation.tsv"
header = ["id", "owner", "disposition", "outcome"]
key = "id"
values = ["owner", "disposition"]
[checks.observed]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
key = "id"
values = ["target", "disposition"]
