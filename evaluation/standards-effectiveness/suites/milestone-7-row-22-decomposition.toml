schema_version = 1
id = "milestone-7-row-22-decomposition"
owner = "migration.parent-plan"
description = "Accepted row 22 Rust release decomposition with exact identity, ownership, disposition, report, lifecycle, and path-state evidence."

[[checks]]
id = "execution-decomposition"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
non_empty = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
unique = [["baseline_order", "child_order"]]
[[checks.projections]]
columns = ["child_order"]
order = "source"
expected = [["1"], ["2"], ["3"], ["4"], ["5"], ["6"], ["7"]]
[checks.projections.where]
field = "baseline_order"
op = "eq"
value = "22"

[[checks]]
id = "owner-validation"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-row-22-owner-validation.tsv"
header = ["id", "owner", "disposition", "outcome"]
non_empty = ["id", "owner", "disposition", "outcome"]
unique = [["id"]]
[[checks.projections]]
columns = ["id"]
order = "source"
expected = [["STD-0810"], ["STD-0811"], ["STD-0812"], ["STD-0813"], ["STD-0814"], ["STD-0815"], ["STD-0816"], ["STD-0817"], ["STD-0818"], ["STD-0819"], ["STD-0820"]]

[[checks]]
id = "decomposition-identities"
type = "relation"
mode = "set"
[checks.left]
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
columns = ["ids"]
order = "source"
[checks.left.where]
field = "baseline_order"
op = "eq"
value = "22"
[checks.left.split]
field = "ids"
delimiter = ","
[checks.right]
path = "evaluation/standards-effectiveness/milestone-7-row-22-owner-validation.tsv"
header = ["id", "owner", "disposition", "outcome"]
columns = ["id"]
order = "source"

[[checks]]
id = "disposition-lineage"
type = "relation"
mode = "set"
[checks.left]
path = "evaluation/standards-effectiveness/milestone-7-row-22-owner-validation.tsv"
header = ["id", "owner", "disposition", "outcome"]
columns = ["id", "owner", "disposition"]
order = "source"
[checks.right]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
