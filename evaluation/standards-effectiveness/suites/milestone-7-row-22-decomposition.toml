[checks.right.where]
field = "source"
op = "eq"
value = "languages/rust/RUST-RELEASE-STANDARDS.md"

[[checks]]
id = "decomposition-report"
type = "text"
path = "docs/plans/standards-library-effectiveness/reports/milestone-7-row-22-decomposition.md"
