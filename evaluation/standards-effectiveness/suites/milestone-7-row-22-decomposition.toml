[[checks]]
id = "execution-train-owner"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-train.tsv"
header = ["order", "wave", "start_id", "end_id", "source", "owner", "owner_state", "activation", "checkpoint"]
[[checks.projections]]
columns = ["owner"]
order = "source"
expected = [["profiles/languages/rust/release.md"]]
[checks.projections.where]
field = "order"
op = "eq"
value = "22"

[[checks]]
id = "canonical-paths"
type = "path_state"
