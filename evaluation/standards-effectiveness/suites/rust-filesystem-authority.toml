schema_version = 1
id = "rust-filesystem-authority"
owner = "profile.language.rust.security"
description = "Rust filesystem authority preservation through existing-object use and creation under explicit mutation assumptions."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/filesystem-authority-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
target = ["existing", "create"]
containment = ["proven", "escaped", "unproven", "unknown"]
mutation = ["excluded", "concurrent", "unknown"]
use_authority = ["held-file", "handle-relative", "revalidated-path", "plain-path", "unavailable"]
fallback = ["none", "plain-path", "revalidate", "lexical", "alternate-root", "unanchored-create"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "containment", op = "in", values = ["escaped", "unproven"] },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "containment", op = "eq", value = "unknown" },
  { field = "mutation", op = "eq", value = "unknown" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [
  { field = "mutation", op = "eq", value = "concurrent" },
  { field = "use_authority", op = "eq", value = "unavailable" },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
all = [
  { field = "mutation", op = "eq", value = "concurrent" },
  { field = "use_authority", op = "not_in", values = ["held-file", "handle-relative"] },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
all = [
  { field = "mutation", op = "eq", value = "excluded" },
  { field = "use_authority", op = "not_in", values = ["held-file", "handle-relative", "revalidated-path"] },
]

[[checks]]
id = "source-identity"
type = "table"
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "path"]
order = "source"
expected = [["STD-0822", "languages/rust/RUST-SECURITY-STANDARDS.md"]]
[checks.projections.where]
field = "id"
op = "eq"
value = "STD-0822"

[[checks]]
id = "exact-disposition"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [["STD-0822", "languages/rust/RUST-SECURITY-STANDARDS.md", "profiles/languages/rust/security.md", "refine", "preserve validated filesystem authority through the Rust operation"]]
[checks.projections.where]
field = "id"
op = "eq"
value = "STD-0822"

[[checks]]
id = "metadata-closure"
type = "metadata_graph"
paths = ["CORE-STANDARDS.md", "workflows/verification.md", "topics/security.md", "topics/cross-platform.md", "profiles/languages/rust/README.md", "profiles/languages/rust/security.md", "workflows/verification/oracles.md", "workflows/verification/platforms.md", "workflows/verification/gui.md", "topics/code-design.md"]
