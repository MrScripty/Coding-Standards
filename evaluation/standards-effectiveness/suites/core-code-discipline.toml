schema_version = 1
id = "core-code-discipline"
owner = "core.code-discipline"
description = "Code and terminology decisions from owned concerns, invariants, lifecycle, and contracts without blanket extraction, DRY, call-count, smallest-diff, speculative, or incumbent fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/core/code-discipline-decisions.tsv"
expected_column = "expected"
default = "keep-name"
[checks.domains]
case = ["*"]
concerns = ["multiple", "one"]
ownership = ["clear", "none", "unknown"]
invariants = ["different", "known", "none", "unknown"]
lifecycle = ["active", "different", "known", "none"]
contract = ["multiple", "none", "one", "supported"]
divergence = ["none", "risk"]
meaning = ["clear", "incorrect"]
fallback = ["blanket-dry", "call-count", "incumbent", "none", "smallest-diff", "speculative"]
expected = ["consolidate", "delete", "direct", "keep-name", "keep-separate", "preserve", "rename", "separate", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "ownership", op = "eq", value = "unknown" },
  { field = "invariants", op = "eq", value = "unknown" },
]
[[checks.rules]]
outcome = "delete"
[checks.rules.when]
all = [
  { field = "ownership", op = "eq", value = "none" },
  { field = "contract", op = "eq", value = "none" },
]
[[checks.rules]]
outcome = "preserve"
[checks.rules.when]
all = [
  { field = "contract", op = "eq", value = "supported" },
  { field = "lifecycle", op = "eq", value = "active" },
]
[[checks.rules]]
outcome = "rename"
[checks.rules.when]
all = [{ field = "meaning", op = "eq", value = "incorrect" }]
[[checks.rules]]
outcome = "consolidate"
[checks.rules.when]
all = [
  { field = "divergence", op = "eq", value = "risk" },
  { field = "contract", op = "eq", value = "one" },
]
[[checks.rules]]
outcome = "keep-separate"
[checks.rules.when]
all = [
  { field = "concerns", op = "eq", value = "multiple" },
  { field = "contract", op = "eq", value = "multiple" },
]
[[checks.rules]]
outcome = "separate"
[checks.rules.when]
all = [{ field = "concerns", op = "eq", value = "multiple" }]
[[checks.rules]]
outcome = "keep-name"
[checks.rules.when]
all = [{ field = "case", op = "eq", value = "descriptive_name" }]
[[checks.rules]]
outcome = "direct"
[checks.rules.when]
all = [{ field = "meaning", op = "eq", value = "clear" }]


[[checks]]
id = "dispositions-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0158", "CODING-STANDARDS.md", "CODING-STANDARDS.md", "index"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0158"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0159", "CODING-STANDARDS.md", "CORE-STANDARDS.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0159"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0160", "CODING-STANDARDS.md", "CORE-STANDARDS.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0160"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0161", "CODING-STANDARDS.md", "CORE-STANDARDS.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0161"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0162", "CODING-STANDARDS.md", "CORE-STANDARDS.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0162"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0163", "CODING-STANDARDS.md", "CORE-STANDARDS.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0163"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0164", "CODING-STANDARDS.md", "CODING-STANDARDS.md", "index"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0164"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0165", "CODING-STANDARDS.md", "CORE-STANDARDS.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0165"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["ST