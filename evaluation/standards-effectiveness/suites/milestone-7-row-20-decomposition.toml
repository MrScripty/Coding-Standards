schema_version = 1
id = "milestone-7-row-20-decomposition"
owner = "migration.parent-plan"
description = "Accepted row 20 Rust API decomposition with exact identity, ownership, disposition, report, and lifecycle evidence."

[[checks]]
id = "execution-decomposition"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
