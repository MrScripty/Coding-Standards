schema_version = 1
id = "generated-contract-semantic-conformance"
owner = "topic.contracts"
description = "Generated contracts separate freshness, reachable shape, executable semantics, public consumers, external conformance, and equality domains."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/contracts/generated-contract-conformance-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
source = ["missing", "supported", "unsupported"]
closure = ["complete", "incomplete"]
freshness = ["fresh", "stale"]
shape = ["agree", "disagree"]
semantics = ["conform", "nonconform"]
public_path = ["missing", "pass"]
external_oracle = ["independent", "local-only", "not-applicable"]
equality_domain = ["conflated", "separated"]
scope = ["candidate", "historical-a1"]
expected = ["allow", "record-nonconformance", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "record-nonconformance"
[checks.rules.when]
all = [
  { field = "scope", op = "eq", value = "historical-a1" },
  { field = "semantics", op = "eq", value = "nonconform" },
  { field = "external_oracle", op = "eq", value = "independent" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "source", op = "eq", value = "missing" },
  { field = "public_path", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "source", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "closure", op = "eq", value = "incomplete" },
  { field = "freshness", op = "eq", value = "stale" },
  { field = "shape", op = "eq", value = "disagree" },
  { field = "semantics", op = "eq", value = "nonconform" },
  { field = "external_oracle", op = "eq", value = "local-only" },
  { field = "equality_domain", op = "eq", value = "conflated" },
]

[[checks]]
id = "contracts-policy"
type = "text"
path = "topics/contracts.md"
required = ["## Generated Contract Semantic Conformance", "## Schema Dialect And Vocabulary", "## Identity And Instance Equality", "Comparing the local executables remains useful consistency evidence", "be the only external-conformance oracle"]
prohibited = []

[[checks]]
id = "profile-projection"
type = "text"
path = "profiles/boundaries/generated-contract.md"
required = ["source freshness, shape agreement, semantic", "conformance, and public consumer behavior", "independent reference or official", "corpus when several local implementations", "unsupported"]
prohibited = []

[[checks]]
id = "known-a1-nonconformance"
type = "text"
path = "docs/plans/standards-engine-standards-recovery/reports/json-schema-instance-equality-reproduction.md"
required = ["Draft 2020-12", "nonconformance"]
prohibited = []

[[checks]]
id = "registered-consumers"
type = "path_state"
present = [
  "workflows/build.md",
  "workflows/tooling.md",
  "workflows/documentation.md",
  "topics/licensing.md",
  "profiles/applications/library.md",
  "profiles/boundaries/language-bindings.md",
  "profiles/boundaries/ipc.md",
  "tools/standards_engine/contracts/a1-contract.schema.json",
  "tools/standards_engine/contracts/examples/a1-examples.json",
  "tools/standards_engine/contracts/generated/agent-tools.json",
  "tools/standards_engine/contracts/identity-fixtures.json",
  "tools/standards_engine/contracts/generate_contract.py",
  "tools/standards_engine/contracts/validate_contracts.py",
  "tools/standards_engine/standards_engine/__init__.py",
  "tools/standards_engine/standards_engine/_generated_contract.py",
  "tools/standards_engine/standards_engine/model.py",
  "tools/standards_engine/standards_engine/rendering.py",
  "tools/standards_engine/standards_engine/tools.py",
  "tools/standards_applicability/standards_applicability/__init__.py",
  "tools/standards_applicability/standards_applicability/core.py",
  "tools/standards_applicability/standards_applicability/errors.py",
  "tools/standards_metadata/standards_metadata/serialization.py",
  "tools/standards_engine/tests/test_applicability_contract.py",
  "tools/standards_engine/tests/test_generated_contract.py",
  "tools/standards_engine/tests/test_rendering.py",
  "tools/standards_applicability/tests/test_applicability.py",
]
