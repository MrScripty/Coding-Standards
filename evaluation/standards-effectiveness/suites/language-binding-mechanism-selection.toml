schema_version = 1
id = "language-binding-mechanism-selection"
owner = "profile.boundary.language-bindings"
description = "Boundary-fact mechanism selection with exact Rust source lineage, typed outcomes, and no framework, transport, or default-success fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/language-bindings/mechanism-selection-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
topology = ["in-process", "process"]
representation = ["framework", "serialized", "c-abi", "opaque"]
selection = ["framework", "serialized", "c-abi", "opaque", "ipc"]
lifecycle = ["fit", "mismatch"]
requirement = ["supported", "unsupported"]
capability = ["available", "unavailable"]
evidence = ["complete", "missing"]
fallback = ["none", "target-count", "host-label", "ui-technology", "alternate-framework", "alternate-abi", "alternate-serializer", "process-substitute", "default-success"]
expected = ["allow", "typed-invalid", "typed-unsupported", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "lifecycle", op = "eq", value = "mismatch" },
  { all = [
    { field = "topology", op = "eq", value = "process" },
    { field = "selection", op = "ne", value = "ipc" },
  ] },
  { all = [
    { field = "topology", op = "eq", value = "in-process" },
    { field = "selection", op = "eq", value = "ipc" },
  ] },
  { all = [
    { field = "topology", op = "eq", value = "in-process" },
    { field = "representation", op = "eq", value = "framework" },
    { field = "selection", op = "in", values = ["serialized", "c-abi", "opaque"] },
  ] },
  { all = [
    { field = "topology", op = "eq", value = "in-process" },
    { field = "representation", op = "eq", value = "serialized" },
    { field = "selection", op = "in", values = ["framework", "c-abi", "opaque"] },
  ] },
  { all = [
    { field = "topology", op = "eq", value = "in-process" },
    { field = "representation", op = "eq", value = "c-abi" },
    { field = "selection", op = "in", values = ["framework", "serialized", "opaque"] },
  ] },
  { all = [
    { field = "topology", op = "eq", value = "in-process" },
    { field = "representation", op = "eq", value = "opaque" },
    { field = "selection", op = "in", values = ["framework", "serialized", "c-abi"] },
  ] },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "requirement", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "capability", op = "eq", value = "unavailable" },
  { field = "evidence", op = "eq", value = "missing" },
]

[[checks]]
id = "source-identities"
type = "table"
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "path", "level", "target_role", "disposition", "heading"]
order = "source"
expected = [
  ["STD-0805", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "2", "language-profile", "split", "Choosing a Binding Approach"],
  ["STD-0806", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "3", "language-profile", "split", "Rules"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0805", "STD-0806"]

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [
  ["STD-0805", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "profiles/boundaries/language-bindings.md", "refine", "select the boundary mechanism from complete contract facts"],
  ["STD-0806", "languages/rust/RUST-LANGUAGE-BINDINGS-STANDARDS.md", "profiles/boundaries/language-bindings.md", "refine", "reject framework and transport defaults based on target count or host label"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0805", "STD-0806"]
