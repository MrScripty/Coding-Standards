[[checks]]
id = "planning-prompt-projection"
type = "text"
path = "prompts/planning.md"
required = ["Select one coherent implementation unit", "a plan", "may contain one milestone and one slice", "Keep Git topology out of the plan", "leave coherent commit boundaries to the Commit workflow"]
prohibited = ["Use thin vertical milestones"]

[[checks]]
id = "legacy-index"
type = "text"
path = "PLAN-STANDARDS.md"
required = [
  "# Plan Standards",
  "[workflows/planning.md](workflows/planning.md)",
  "contains no independent normative planning",
]
prohibited = [
  "## When a Plan Is Required",
  "## Concurrent Worker Execution",
]

[[checks]]
id = "disposition-coverage"
type = "relation"
mode = "set"
[checks.left]
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
columns = ["id"]
order = "source"
where = { field = "path", op = "eq", value = "PLAN-STANDARDS.md" }
[checks.right]
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
columns = ["id"]
order = "source"
where = { field = "source", op = "eq", value = "PLAN-STANDARDS.md" }

[[checks]]
id = "terminal-authority"
type = "path_state"
present = ["evaluation/standards-effectiveness/suites/planning-consolidation.toml"]
absent = ["evaluation/standards-effectiveness/verify-plan-fixtures.sh"]
