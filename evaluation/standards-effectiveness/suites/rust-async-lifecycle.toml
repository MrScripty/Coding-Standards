schema_version = 1
id = "rust-async-lifecycle"
owner = "profile.language.rust.async"
description = "Composition-owned Rust runtime capability, task lifecycle, failure observation, shutdown, and abort authority."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/async-lifecycle-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
runtime_owner = ["composition", "library-global", "missing"]
task_tracking = ["none", "tracked", "detached"]
failure = ["observed", "discarded", "leaf-logged", "not-required"]
admission = ["closed", "open", "not-required"]
drain = ["complete", "incomplete", "not-required"]
abort = ["none", "authorized-safe", "authorized-unsafe", "unauthorized"]
capability = ["available", "unavailable"]
fallback = ["none", "alternate-runtime", "leaf-logging", "force-abort"]
expected = ["allow", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "runtime_owner", op = "eq", value = "library-global" },
  { field = "task_tracking", op = "eq", value = "detached" },
  { field = "failure", op = "in", values = ["discarded", "leaf-logged"] },
  { field = "admission", op = "eq", value = "open" },
  { field = "abort", op = "in", values = ["authorized-unsafe", "unauthorized"] },
  { field = "fallback", op = "ne", value = "none" },
]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "runtime_owner", op = "eq", value = "missing" },
  { field = "capability", op = "eq", value = "unavailable" },
  { all = [
    { field = "drain", op = "eq", value = "incomplete" },
    { field = "abort", op = "ne", value = "authorized-safe" },
  ] },
]

[[checks]]
id = "source-identities"
type = "table"
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "path"]
order = "source"
expected = [
  ["STD-0719", "languages/rust/RUST-ASYNC-STANDARDS.md"],
  ["STD-0720", "languages/rust/RUST-ASYNC-STANDARDS.md"],
  ["STD-0721", "languages/rust/RUST-ASYNC-STANDARDS.md"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0719", "STD-0720", "STD-0721"]

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id", "source", "target", "disposition", "rationale"]
order = "source"
expected = [
  ["STD-0719", "languages/rust/RUST-ASYNC-STANDARDS.md", "profiles/languages/rust/async.md", "refine", "assign runtime construction to composition ownership without a library-global default"],
  ["STD-0720", "languages/rust/RUST-ASYNC-STANDARDS.md", "profiles/languages/rust/async.md", "refine", "require tracked task completion failure and shutdown ownership"],
  ["STD-0721", "languages/rust/RUST-ASYNC-STANDARDS.md", "profiles/languages/rust/async.md", "refine", "coordinate admission cancellation draining and abort authority"],
]
[checks.projections.where]
field = "id"
op = "in"
values = ["STD-0719", "STD-0720", "STD-0721"]

