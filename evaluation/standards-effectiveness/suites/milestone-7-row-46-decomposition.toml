description = "Exact row-46 lifecycle, owner-validation lineage, decomposition, and accepted-plan evidence without Rust source semantics or nested checker execution."

[[checks]]
id = "row-46-execution-train"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-train.tsv"
header = ["order", "wave", "start_id", "end_id", "source", "owner", "owner_state", "activation", "checkpoint"]
[[checks.projections]]
columns = ["order", "wave", "start_id", "end_id", "source", "owner", "owner_state", "activation", "checkpoint"]
order = "source"
expected = [["46", "reference-index-closure", "STD-0827", "STD-0830", "languages/rust/RUST-STANDARDS.md", "profiles/languages/rust/README.md", "exists", "final-closure", "focused"]]
[checks.projections.where]
field = "order"
op = "eq"
value = "46"

[[checks]]
id = "row-46-package"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-accelerated-packages.tsv"
header = ["train_order", "package_id", "risk_class", "owner", "owner_action", "verification_family", "draft_mode", "integration_gate", "semantic_outcome", "prerequisites"]
[[checks.projections]]
columns = ["train_order", "package_id", "risk_class", "owner", "owner_action", "verification_family", "draft_mode", "integration_gate", "semantic_outcome", "prerequisites"]
order = "source"
expected = [["46", "P38", "mechanical", "profiles/languages/rust/README.md", "closure-only", "migration-structure", "serial-only", "focused", "rust-index-closure", "core"]]
[checks.projections.where]
field = "train_order"
op = "eq"
value = "46"

[[checks]]
id = "row-46-owner-validation"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-row-46-owner-validation.tsv"
header = ["id", "canonical_owner", "disposition", "reference_treatment", "rationale"]
non_empty = ["id", "canonical_owner", "disposition", "reference_treatment", "rationale"]
unique = [["id"]]
[checks.domains]
canonical_owner = ["profiles/languages/rust/README.md"]
disposition = ["index", "split"]
reference_treatment = ["none"]
[[checks.projections]]
columns = ["id", "canonical_owner", "disposition", "reference_treatment"]
order = "source"
expected = [["STD-0827", "profiles/languages/rust/README.md", "index", "none"], ["STD-0828", "profiles/languages/rust/README.md", "index", "none"], ["STD-0829", "profiles/languages/rust/README.md", "split", "none"], ["STD-0830", "profiles/languages/rust/README.md", "split", "none"]]

[[checks]]
id = "owner-map-lineage"
type = "relation"
mode = "set"
[checks.left]
