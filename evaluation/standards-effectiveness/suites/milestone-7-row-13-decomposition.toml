expected = [
  ["1", "STD-0273", "CONCURRENCY-STANDARDS.md", "profiles/languages/csharp/async.md", "exists", "pre-slice-review", "focused", "none"],
  ["2", "STD-0274", "CONCURRENCY-STANDARDS.md", "CONCURRENCY-STANDARDS.md", "exists", "pre-slice-review", "focused", "none"],
  ["3", "STD-0275,STD-0276", "CONCURRENCY-STANDARDS.md", "profiles/languages/typescript/async.md", "exists", "pre-slice-review", "focused", "none"],
  ["4", "STD-0277,STD-0278,STD-0279", "CONCURRENCY-STANDARDS.md", "profiles/frameworks/godot.md", "exists", "pre-slice-review", "focused", "none"],
]
[checks.projections.where]
field = "baseline_order"
op = "eq"
value = "13"

[[checks.projections]]
columns = ["ids"]
order = "lexical"
expected = [
  ["STD-0273"], ["STD-0274"], ["STD-0275"], ["STD-0276"],
  ["STD-0277"], ["STD-0278"], ["STD-0279"],
]
[checks.projections.where]
field = "baseline_order"
op = "eq"
value = "13"
[checks.projections.split]
field = "ids"
delimiter = ","

[[checks]]
id = "exact-dispositions"
type = "table"
