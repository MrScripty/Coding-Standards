expected = [
  ["STD-0273", "CONCURRENCY-STANDARDS.md", "profiles/languages/csharp/async.md", "refine"],
  ["STD-0274", "CONCURRENCY-STANDARDS.md", "CONCURRENCY-STANDARDS.md", "index"],
  ["STD-0275", "CONCURRENCY-STANDARDS.md", "CONCURRENCY-STANDARDS.md", "index"],
  ["STD-0276", "CONCURRENCY-STANDARDS.md", "profiles/languages/typescript/async.md", "refine"],
  ["STD-0277", "CONCURRENCY-STANDARDS.md", "CONCURRENCY-STANDARDS.md", "index"],
  ["STD-0278", "CONCURRENCY-STANDARDS.md", "profiles/frameworks/godot.md", "refine"],
  ["STD-0279", "CONCURRENCY-STANDARDS.md", "profiles/frameworks/godot.md", "refine"],
