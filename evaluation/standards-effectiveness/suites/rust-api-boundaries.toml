schema_version = 1
id = "rust-api-boundaries"
owner = "profile.language.rust.api"
description = "Rust crate and module boundary mechanisms selected by Architecture and consumer facts."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/rust/api-boundary-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
architecture = ["accepted", "contradictory", "missing"]
public_surface = ["missing", "private", "public", "workspace"]
platform = ["shared", "variable"]
mechanism = ["item-cfg", "module", "private-module", "pub-crate", "reexport", "target-module", "workspace-crate"]
capability = ["supported", "unsupported"]
fallback = ["behavior-switch", "file-name", "fixed-tree", "implementation-visibility", "none", "public-reexport", "role-name", "thin-platform"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [{ field = "fallback", op = "ne", value = "none" }, { field = "architecture", op = "eq", value = "contradictory" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [{ field = "architecture", op = "eq", value = "missing" }, { field = "public_surface", op = "eq", value = "missing" }]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "capability", op = "eq", value = "unsupported" }]


[[checks]]
id = "disposition-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0709", "languages/rust/RUST-API-STANDARDS.md", "profiles/languages/rust/api.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0709"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0710", "languages/rust/RUST-API-STANDARDS.md", "profiles/languages/rust/api.md", "split"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0710"}]}}]
