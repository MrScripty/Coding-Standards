schema_version = 1
id = "readme-template-derivation-closure"
owner = "workflow.documentation"
description = "README template selection and source closure without universal headings, directory-shape inference, or fallback."

[[checks]]
id = "source-gaps"
type = "table"
path = "evaluation/standards-effectiveness/fixtures/migration/undisposed-source-gaps.tsv"
header = ["id", "classification", "reason"]
[[checks.projections]]
columns = ["id", "classification", "reason"]
order = "source"
expected = []

[[checks]]
id = "corpus-classification"
type = "table"
path = "evaluation/standards-effectiveness/corpus.tsv"
header = ["path", "kind", "normative", "target_role", "preliminary_disposition", "baseline_source"]
[[checks.projections]]
columns = ["path", "kind", "normative", "target_role", "preliminary_disposition", "baseline_source"]
order = "source"
expected = [["templates/README-TEMPLATE.md", "template", "derived", "reference", "split", "git"]]
[checks.projections.where]
field = "path"
op = "eq"
value = "templates/README-TEMPLATE.md"
