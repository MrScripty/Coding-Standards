schema_version = 1
id = "language-binding-wire-representation"
owner = "profile.boundary.language-bindings"
description = "Schema-selected serialized wire representation with consumer agreement, directional evidence, typed failures, and no inferred fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/language-bindings/serialized-wire-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
schema = ["selected", "missing"]
serializer = ["selected", "missing"]
shape = ["complete", "incomplete", "contradictory"]
consumer = ["aligned", "mismatch", "missing"]
variant = ["supported", "unsupported", "malformed"]
capability = ["available", "unavailable"]
evidence = ["round-trip", "one-way-consumer", "producer-only", "missing"]
fallback = ["none", "default-shape", "schema-free", "omit-variant", "alternate-serializer", "weaker-evidence"]
expected = ["allow", "typed-invalid", "typed-unsupported", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "shape", op = "in", values = ["incomplete", "contradictory"] },
  { field = "consumer", op = "eq", value = "mismatch" },
  { field = "variant", op = "eq", value = "malformed" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "variant", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "schema", op = "eq", value = "missing" },
  { field = "serializer", op = "eq", value = "missing" },
  { field = "consumer", op = "eq", value = "missing" },
  { field = "capability", op = "eq", value = "unavailable" },
  { field = "evidence", op = "in", values = ["producer-only", "missing"] },
]

[[checks]]
id = "source-membership"
type = "table"
path = "evaluation/standards-effectiveness/generated/section-inventory.tsv"
header = ["id", "path", "line", "level", "target_role", "disposition", "heading"]
non_empty = ["id", "path"]
unique = [["id"]]
[checks.domains]
path = ["INTEROP-STANDARDS.md"]
[checks.members]
path = "evaluation/standards-effectiveness/fixtures/language-bindings/serialized-wire-members.tsv"
header = ["id"]
columns = ["id"]
order = "source"
key = "id"

[[checks]]
id = "exact-dispositions"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[checks.domains]
source = ["INTEROP-STANDARDS.md"]
target = ["profiles/boundaries/language-bindings.md"]
disposition = ["refine"]
[checks.members]
path = "evaluation/standards-effectiveness/fixtures/language-bindings/serialized-wire-members.tsv"
header = ["id"]
columns = ["id"]
order = "source"
key = "id"

[[checks]]
id = "metadata-closure"
type = "metadata_graph"
paths = ["CORE-STANDARDS.md", "workflows/verification.md", "topics/contracts.md", "topics/security.md", "profiles/boundaries/interop.md", "profiles/boundaries/language-bindings.md", "topics/contracts/schemas.md", "topics/contracts/protocols.md", "topics/contracts/evolution.md", "workflows/verification/oracles.md", "workflows/verification/platforms.md", "workflows/verification/gui.md", "topics/code-design.md"]

[[checks]]
id = "profile-policy"
type = "text"
path = "profiles/boundaries/language-bindings.md"
required = [
  "## Serialized Wire Representation",
  "tagged-enum form",
  "variant spelling",
  "flattening, omission, and default rule",
  "Consumers must agree",
  "producer-to-consumer and consumer-to-producer",
  "Return `invalid`",
  "`unsupported`",
  "`unavailable`",
  "retry with another serializer",
]
