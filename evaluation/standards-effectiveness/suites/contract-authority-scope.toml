schema_version = 1
id = "contract-authority-scope"
owner = "topic.contracts"
description = "Canonical authority and version scopes follow coherent responsibilities, semantic owners, compatibility promises, and material identity effects."

[[checks]]
id = "authority-scope-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/architecture/authority-scope-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
responsibilities = ["coherent", "independent", "unknown"]
owners = ["aligned", "contradictory", "distinct", "missing"]
lifecycles = ["independent", "shared", "unknown"]
claimed_authority = ["missing", "referenced", "scoped", "umbrella"]
expected = ["allow", "separate-authority", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "owners", op = "eq", value = "missing" },
  { field = "responsibilities", op = "eq", value = "unknown" },
  { field = "lifecycles", op = "eq", value = "unknown" },
  { field = "claimed_authority", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
field = "owners"
op = "eq"
value = "contradictory"
[[checks.rules]]
outcome = "separate-authority"
[checks.rules.when]
all = [
  { field = "claimed_authority", op = "eq", value = "umbrella" },
  { any = [
    { field = "responsibilities", op = "eq", value = "independent" },
    { field = "owners", op = "eq", value = "distinct" },
    { field = "lifecycles", op = "eq", value = "independent" },
  ] },
]

[[checks]]
id = "immutable-authority-closure-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/architecture/immutable-authority-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
capture = ["exact"]
closure = ["complete", "incomplete"]
store = ["memory-only", "persistent", "unavailable"]
process = ["fresh", "same"]
post_capture_mutation = ["isolated", "visible"]
authorization_view = ["ambient", "immutable"]
provider_view = ["ambient", "immutable"]
promise = ["cold-replay", "in-process", "unknown"]
separate_artifacts = ["optional", "required", "unknown"]
separation_basis = ["independent-promise", "none", "unknown"]
expected = ["allow", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "closure", op = "eq", value = "incomplete" },
  { field = "promise", op = "eq", value = "unknown" },
  { field = "separate_artifacts", op = "eq", value = "unknown" },
  { field = "separation_basis", op = "eq", value = "unknown" },
  { all = [
    { field = "promise", op = "eq", value = "cold-replay" },
    { field = "store", op = "eq", value = "unavailable" },
  ] },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "post_capture_mutation", op = "eq", value = "visible" },
  { field = "authorization_view", op = "eq", value = "ambient" },
  { field = "provider_view", op = "eq", value = "ambient" },
  { all = [
    { field = "promise", op = "eq", value = "cold-replay" },
    { field = "store", op = "ne", value = "persistent" },
  ] },
  { all = [
    { field = "promise", op = "eq", value = "cold-replay" },
    { field = "process", op = "ne", value = "fresh" },
  ] },
  { all = [
    { field = "separate_artifacts", op = "eq", value = "required" },
    { field = "separation_basis", op = "eq", value = "none" },
  ] },
]

[[checks]]
id = "declaration-authority-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/contracts/declaration-authority-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
declaration_scope = ["domain", "mixed", "representation", "unknown"]
semantic_owner = ["contradictory", "distinct", "missing", "same"]
extension_behavior = ["not-applicable", "reference", "transfer"]
capability = ["supported", "unsupported"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "declaration_scope", op = "eq", value = "unknown" },
  { field = "semantic_owner", op = "eq", value = "missing" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
field = "capability"
op = "eq"
value = "unsupported"
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "semantic_owner", op = "eq", value = "contradictory" },
  { field = "extension_behavior", op = "eq", value = "transfer" },
]

[[checks]]
id = "version-scope-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/contracts/version-scope-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
promises = ["coherent", "independent", "one", "unknown"]
version_scope = ["missing", "separate", "shared", "umbrella"]
coupling_basis = ["build", "compatibility", "file", "none", "release"]
identity_effect = ["material", "not-applicable", "unknown", "unrelated"]
version_role = ["allocation-ordinal", "combined", "compatibility", "current-format", "identity-domain", "migration", "unknown"]
overlap = ["none", "promised", "unknown"]
consumer_set = ["actual", "hypothetical", "unknown"]
matrix = ["absent", "actual-only", "hypothetical", "not-applicable"]
expected = ["allow", "separate-versions", "typed-invalid", "typed-unavailable"]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "promises", op = "eq", value = "unknown" },
  { field = "version_scope", op = "eq", value = "missing" },
  { field = "identity_effect", op = "eq", value = "unknown" },
  { field = "version_role", op = "eq", value = "unknown" },
  { field = "overlap", op = "eq", value = "unknown" },
  { field = "consumer_set", op = "eq", value = "unknown" },
  { all = [
    { field = "version_role", op = "eq", value = "compatibility" },
    { field = "overlap", op = "eq", value = "promised" },
    { field = "matrix", op = "eq", value = "absent" },
  ] },
]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "identity_effect", op = "eq", value = "unrelated" },
  { field = "matrix", op = "eq", value = "hypothetical" },
  { all = [
    { field = "version_role", op = "eq", value = "allocation-ordinal" },
    { field = "coupling_basis", op = "eq", value = "compatibility" },
  ] },
  { all = [
    { field = "consumer_set", op = "eq", value = "hypothetical" },
    { field = "overlap", op = "eq", value = "promised" },
  ] },
]
[[checks.rules]]
outcome = "separate-versions"
[checks.rules.when]
any = [
  { all = [
    { field = "version_scope", op = "eq", value = "umbrella" },
    { any = [
      { field = "promises", op = "eq", value = "independent" },
      { field = "coupling_basis", op = "ne", value = "compatibility" },
    ] },
  ] },
  { all = [
    { field = "version_role", op = "eq", value = "combined" },
    { field = "promises", op = "eq", value = "independent" },
  ] },
]
