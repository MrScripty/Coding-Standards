schema_version = 1
id = "launcher-owner-row-14"
owner = "profile.application.launcher"
description = "Launcher owner decisions and exact row-14 decomposition without guessed actions, copied lifecycle authority, or nested Bash execution."

[[checks]]
id = "owner-decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/launcher/owner-contract-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
selection = ["one", "multiple", "none"]
action = ["declared", "unknown", "unsupported"]
procedure = ["selected", "missing"]
arguments = ["valid", "invalid"]
target = ["available", "missing"]
lifecycle = ["complete", "bounded", "missing"]
evidence = ["complete", "missing"]
fallback = ["none", "guess-target", "alternate-command", "successful-noop", "default-success"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "fallback", op = "ne", value = "none" },
  { field = "selection", op = "eq", value = "multiple" },
  { field = "selection", op = "eq", value = "none" },
  { field = "action", op = "eq", value = "unknown" },
  { field = "arguments", op = "eq", value = "invalid" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "action", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "procedure", op = "eq", value = "missing" },
  { field = "target", op = "eq", value = "missing" },
  { field = "lifecycle", op = "eq", value = "missing" },
  { field = "evidence", op = "eq", value = "missing" },
]

[[checks]]
id = "owner-profile"
type = "text"
path = "profiles/applications/launcher.md"
required = [
  "ID: `profile.application.launcher`",
  "Launcher Authority",
  "Select Actions From Declared Capabilities",
  "Delegate Without Upgrading Evidence",
  "Own Process And State Boundaries",
  "does not own application business logic",
  "typed `invalid`, `unsupported`, or `unavailable`",
  "Do not continue through a guessed action",
]
prohibited = []

[[checks]]
id = "router-projection"
type = "text"
path = "STANDARDS-ROUTER.md"
required = ["Common application launcher command projection, lifecycle, delegation, or outcome-preservation contract is required"]
prohibited = []

[[checks]]
id = "exact-disposition-identities"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
unique = [["id"]]
[[checks.projections]]
columns = ["id"]
order = "lexical"
expected = [
  ["STD-0487"], ["STD-0488"], ["STD-0489"], ["STD-0490"], ["STD-0491"], ["STD-0492"], ["STD-0493"],
  ["STD-0494"], ["STD-0495"], ["STD-0496"], ["STD-0497"], ["STD-0498"], ["STD-0499"], ["STD-0500"],
  ["STD-0501"], ["STD-0502"], ["STD-0503"], ["STD-0504"], ["STD-0505"], ["STD-0506"], ["STD-0507"],
  ["STD-0508"], ["STD-0509"], ["STD-0510"], ["STD-0511"], ["STD-0512"],
]
[checks.projections.where]
field = "id"
op = "in"
values = [
  "STD-0487", "STD-0488", "STD-0489", "STD-0490", "STD-0491", "STD-0492", "STD-0493", "STD-0494",
  "STD-0495", "STD-0496", "STD-0497", "STD-0498", "STD-0499", "STD-0500", "STD-0501", "STD-0502",
  "STD-0503", "STD-0504", "STD-0505", "STD-0506", "STD-0507", "STD-0508", "STD-0509", "STD-0510",
  "STD-0511", "STD-0512",
]

[[checks]]
id = "execution-train"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-train.tsv"
header = ["order", "wave", "start_id", "end_id", "source", "owner", "owner_state", "activation", "checkpoint"]
[[checks.projections]]
columns = ["start_id", "end_id", "owner", "owner_state", "activation", "checkpoint"]
order = "source"
expected = [["STD-0487", "STD-0512", "profiles/applications/launcher.md", "exists", "owner-review", "full-suite"]]
[checks.projections.where]
field = "order"
op = "eq"
value = "14"

[[checks]]
id = "accelerated-package"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-accelerated-packages.tsv"
header = ["train_order", "package_id", "risk_class", "owner", "owner_action", "verification_family", "draft_mode", "integration_gate", "semantic_outcome", "prerequisites"]
[[checks.projections]]
columns = ["train_order", "package_id", "risk_class", "owner", "owner_action", "verification_family", "integration_gate", "semantic_outcome", "prerequisites"]
order = "source"
expected = [["14", "P09", "refinement", "profiles/applications/launcher.md", "existing-review", "decision-table", "full-suite", "launcher-row-decomposition", "core,workflow.verification,workflow.release,topic.resilience,topic.security"]]
[checks.projections.where]
field = "train_order"
op = "eq"
value = "14"

[[checks]]
id = "decomposition"
type = "table"
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
non_empty = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
unique = [["baseline_order", "child_order"]]
[[checks.projections]]
columns = ["child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "owner_transition"]
order = "source"
expected = [
  ["1", "STD-0487,STD-0488,STD-0489,STD-0490,STD-0491,STD-0492,STD-0493,STD-0494,STD-0499,STD-0501,STD-0502,STD-0503,STD-0504,STD-0505,STD-0506,STD-0507,STD-0511,STD-0512", "LAUNCHER-STANDARDS.md", "profiles/applications/launcher.md", "exists", "pre-slice-review", "focused", "none"],
  ["2", "STD-0495", "LAUNCHER-STANDARDS.md", "workflows/verification.md", "exists", "pre-slice-review", "focused", "none"],
  ["3", "STD-0496,STD-0497,STD-0498", "LAUNCHER-STANDARDS.md", "topics/dependencies.md", "exists", "pre-slice-review", "focused", "none"],
  ["4", "STD-0500", "LAUNCHER-STANDARDS.md", "workflows/release.md", "exists", "pre-slice-review", "focused", "none"],
  ["5", "STD-0508,STD-0509,STD-0510", "LAUNCHER-STANDARDS.md", "topics/security.md", "exists", "pre-slice-review", "focused", "none"],
]
[checks.projections.where]
field = "baseline_order"
op = "eq"
value = "14"
[[checks.projections]]
columns = ["ids"]
order = "lexical"
expected = [
  ["STD-0487"], ["STD-0488"], ["STD-0489"], ["STD-0490"], ["STD-0491"], ["STD-0492"], ["STD-0493"],
  ["STD-0494"], ["STD-0495"], ["STD-0496"], ["STD-0497"], ["STD-0498"], ["STD-0499"], ["STD-0500"],
  ["STD-0501"], ["STD-0502"], ["STD-0503"], ["STD-0504"], ["STD-0505"], ["STD-0506"], ["STD-0507"],
  ["STD-0508"], ["STD-0509"], ["STD-0510"], ["STD-0511"], ["STD-0512"],
]
[checks.projections.where]
field = "baseline_order"
op = "eq"
value = "14"
[checks.projections.split]
field = "ids"
delimiter = ","

[[checks]]
id = "canonical-owner-paths"
type = "repository_paths"
[checks.paths]
path = "evaluation/standards-effectiveness/milestone-7-execution-decomposition.tsv"
header = ["baseline_order", "child_order", "ids", "source", "owner", "owner_state", "activation", "checkpoint", "rationale", "owner_transition"]
columns = ["owner"]
order = "source"
where = { field = "baseline_order", op = "eq", value = "14" }

[[checks]]
id = "decomposition-report"
type = "text"
path = "docs/plans/standards-library-effectiveness/reports/milestone-7-row-14-decomposition.md"
required = [
  "do not share one canonical owner",
  "### Child 14.1: Launcher Population And Structural Closure",
  "### Child 14.2: GUI Smoke Acceptance",
  "### Child 14.3: Dependencies Owner And Population",
  "### Child 14.4: Build Procedure",
  "### Child 14.5: Generated Command Security",
  "successful build no-ops",
  "typed outcomes",
  "no normative or legacy standard",
]
prohibited = []

[[checks]]
id = "readme-projection"
type = "text"
path = "evaluation/standards-effectiveness/verification-guide.md"
required = [
  "`launcher-owner-row-14` suite establish the Launcher application profile",
  "exact five-child row-14 decomposition",
]
prohibited = ["`verify-launcher-owner-contract.sh` establish the Launcher application profile"]
