schema_version = 1
id = "testing-coverage-documentation"
owner = "workflow.verification"
description = "Coverage interpretation and durable evidence records without percentage, exclusion-list, inline-comment, template, documentation, or tool-success fallback."

[[checks]]
id = "decisions"
type = "decision"
path = "evaluation/standards-effectiveness/fixtures/verification/coverage-documentation-decisions.tsv"
expected_column = "expected"
default = "allow"
[checks.domains]
case = ["*"]
claim = ["named"]
metric = ["branch", "contradictory", "line", "none", "unsupported"]
scope = ["bounded", "fixture"]
authority = ["contradictory", "missing", "owned"]
baseline = ["applicable", "missing", "none"]
context = ["missing", "recorded", "recoverable"]
substitute = ["conventional-exclusions", "diagram-required", "documentation-proof", "fixed-percent", "high-coverage", "inline-required", "none", "tool-success"]
expected = ["allow", "typed-invalid", "typed-unavailable", "typed-unsupported"]
[[checks.rules]]
outcome = "typed-invalid"
[checks.rules.when]
any = [
  { field = "substitute", op = "ne", value = "none" },
  { field = "metric", op = "eq", value = "contradictory" },
  { field = "authority", op = "eq", value = "contradictory" },
]
[[checks.rules]]
outcome = "typed-unsupported"
[checks.rules.when]
all = [{ field = "metric", op = "eq", value = "unsupported" }]
[[checks.rules]]
outcome = "typed-unavailable"
[checks.rules.when]
any = [
  { field = "authority", op = "eq", value = "missing" },
  { field = "baseline", op = "eq", value = "missing" },
  { field = "context", op = "eq", value = "missing" },
]


[[checks]]
id = "dispositions-records"
type = "table"
path = "evaluation/standards-effectiveness/consolidation-dispositions.tsv"
header = ["id", "source", "target", "disposition", "rationale"]
non_empty = []
unique = []
projections = [{"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0625", "TESTING-STANDARDS.md", "workflows/verification.md", "index"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0625"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0626", "TESTING-STANDARDS.md", "workflows/verification.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0626"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0627", "TESTING-STANDARDS.md", "workflows/verification.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0627"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0628", "TESTING-STANDARDS.md", "workflows/verification.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0628"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0629", "TESTING-STANDARDS.md", "workflows/verification.md", "index"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0629"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0630", "TESTING-STANDARDS.md", "workflows/verification.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0630"}]}}, {"columns" = ["id", "source", "target", "disposition"], "order" = "lexical", "expected" = [["STD-0631", "TESTING-STANDARDS.md", "workflows/verification.md", "refine"]], "where" = {"all" = [{"field" = "id", "op" = "eq", "value" = "STD-0631"}]}}]
