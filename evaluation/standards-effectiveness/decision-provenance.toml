se an unambiguous selection after checking state/lifecycle/authority, while machine arguments remain explicit; failed checks are repaired within an otherwise valid decision boundary, and replan when decisions change or the slice cannot deliver. Early real observation now precedes expansion around a design-invalidating external assumption. Existing written-plan applicability and active fields are retained. Projection-completeness revision two retains generic consumer coherence while the Engine-specific graph procedure is relocated to the normative authoring-only workflow. The original motives for individual older clauses were not independently established.", reconsideration = ["Review when consumer evidence shows an omitted boundary, weakened invariant, excessive procedure, or ineffective wording."], retired = false, subject = "workflow.planning", subject_binding = "sha256:379b24ce287bcbc080c6dee12d26ace4b1abcf10866ab684069be633a0433c49", supersedes = [] }, { alternatives = [], assumptions = [], evidence = [{ digest = "sha256:279e1aa02b7e5f3ca81989a7b19bc71cdce0e30e67304e6364cbb009f59aa185", id = "docs/guides/positive-guidance-and-provenance.md", provider_contract = "repository-content", provider_contract_version = "1" }], id = "provenance.workflow.standards-authoring.positive-guidance", limits = ["This records current justification and the observed relocation, not historical origins of older requirements.", "The workflow has no application exposure approval; its authoring role is deliberate."], origin = "current-justification", rationale = "Guide G1–G4 and G9 require operational sufficiency, supporting-content separation, explicit consumer relationships and truthful reasoning. The graph-maintenance procedure previously resided in Planning's projection-completeness section; this change retains that procedure in a normative authoring owner and keeps it outside application exposure. Generic consumer coherence remains in Planning revision two. Independent review identified the need to separate this maintenance knowledge.", reconsideration = ["Revise when the authoring contract, real consumer inventory or publication boundary changes."], retired = false, subject = "workflow.standards-authoring", subject_binding = "sha256:11e875f0ee0c108167aeb6ea94ca9bb92e9036683a7b74a722ada7d9757d6fff", supersedes = [] }, { alternatives = ["The earlier text repeatedly enumerated disallowed tools, layouts, fallback evidence and generic defaults. The candidate retains the relevant boundaries as operational conditions.", "The project-specific choice to discontinue backward compatibility is not made a universal requirement."], assumptions = ["Actual task conditions select applicability; adopted project contracts and external requirements retain authority."], evidence = [{ digest = "sha256:279e1aa02b7e5f3ca81989a7b19bc71cdce0e30e67304e6364cbb009f59aa185", id = "docs/guides/positive-guidance-and-provenance.md", provider_contract = "repository-content", provider_contract_version = "1" }], id = "provenance.workflow.tooling.positive-guidance", limits = ["Original motives for individual older clauses were not established.", "This review supports operational sufficiency and consistency, not improved model behavior; the separate effectiveness pilots own that claim."], origin = "current-justification", rationale = "Current justification based on guide revision 1 and accepted source 1d183e9e4b3195243f253625972b8a096e5c2875. Tooling owns automation mechanisms and scheduling under the repository's requirements. The guide supports replacing repeated lists of forbidden conventional tools with conditional reuse and evidenced reconsideration. Hook inputs/authority, formatting scope, CI dependencies/cancellation/results, debt identity, cache invalidation and diagnostics remain explicit. Tool-debt guidance consumes Verification's new failing-baseline observation rule so retained debt is not mistaken for acceptance. The original motives for individual older clauses were not independently established.", reconsideration = ["Review when consumer evidence shows an omitted boundary, weakened invariant, excessive procedure, or ineffective wording."], retired = false, subject = "workflow.tooling", subject_binding = "sha256:fc8b0a72918d2b9e19b1709ffd18624ded880c9ce1a2ff08ef25c47f310117af", supersedes = [] }, { alternatives = ["Retain the current wording and rely on Core precedence; this leaves the reported usability ambiguity."], assumptions = ["Adopting projects retain authority over required claims, environment obligations, release thresholds and fresh-execution gates."], evidence = [{ digest = "sha256:360f1c9ddb4631c98695f5368b1e0c2a029a5093ed139c40b5da78ec1c7b93a0", id = "docs/proposals/evidence-ledger-audit/README.md", provider_contract = "repository-content", provider_contract_version = "1" }, { digest = "sha256:c701c6c6d38767d5a765521068fa57fb395f2c3bd44ebabf4da1ef5fc2c3a04d", id = "docs/proposals/evidence-ledger-audit/source-audit.pdf", provider_contract = "repository-content", provider_contract_version = "1" }], id = "provenance.workflow.verification.evidence-ledger-audit", limits = ["Historical downstream runtime results were not reproduced. The audit does not establish that standards wording caused particular incidents.", "The change adds no universal hash, receipt, fresh test, review cadence, isolation, or ledger requirement. Actual downstream effectiveness remains unmeasured."], origin = "current-justification", rationale = "The maintainer-supplied 22 October 2026 audit identifies ambiguities in existing evidence and proportionality rules. Make the bounded clarifications recorded in the supporting scope; preserve existing failed outcomes, project gate authority, adequate proof and historical records.", reconsideration = ["Reassess if downstream application still confuses evidence validity with repetition or introduces unnecessary machinery."], retired = false, subject = "workflow.verification", subject_binding = "sha256:de66077c14cf464c2db246e914758f813b660da951b6747793ea4600ccc36fe9", supersedes = [] }, { alternatives = ["The earlier text repeatedly enumerated disallowed tools, layouts, fallback evidence and generic defaults. The candidate retains the relevant boundaries as operational conditions.", "The project-specific choice to discontinue backward compatibility is not made a universal requirement."], assumptions = ["Actual task conditions select applicability; adopted project contracts and external requirements retain authority."], evidence = [{ digest = "sha256:279e1aa02b7e5f3ca81989a7b19bc71cdce0e30e67304e6364cbb009f59aa185", id = "docs/guides/positive-guidance-and-provenance.md", provider_contract = "repository-content", provider_contract_version = "1" }], id = "provenance.workflow.verification.positive-guidance", limits = ["Original motives for individual older clauses were not established.", "This review supports operational sufficiency and consistency, not improved model behavior; the separate effectiveness pilots own that claim."], origin = "current-justification", rationale = "Current justification based on guide revision 1 and accepted source 1d183e9e4b3195243f253625972b8a096e5c2875. Verification owns observable claims, evidence kinds, environment and execution qualifications, direct acceptance paths, and evidence limits. The registered acceptance-claims scope remains unchanged. The guide supports explicitly obtaining design-changing real observations before dependent expansion, observing complete consumer results, and proving that evidence under a failing baseline reaches changed behavior. Other edits shorten catalogs of rejected defaults while retaining domain-derived cases, fixture authority/lifecycle, async terminal outcomes, supported execution, and unsatisfied-claim reporting. The original motives for individual older clauses were not independently established.", reconsideration = ["Review when consumer evidence shows an omitted boundary, weakened invariant, excessive procedure, or ineffective wording."], retired = false, subject = "workflow.verification", subject_binding = "sha256:b6c2070616221befd4a12ceaf49fa878aa78e6803cf681e1b42b9aea8ce019e6", supersedes = [] }]
