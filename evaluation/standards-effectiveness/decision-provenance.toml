ot claim executable scenario coverage or independent material review."], origin = "current-justification", rationale = "The user requested adaptive discovery, a responsive main agent, bounded concurrent research, a separate local visual writer, explain-back and canonical decision authority. The user defined substantial discovery through iterative shared understanding rather than task size, difficulty or visual preference.", reconsideration = ["Reconsider when downstream tasks demonstrate excessive ceremony, missed discovery entry, ambiguity in the substantial-discovery trigger, or competing decision authority."], retired = false, subject = "workflow.planning.discovery", subject_binding = "sha256:78235d0b5b84c89be407d10f571d0d8685b8e77a2b0b2436f663d18bdbe15a0f", supersedes = [] }, { alternatives = ["A separate peer discovery workflow was considered; keeping discovery under Planning preserves one transition owner.", "Task size, implementation difficulty and a prior preference for visualization do not decide substantial discovery."], assumptions = ["Actual uncertainty and available independent agent capability determine how discovery proceeds.", "The draft is proposed policy, with independent review and adoption evidence still required."], evidence = [{ digest = "sha256:c7274bf8960c8f3035135416d658258fa3f872a79820365529e46f1dc3e6c3f7", id = "docs/proposals/planning-discovery/intent-and-review.txt", provider_contract = "repository-content", provider_contract_version = "1" }, { digest = "sha256:effe747bf46ff3c6c773b65b706b031a1b74bd5973ea247e89d3d4d1ca042892", id = "docs/proposals/planning-discovery/source-draft.txt", provider_contract = "repository-content", provider_contract_version = "1" }], id = "provenance.workflow.planning.planning-discovery", limits = ["Static review and recorded user intent do not establish improved agent behavior.", "This revision does not claim executable scenario coverage or independent material review."], origin = "current-justification", rat