records = [{ alternatives = ["The prior Core expressed several invariants through catalogs of forbidden defaults, fake success and detached work. Those catalogs are replaced by the resulting obligations while their technical boundaries remain explicit."], assumptions = ["Existing project contracts, external requirements and authorized exceptions continue to govern.", "The owner selected positive operational guidance and authoring-only reasoning as presentation goals."], evidence = [{ digest = "sha256:279e1aa02b7e5f3ca81989a7b19bc71cdce0e30e67304e6364cbb009f59aa185", id = "docs/guides/positive-guidance-and-provenance.md", provider_contract = "repository-content", provider_contract_version = "1" }], id = "provenance.core.positive-guidance", limits = ["This is current engineering justification, not reconstructed original history.", "Editorial and structural review do not establish improved downstream agent behavior; the planned independent pilots own that claim."], origin = "current-justification", rationale = "Current audit of Core at accepted revision 1d183e9e4b3195243f253625972b8a096e5c2875 against guide revision 1. Core protects objective fidelity, semantic ownership, authority, failure meaning, retained state, lifecycle completion and direct acceptance. The rewrite expresses those constraints as correct actions. Contract evolution explicitly permits a better supported design with owned cutover and retained-state dispositions; it does not impose the motivating project's choice to drop all backward compatibility. Original historical motives for individual rules were not established by this audit.", reconsideration = ["Revise when an actual consumer, lifecycle failure, external requirement or effectiveness pilot demonstrates that a rule is incomplete, misleading or disproportionate."], retired = false, subject = "core", subject_binding = "sha256:1c7203d64e6607c23f012f8f208c34b3015d65b515f7a5a6361804eb35535511", supersedes = [] }, { alternatives = ["The earlier text r