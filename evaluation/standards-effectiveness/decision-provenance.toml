epeatedly enumerated disallowed tools, layouts, fallback evidence and generic defaults. The candidate retains the relevant boundaries as operational conditions.", "The project-specific choice to discontinue backward compatibility is not made a universal requirement."], assumptions = ["Actual task conditions select applicability; adopted project contracts and external requirements retain authority."], evidence = [{ digest = "sha256:279e1aa02b7e5f3ca81989a7b19bc71cdce0e30e67304e6364cbb009f59aa185", id = "docs/guides/positive-guidance-and-provenance.md", provider_contract = "repository-content", provider_contract_version = "1" }], id = "provenance.reference.routing.bounded-rust-repair.positive-guidance", limits = ["Original motives for individual older clauses were not established.", "This review supports operational sufficiency and consistency, not improved model behavior; the separate effectiveness pilots own that claim."], origin = "current-justification", rationale = "Current justification based on guide revision 1 and accepted source 1d183e9e4b3195243f253625972b8a096e5c2875. This reference preserves the explicit one-module Rust library parser-repair scenario previously documented in Router at accepted source 1d183e9e4b3195243f253625972b8a096e5c2875. It illustrates the six selected owners and condition-driven exclusions without adding obligations. Moving the example keeps a specific language/task scenario optional while preserving its usefulness when those facts actually hold. The original motives for individual older clauses were not independently established.", reconsideration = ["Review when consumer evidence shows an omitted boundary, weakened invariant, excessive procedure, or ineffective wording."], retired = false, subject = "reference.routing.bounded-rust-repair", subject_binding = "sha256:139ed04b166f0217e160bf9bdf1743390a6e7a342f32d58bc5ea794913336a83", supersedes = [] }, { alternatives = ["Retain the current wording and rely on Core precedence; this leaves the reported usability ambiguity."], assumptions = ["Adopting projects retain authority over required claims, environment obligations, release thresholds and fresh-execution gates."], evidence = [{ digest = "sha256:360f1c9ddb4631c98695f5368b1e0c2a029a5093ed139c40b5da78ec1c7b93a0", id = "docs/proposals/evidence-ledger-audit/README.md", provider_contract = "repository-content", provider_contract_version = "1" }, { digest = "sha256:c701c6c6d38767d5a765521068fa57fb395f2c3bd44ebabf4da1ef5fc2c3a04d", id = "docs/proposals/evidence-ledger-audit/source-audit.pdf", provider_contract = "repository-content", provider_contract_version = "1" }], id = "provenance.router.evidence-ledger-audit", limits = ["Historical downstream runtime results were not reproduced. The audit does not establish that standards wording caused particular incidents.", "The change adds no universal hash, receipt, fresh test, review cadence, isolation, or ledger requirement. Actual downstream effectiveness remains unmeasured."], origin = "current-justification", rationale = "The maintainer-supplied 22 October 2026 audit identifies ambiguities in existing evidence and proportionality rules. Make the bounded clarifications recorded in the supporting scope; preserve existing failed outcomes, project gate authority, adequate proof and historical records.", reconsideration = ["Reassess if downstream application still confuses evidence validity with repetition or introduces unnecessary machinery."], retired = false, subject = "router", subject_binding = "sha256:d2e9897d25671f1f9ae0d2dbd18d06bcf3e72d61bf747c2544c876a0081c19b6", supersedes = [] }, { alternatives = ["A separate peer discovery workflow was considered; keeping discovery under Planning preserves one transition owner.", "Task size, implementation difficulty and a prior preference for visualization do not decide substantial discovery."], assumptions = ["Actual uncertainty and available independent agent capability determine how discovery proceeds.", "